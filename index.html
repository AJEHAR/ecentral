// ── MappingPanel — dropdown ASC + search DSKP ──
// ── MyMappingPanel — cikgu tetapkan mapping subjek+kelas → DSKP ──
const MyMappingPanel = ({ slotList, myMappings, dskpSubjeksFull, loading, onSave, getMyMapping, showToast, user }) => {
  const [saving,     setSaving]     = useState('');
  const [dskpSearch, setDskpSearch] = useState('');
  const [selSlotKey, setSelSlotKey] = useState(''); // 'subjekAsc||kelasNama'
  const [dskpTahunOptions, setDskpTahunOptions] = useState([]);

  // Dapatkan tahun unik dari DSKP untuk subjek tertentu
  const getTahunForDskp = (dskpSubjek) => {
    if (!dskpSubjek) return [];
    // Kita perlu fetch dari server — gunakan state ringkas
    return ['1','2','3','4','5','6','PRA'];
  };

  const mappedCount = slotList.filter(s => {
    const m = getMyMapping(s.subjekAsc, s.kelasNama);
    return m?.dskpSubjek;
  }).length;

  const handleSave = async (subjekAsc, kelasNama, dskpSubjek, dskpTahun) => {
    const key = `${subjekAsc}||${kelasNama}`;
    setSaving(key);
    try {
      await onSave(subjekAsc, kelasNama, dskpSubjek, dskpTahun);
    } catch(e) { showToast(String(e),'error'); }
    setSaving('');
  };

  const dskpFiltered = dskpSubjeksFull.filter(d =>
    !dskpSearch || d.toLowerCase().includes(dskpSearch.toLowerCase())
  );

  if (loading) return <div className="flex justify-center py-10"><Icon name="Loader2" size={24} className="animate-spin text-purple-400"/></div>;

  if (slotList.length === 0) return (
    <div className="text-center py-10 text-slate-400 space-y-2">
      <Icon name="AlertTriangle" size={28} className="mx-auto opacity-40"/>
      <p className="text-sm">Tiada data jadual. Sila tetapkan nama ASC dalam ⚙ Setting RPH dahulu.</p>
    </div>
  );

  // Group by subjekAsc
  const grouped = {};
  slotList.forEach(s => {
    if (!grouped[s.subjekAsc]) grouped[s.subjekAsc] = [];
    grouped[s.subjekAsc].push(s);
  });

  return (
    <div className="space-y-4">
      {/* Stats */}
      <div className="grid grid-cols-3 gap-2">
        <div className="bg-slate-50 rounded-xl p-3 text-center">
          <p className="text-xl font-black text-slate-700">{slotList.length}</p>
          <p className="text-[10px] text-slate-400 font-bold">Subjek+Kelas</p>
        </div>
        <div className="bg-green-50 rounded-xl p-3 text-center">
          <p className="text-xl font-black text-green-700">{mappedCount}</p>
          <p className="text-[10px] text-green-600 font-bold">Sudah dipetakan</p>
        </div>
        <div className="bg-amber-50 rounded-xl p-3 text-center">
          <p className="text-xl font-black text-amber-700">{slotList.length - mappedCount}</p>
          <p className="text-[10px] text-amber-600 font-bold">Belum dipetakan</p>
        </div>
      </div>

      <p className="text-xs text-slate-500 bg-blue-50 border border-blue-100 rounded-xl px-3 py-2">
        💡 Tetapkan subjek DSKP dan tahun untuk setiap kombinasi subjek+kelas yang anda ajar. Ini akan auto-load SK/SP yang betul semasa buat RPH.
      </p>

      {/* Senarai subjek yang diajar */}
      {Object.entries(grouped).sort(([a],[b])=>a.localeCompare(b)).map(([subjekAsc, slots]) => (
        <div key={subjekAsc} className="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
          {/* Header subjek */}
          <div className="px-4 py-3 bg-slate-50 border-b border-slate-100">
            <p className="text-sm font-black text-slate-800">{subjekAsc}</p>
            <p className="text-[10px] text-slate-400">{slots.length} kelas</p>
          </div>

          {/* Row setiap kelas */}
          <div className="divide-y divide-slate-50">
            {slots.map(slot => {
              const key = `${slot.subjekAsc}||${slot.kelasNama}`;
              const m = getMyMapping(slot.subjekAsc, slot.kelasNama);
              const isSaving = saving === key;
              const isExpanded = selSlotKey === key;

              return (
                <div key={key}>
                  {/* Row kelas */}
                  <button onClick={()=>setSelSlotKey(isExpanded?'':key)}
                    className={`w-full flex items-center gap-3 px-4 py-3 text-left transition ${isExpanded?'bg-purple-50':''} hover:bg-slate-50`}>
                    <div className={`w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 text-xs font-black ${m?.dskpSubjek?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'}`}>
                      {slot.tahun||'?'}
                    </div>
                    <div className="flex-1 min-w-0">
                      <p className="text-xs font-black text-slate-800">{slot.kelasNama}</p>
                      {m?.dskpSubjek
                        ? <p className="text-[10px] text-green-600 font-bold">✓ {m.dskpSubjek} · Tahun {m.dskpTahun||slot.tahun}</p>
                        : <p className="text-[10px] text-amber-500">Belum dipetakan — klik untuk tetapkan</p>}
                    </div>
                    <Icon name={isExpanded?'ChevronUp':'ChevronDown'} size={14} className="text-slate-400 flex-shrink-0"/>
                  </button>

                  {/* Panel tetapan — expandable */}
                  {isExpanded && (
                    <div className="bg-purple-50/50 border-t border-purple-100 p-4 space-y-3">
                      {/* Search DSKP */}
                      <input value={dskpSearch} onChange={e=>setDskpSearch(e.target.value)}
                        placeholder="🔍 Cari nama subjek DSKP..."
                        className="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400 bg-white"/>

                      {/* Dropdown subjek DSKP */}
                      <div>
                        <label className="text-[10px] font-black text-slate-500 uppercase tracking-wider">Subjek DSKP</label>
                        <select
                          value={m?.dskpSubjek||''}
                          onChange={e => handleSave(slot.subjekAsc, slot.kelasNama, e.target.value, m?.dskpTahun||slot.tahun||'')}
                          disabled={isSaving}
                          className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-purple-400 bg-white disabled:opacity-60">
                          <option value="">-- Pilih subjek DSKP --</option>
                          {dskpFiltered.map(d => <option key={d} value={d}>{d}</option>)}
                        </select>
                      </div>

                      {/* Dropdown tahun DSKP */}
                      {m?.dskpSubjek && (
                        <div>
                          <label className="text-[10px] font-black text-slate-500 uppercase tracking-wider">Tahun dalam DSKP</label>
                          <select
                            value={m?.dskpTahun||slot.tahun||''}
                            onChange={e => handleSave(slot.subjekAsc, slot.kelasNama, m?.dskpSubjek||'', e.target.value)}
                            disabled={isSaving}
                            className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-purple-400 bg-white disabled:opacity-60">
                            <option value="">-- Pilih tahun --</option>
                            {['1','2','3','4','5','6','PRA','PRA SEKOLAH'].map(t => <option key={t} value={t}>{t}</option>)}
                          </select>
                          <p className="text-[10px] text-slate-400 mt-1">Pilih tahun dalam DSKP yang berpadanan dengan kelas ini.</p>
                        </div>
                      )}

                      {isSaving && (
                        <div className="flex items-center gap-2 text-purple-600 text-xs">
                          <Icon name="Loader2" size={12} className="animate-spin"/> Menyimpan...
                        </div>
                      )}
                      {m?.dskpSubjek && !isSaving && (
                        <button onClick={()=>handleSave(slot.subjekAsc, slot.kelasNama, '', '')}
                          className="text-[10px] text-red-400 hover:text-red-600 font-black">
                          ✕ Kosongkan mapping ini
                        </button>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
};

// ── MappingPanel — Admin mapping sekolah ──
const MappingPanel = ({ dskpSubjeksFull, mappingsV2, mapLoading, ascSubjekTahunMap, onSaveMapping, showToast }) => {
  const [selAsc,     setSelAsc]     = useState('');
  const [dskpSearch, setDskpSearch] = useState('');
  const [saving,     setSaving]     = useState(''); // 'subjek|tahun' yg sedang saving

  const ascSubjekList = Object.keys(ascSubjekTahunMap).sort();
  const tahunForSel   = selAsc ? (ascSubjekTahunMap[selAsc] || []) : [];

  // Kira stats — berapa pasangan subjek+tahun sudah mapped
  const totalPairs   = Object.values(ascSubjekTahunMap).reduce((s,t)=>s+t.length, 0);
  const mappedPairs  = Object.entries(mappingsV2).reduce((s,[asc,tahunMap]) => s + Object.values(tahunMap).filter(v=>v).length, 0);

  // Kira berapa subjek ASC yang semua tahunnya sudah mapped
  const fullyMapped  = ascSubjekList.filter(a => {
    const tahuns = ascSubjekTahunMap[a] || [];
    return tahuns.length > 0 && tahuns.every(t => mappingsV2[a]?.[t]);
  }).length;

  const getMappedDskp = (asc, tahun) => mappingsV2[asc]?.[tahun] || '';

  const handleSelect = async (asc, tahun, dskpNama) => {
    const key = `${asc}|${tahun}`;
    setSaving(key);
    try {
      await onSaveMapping(asc, tahun, dskpNama);
    } catch(e) { showToast(String(e),'error'); }
    setSaving('');
  };

  const dskpFiltered = dskpSubjeksFull.filter(d =>
    !dskpSearch || d.toLowerCase().includes(dskpSearch.toLowerCase())
  );

  if (mapLoading) return <div className="flex justify-center py-10"><Icon name="Loader2" size={24} className="animate-spin text-purple-400"/></div>;
  if (ascSubjekList.length === 0) return (
    <div className="text-center py-10 text-slate-400 text-sm">
      <Icon name="AlertTriangle" size={28} className="mx-auto mb-2 opacity-40"/>
      Tiada data subjek ASC. Sila upload jadual XML dahulu.
    </div>
  );

  return (
    <div className="space-y-4">
      {/* Stats */}
      <div className="grid grid-cols-3 gap-2">
        <div className="bg-slate-50 rounded-xl p-3 text-center">
          <p className="text-xl font-black text-slate-700">{ascSubjekList.length}</p>
          <p className="text-[10px] text-slate-400 font-bold">Subjek ASC</p>
        </div>
        <div className="bg-green-50 rounded-xl p-3 text-center">
          <p className="text-xl font-black text-green-700">{fullyMapped}</p>
          <p className="text-[10px] text-green-600 font-bold">Lengkap dipetakan</p>
        </div>
        <div className="bg-amber-50 rounded-xl p-3 text-center">
          <p className="text-xl font-black text-amber-700">{ascSubjekList.length - fullyMapped}</p>
          <p className="text-[10px] text-amber-600 font-bold">Perlu perhatian</p>
        </div>
      </div>

      {/* Step 1 — Pilih Subjek ASC */}
      <div>
        <label className="text-xs font-black text-slate-500 uppercase tracking-wider">1. Pilih Subjek ASC</label>
        <select value={selAsc} onChange={e=>{ setSelAsc(e.target.value); setDskpSearch(''); }}
          className={_SC}>
          <option value="">-- Pilih subjek dari jadual ASC --</option>
          {ascSubjekList.map(a => {
            const tahuns = ascSubjekTahunMap[a] || [];
            const allMapped = tahuns.length > 0 && tahuns.every(t => mappingsV2[a]?.[t]);
            const someMapped = tahuns.some(t => mappingsV2[a]?.[t]);
            const icon = allMapped ? '✅' : someMapped ? '🟡' : '⬜';
            return <option key={a} value={a}>{icon} {a} (Thn {tahuns.join(', ')})</option>;
          })}
        </select>
      </div>

      {/* Step 2 — Row untuk setiap tahun */}
      {selAsc && tahunForSel.length > 0 && (
        <div className="space-y-3">
          <label className="text-xs font-black text-slate-500 uppercase tracking-wider">2. Petakan ke Subjek DSKP ikut Tahun</label>

          {/* Search DSKP */}
          <input value={dskpSearch} onChange={e=>setDskpSearch(e.target.value)}
            placeholder="🔍 Tapis nama subjek DSKP..."
            className="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400 bg-slate-50"/>

          {/* Row setiap tahun */}
          <div className="space-y-2">
            {tahunForSel.map(tahun => {
              const currentDskp = getMappedDskp(selAsc, tahun);
              const key = `${selAsc}|${tahun}`;
              const isSaving = saving === key;
              return (
                <div key={tahun} className="border border-slate-200 rounded-xl overflow-hidden">
                  {/* Header row */}
                  <div className={`flex items-center justify-between px-3 py-2.5 ${currentDskp?'bg-green-50':'bg-amber-50'}`}>
                    <div className="flex items-center gap-2">
                      <span className={`text-xs font-black px-2.5 py-1 rounded-lg ${currentDskp?'bg-green-200 text-green-800':'bg-amber-200 text-amber-800'}`}>
                        Tahun {tahun}
                      </span>
                      {currentDskp
                        ? <span className="text-xs font-black text-green-700">✓ {currentDskp}</span>
                        : <span className="text-xs text-amber-600">Belum dipetakan</span>}
                    </div>
                    <div className="flex items-center gap-1.5">
                      {isSaving && <Icon name="Loader2" size={12} className="animate-spin text-purple-500"/>}
                      {currentDskp && (
                        <button onClick={()=>handleSelect(selAsc, tahun, '')} className="text-[10px] text-red-400 hover:text-red-600 font-black px-1.5">✕ Kosong</button>
                      )}
                    </div>
                  </div>
                  {/* Senarai DSKP */}
                  <div className="max-h-44 overflow-y-auto divide-y divide-slate-50 bg-white">
                    {dskpFiltered.length === 0
                      ? <p className="text-center py-3 text-xs text-slate-400">Tiada hasil carian.</p>
                      : dskpFiltered.map(dNama => {
                          const isOn = currentDskp === dNama;
                          return (
                            <button key={dNama} onClick={()=>handleSelect(selAsc, tahun, isOn?'':dNama)} disabled={isSaving}
                              className={`w-full flex items-center gap-3 px-3 py-2.5 text-left transition ${isOn?'bg-purple-50':'hover:bg-slate-50'} disabled:opacity-50`}>
                              <div className={`w-4 h-4 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${isOn?'bg-purple-600 border-purple-600':'border-slate-300'}`}>
                                {isOn && <div className="w-1.5 h-1.5 bg-white rounded-full"/>}
                              </div>
                              <span className={`text-xs font-bold ${isOn?'text-purple-700':'text-slate-700'}`}>{dNama}</span>
                            </button>
                          );
                        })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {selAsc && tahunForSel.length === 0 && (
        <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-700">
          Tiada maklumat tahun untuk subjek ini dalam jadual ASC.
        </div>
      )}
    </div>
  );
};

// ── DSKP Settings Modal (Import + Bank + Mapping) ──
const DskpSettingsModal = ({ user, showToast, onClose, ascSubjekList }) => {
  const isAdmin = user.role === 'Admin' || user.role === 'Pentadbir';
  const [tab, setTab] = useState(isAdmin ? 'import' : 'mapping_saya');
  // --- Import tab ---
  const [csvFile,      setCsvFile]      = useState(null);
  const [importing,    setImporting]    = useState(false);
  const [importResult, setImportResult] = useState(null);
  const [clearFirst,   setClearFirst]   = useState(true);
  const csvRef = useRef(null);
  // --- Bank tab ---
  const [bankList,    setBankList]    = useState([]);
  const [bankLoading, setBankLoading] = useState(false);
  const [fSubjek,     setFSubjek]     = useState('');
  const [fTahun,      setFTahun]      = useState('');
  const [fSearch,     setFSearch]     = useState('');
  const [dskpSubjeks, setDskpSubjeks] = useState([]);
  // --- Mapping tab ---
  const [mappingsV2,      setMappingsV2]      = useState({});
  const [ascSubjekTahunMap, setAscSubjekTahunMap] = useState({});
  const [mapLoading,   setMapLoading]   = useState(false);
  const [dskpSubjeksFull, setDskpSubjeksFull] = useState([]);
  // --- Mapping Saya tab ---
  const [myMappings,    setMyMappings]    = useState([]); // [{subjekAsc,kelasNama,dskpSubjek,dskpTahun}]
  const [mySlotList,    setMySlotList]    = useState([]); // [{subjekAsc,kelasNama,tahun}]
  const [myMapLoading,  setMyMapLoading]  = useState(false);

  useEffect(() => {
    apiCall('getDskpSubjekList').then(r => { if(Array.isArray(r)){setDskpSubjeks(r);setDskpSubjeksFull(r);} }).catch(()=>{});
    if (tab === 'bank') loadBank();
    if (tab === 'mapping') loadMapping();
    if (tab === 'mapping_saya') loadMyMapping();
  }, [tab]);

  // ── Import ──
  const loadBank = () => {
    setBankLoading(true);
    apiCall('getDskpList', fSubjek).then(r=>{ setBankList(Array.isArray(r)?r:[]); setBankLoading(false); }).catch(()=>setBankLoading(false));
  };
  useEffect(() => { if(tab==='bank') loadBank(); }, [fSubjek]);

  const handleImport = async () => {
    if (!csvFile) { showToast('Pilih fail CSV dahulu.','warning'); return; }
    setImporting(true); setImportResult(null);
    try {
      // Parse CSV dalam browser
      const text = await csvFile.text();
      const lines = text.split(/\r?\n/);
      const headers = lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
      const iSubjek = headers.findIndex(h=>h==='SUBJEK');
      const iTahun  = headers.findIndex(h=>h==='TAHUN');
      const iSK     = headers.findIndex(h=>h==='SK');
      const iSP     = headers.findIndex(h=>h==='SP');
      const iTema   = headers.findIndex(h=>h.includes('TEMA')||h.includes('BIDANG'));
      const iTajuk  = headers.findIndex(h=>h==='TAJUK'||h.includes('TAJUK'));

      const parseRow = line => {
        const cols = []; let cur='', inQ=false;
        for (let c of line) { if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){cols.push(cur.trim());cur='';}else{cur+=c;} }
        cols.push(cur.trim()); return cols;
      };

      const rows = [];
      for (let i=1;i<lines.length;i++) {
        if (!lines[i].trim()) continue;
        const cols = parseRow(lines[i]);
        const subjek = cols[iSubjek]||''; const sk = cols[iSK]||'';
        if (!subjek.trim() || !sk.trim()) continue;
        if (['JADUAL WAKTU','TIADA','-'].includes(subjek.trim())) continue;
        rows.push({ subjek: subjek.trim(), tahun: cols[iTahun]||'', sk: sk.trim(), sp: (cols[iSP]||'').trim(), tema: iTema>=0?(cols[iTema]||'').trim():'', tajuk: iTajuk>=0?(cols[iTajuk]||'').trim():'', addedBy: user.fullName });
      }

      if (rows.length === 0) { showToast('Tiada data valid dalam CSV.','error'); setImporting(false); return; }

      if (clearFirst) {
        await apiCall('clearDskpData');
      }

      // Hantar dalam batch 500
      const BATCH = 500;
      let total = 0;
      for (let i=0;i<rows.length;i+=BATCH) {
        const batch = rows.slice(i, i+BATCH);
        const res = await apiCall('importDskpBatch', JSON.stringify(batch));
        total += res.inserted || 0;
        setImportResult({ done: total, total: rows.length, pct: Math.round(total/rows.length*100) });
      }

      showToast(`Berjaya import ${total} SK/SP!`, 'success');
      // Refresh senarai subjek
      apiCall('getDskpSubjekList').then(r=>{ if(Array.isArray(r)){setDskpSubjeks(r);setDskpSubjeksFull(r);} }).catch(()=>{});
    } catch(e) { showToast(String(e),'error'); }
    setImporting(false);
  };

  // ── Mapping ──
  const loadMapping = () => {
    setMapLoading(true);
    Promise.all([
      apiCall('getSubjekMappingsV2'),
      apiCall('getAscSubjekTahunMap'),
      apiCall('getDskpSubjekList'),
    ]).then(([maps, tahunMap, dskpS]) => {
      setMappingsV2(maps && typeof maps==='object' ? maps : {});
      setAscSubjekTahunMap(tahunMap && typeof tahunMap==='object' ? tahunMap : {});
      if (Array.isArray(dskpS)) setDskpSubjeksFull(dskpS);
      setMapLoading(false);
    }).catch(()=>setMapLoading(false));
  };

  const onSaveMapping = async (ascNama, tahun, dskpSubjek) => {
    await apiCall('saveSubjekMappingV2', JSON.stringify({ ascNama, tahun, dskpSubjek }));
    setMappingsV2(prev => ({
      ...prev,
      [ascNama]: { ...(prev[ascNama]||{}), [tahun]: dskpSubjek }
    }));
  };

  const loadMyMapping = async () => {
    setMyMapLoading(true);
    try {
      const mapping = await apiCall('getTeacherAscMapping', user.uid);
      if (!mapping?.ascTeacherId) { setMyMapLoading(false); return; }
      const [slots, maps] = await Promise.all([
        apiCall('getTeacherSubjekKelas', mapping.ascTeacherId),
        apiCall('getDskpMappingByUser', user.uid),
      ]);
      setMySlotList(Array.isArray(slots) ? slots : []);
      setMyMappings(Array.isArray(maps) ? maps : []);
    } catch(e) { showToast(String(e),'error'); }
    setMyMapLoading(false);
  };

  const saveMyMapping = async (subjekAsc, kelasNama, dskpSubjek, dskpTahun) => {
    await apiCall('saveDskpMapping', JSON.stringify({ userId: user.uid, subjekAsc, kelasNama, dskpSubjek, dskpTahun }));
    setMyMappings(prev => {
      const idx = prev.findIndex(m => m.subjekAsc===subjekAsc && m.kelasNama===kelasNama);
      const updated = { subjekAsc, kelasNama, dskpSubjek, dskpTahun };
      if (idx >= 0) return prev.map((m,i) => i===idx ? {...m,...updated} : m);
      return [...prev, updated];
    });
  };

  const getMyMapping = (subjekAsc, kelasNama) =>
    myMappings.find(m => m.subjekAsc===subjekAsc && m.kelasNama===kelasNama) || null;

  const TAHUN_LIST = ['1','2','3','4','5','6','PRA','PRA SEKOLAH'];
  const bankFiltered = bankList.filter(r => {
    const q = fSearch.toLowerCase();
    return (!fTahun || r.tahun===fTahun) &&
      (!fSearch || r.sk.toLowerCase().includes(q) || r.sp.toLowerCase().includes(q) || (r.tema||'').toLowerCase().includes(q));
  });

  return (
    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] flex items-end md:items-center justify-center fade-in" onClick={onClose}>
      <div className="bg-white rounded-t-3xl md:rounded-2xl shadow-2xl w-full md:max-w-3xl slide-up max-h-[95dvh] flex flex-col" onClick={e=>e.stopPropagation()}>
        {/* Header + Tabs */}
        <div className="px-6 pt-5 pb-0 flex-shrink-0">
          <div className="w-10 h-1 bg-slate-300 rounded-full mx-auto md:hidden mb-4"/>
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-black text-slate-800 text-base">📚 DSKP — SK & SP</h3>
            <button onClick={onClose} className="p-1.5 text-slate-400 hover:text-slate-700 transition"><Icon name="X" size={18}/></button>
          </div>
          <div className="flex border-b border-slate-100 gap-1">
            {isAdmin && <button onClick={()=>setTab('import')} className={`px-4 py-2.5 text-xs font-black rounded-t-xl transition ${tab==='import'?'bg-purple-600 text-white':'text-slate-500 hover:text-slate-700'}`}>⬆ Import CSV</button>}
            <button onClick={()=>setTab('bank')} className={`px-4 py-2.5 text-xs font-black rounded-t-xl transition ${tab==='bank'?'bg-purple-600 text-white':'text-slate-500 hover:text-slate-700'}`}>📋 Bank SK/SP</button>
            <button onClick={()=>setTab('mapping_saya')} className={`px-4 py-2.5 text-xs font-black rounded-t-xl transition ${tab==='mapping_saya'?'bg-purple-600 text-white':'text-slate-500 hover:text-slate-700'}`}>🗂️ Mapping Saya</button>
            {isAdmin && <button onClick={()=>setTab('mapping')} className={`px-4 py-2.5 text-xs font-black rounded-t-xl transition ${tab==='mapping'?'bg-purple-600 text-white':'text-slate-500 hover:text-slate-700'}`}>🔗 Mapping Sekolah</button>}
          </div>
        </div>

        {/* Content */}
        <div className="flex-1 overflow-y-auto min-h-0 p-5">

          {/* ── Tab: Import CSV ── */}
          {tab==='import' && (
            <div className="space-y-4">
              <div className="bg-blue-50 border border-blue-100 rounded-xl p-4 text-xs text-blue-800 space-y-1">
                <p className="font-black">Format CSV yang diperlukan:</p>
                <p>Kolum: <span className="font-mono font-bold">SUBJEK, TAHUN, SK, SP, TEMA/BIDANG/TERAS, TAJUK</span></p>
                <p className="text-blue-600">Import akan <span className="font-black">menggantikan</span> semua data sedia ada jika "Kosongkan dulu" dipilih.</p>
              </div>

              <div className="space-y-3">
                <div>
                  <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Fail CSV</label>
                  <div className="mt-1 border-2 border-dashed border-purple-200 rounded-xl p-5 text-center cursor-pointer hover:border-purple-400 hover:bg-purple-50 transition" onClick={()=>csvRef.current?.click()}>
                    {csvFile ? (
                      <><Icon name="FileText" size={22} className="text-purple-500 mx-auto mb-1"/>
                      <p className="text-sm font-black text-purple-700">{csvFile.name}</p>
                      <p className="text-xs text-slate-400">{(csvFile.size/1024).toFixed(0)} KB · Klik untuk tukar</p></>
                    ) : (
                      <><Icon name="Upload" size={22} className="text-purple-300 mx-auto mb-1"/>
                      <p className="text-sm font-black text-purple-500">Pilih fail CSV DSKP</p>
                      <p className="text-xs text-slate-400">Format KPM standard</p></>
                    )}
                  </div>
                  <input ref={csvRef} type="file" accept=".csv" className="hidden" onChange={e=>{if(e.target.files[0])setCsvFile(e.target.files[0]);}}/>
                </div>

                <label className="flex items-center gap-2 cursor-pointer select-none">
                  <input type="checkbox" checked={clearFirst} onChange={e=>setClearFirst(e.target.checked)} className="w-4 h-4 accent-purple-600"/>
                  <span className="text-sm font-bold text-slate-700">Kosongkan data sedia ada sebelum import</span>
                </label>

                {importResult && (
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs font-black text-slate-600">
                      <span>Mengimport...</span>
                      <span>{importResult.done} / {importResult.total} ({importResult.pct}%)</span>
                    </div>
                    <div className="h-3 bg-slate-100 rounded-full overflow-hidden">
                      <div className="h-full bg-purple-600 rounded-full transition-all" style={{width:`${importResult.pct}%`}}/>
                    </div>
                  </div>
                )}

                <button onClick={handleImport} disabled={importing||!csvFile}
                  className="w-full py-3 bg-purple-600 text-white rounded-xl font-black hover:bg-purple-700 transition disabled:opacity-40 active:scale-95 flex items-center justify-center gap-2">
                  {importing ? <><Icon name="Loader2" size={16} className="animate-spin"/>Mengimport... ({importResult?.pct||0}%)</> : <><Icon name="Upload" size={16}/>Import Sekarang</>}
                </button>
              </div>
            </div>
          )}

          {/* ── Tab: Bank SK/SP ── */}
          {tab==='bank' && (
            <div className="space-y-3">
              {/* Filter */}
              <div className="flex gap-2 flex-wrap">
                <select value={fSubjek} onChange={e=>setFSubjek(e.target.value)}
                  className="flex-1 min-w-[140px] border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-purple-400 bg-slate-50">
                  <option value="">-- Semua Subjek --</option>
                  {dskpSubjeks.map(s=><option key={s} value={s}>{s}</option>)}
                </select>
                <select value={fTahun} onChange={e=>setFTahun(e.target.value)}
                  className="border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-purple-400 bg-slate-50">
                  <option value="">Semua Tahun</option>
                  {TAHUN_LIST.map(t=><option key={t} value={t}>{t}</option>)}
                </select>
              </div>
              <div>
                <input value={fSearch} onChange={e=>setFSearch(e.target.value)} placeholder="🔍 Cari SK atau SP..."
                  className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 bg-slate-50"/>
              </div>

// ── Helper: gabung slot berturutan ──
function mergeConsecutiveSlots(slots) {
  // Group by subjek+kelas+hari
  const groups = {};
  slots.forEach(s => {
    const key = `${s.day}|${s.subjectName}|${s.className}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(s);
  });

  const merged = [];
  Object.values(groups).forEach(grp => {
    if (grp.length === 1) {
      merged.push({ ...grp[0], merged: false, sourceSlots: [grp[0]], timeLabel: `${grp[0].startTime}–${grp[0].endTime}` });
      return;
    }
    // Sort by period
    grp.sort((a,b) => a.period - b.period);
    // Build chains of consecutive periods
    const chains = [[grp[0]]];
    for (let i = 1; i < grp.length; i++) {
      const last = chains[chains.length-1];
      const prev = last[last.length-1];
      if (grp[i].period === prev.period + 1) {
        last.push(grp[i]);
      } else {
        chains.push([grp[i]]);
      }
    }

    // Each consecutive chain → one merged slot
    // Kekal masa asal setiap chain (tidak bridge gaps)
    chains.forEach((chain, ci) => {
      // Time label: masa setiap slot digabung dengan & 
      const timeLabel = chain.map(s => `${s.startTime}–${s.endTime}`).join(' & ');
      const displayStart = chain[0].startTime;
      const displayEnd   = chain[chain.length-1].endTime;
      merged.push({
        ...chain[0],
        startTime: displayStart,
        endTime:   displayEnd,
        timeLabel, // e.g. "9:10–10:10 & 10:30–11:00"
        period:    chain[0].period,
        periodEnd: chain[chain.length-1].period,
        merged:    chain.length > 1,
        sourceSlots: chain,
        hasNonConsec: chains.length > 1,
        chainIdx: ci,
        allChains: chains,
        groupKey: `${chain[0].day}|${chain[0].subjectName}|${chain[0].className}`
      });
    });
  });

  return merged.sort((a,b) => {
    const DAYS = ['Isnin','Selasa','Rabu','Khamis','Jumaat'];
    const dd = DAYS.indexOf(a.day) - DAYS.indexOf(b.day);
    return dd !== 0 ? dd : a.period - b.period;
  });
}

// ── RphMarkdown — render markdown text dalam paparan RPH ──
const RphMarkdown = ({ text, placeholder }) => {
  if (!text) return <p className="text-sm text-slate-300 italic mt-1.5">{placeholder || '—'}</p>;

  const lines = text.split('\n');
  const elements = [];
  let i = 0;

  // Helper — buang prefix dari baris (guna string bukan regex dalam JSX)
  const stripPrefix = (ln, prefix) => ln.slice(prefix.length);
  const isSubBullet  = ln => ln.startsWith('  - ');
  const isBullet     = ln => ln.startsWith('- ');
  const isNumbered   = ln => { const m = ln.match(/^(\d+)\. /); return m ? m[1] : null; };

  while (i < lines.length) {
    const line = lines[i];
    const numMatch = isNumbered(line);

    if (line.startsWith('## ')) {
      elements.push(
        <p key={i} className="font-black text-slate-800 text-sm mt-3 mb-1 first:mt-0">
          {stripPrefix(line, '## ')}
        </p>
      );
    }
    else if (line.startsWith('# ')) {
      elements.push(
        <p key={i} className="font-black text-purple-700 text-sm mt-3 mb-1 first:mt-0">
          {stripPrefix(line, '# ')}
        </p>
      );
    }
    else if (isSubBullet(line)) {
      elements.push(
        <div key={i} className="flex gap-2 ml-4">
          <span className="text-slate-400 text-xs mt-0.5 flex-shrink-0">◦</span>
          <span className="text-sm text-slate-600 leading-relaxed"><RenderInline text={stripPrefix(line, '  - ')}/></span>
        </div>
      );
    }
    else if (isBullet(line)) {
      elements.push(
        <div key={i} className="flex gap-2">
          <span className="text-purple-400 text-xs mt-0.5 flex-shrink-0">•</span>
          <span className="text-sm text-slate-700 leading-relaxed"><RenderInline text={stripPrefix(line, '- ')}/></span>
        </div>
      );
    }
    else if (numMatch) {
      const rest = line.slice(line.indexOf('. ') + 2);
      elements.push(
        <div key={i} className="flex gap-2">
          <span className="text-purple-600 text-xs font-black mt-0.5 flex-shrink-0 w-4">{numMatch}.</span>
          <span className="text-sm text-slate-700 leading-relaxed"><RenderInline text={rest}/></span>
        </div>
      );
    }
    else if (line.trim() === '') {
      elements.push(<div key={i} className="h-1"/>);
    }
    else {
      elements.push(
        <p key={i} className="text-sm text-slate-700 leading-relaxed"><RenderInline text={line}/></p>
      );
    }
    i++;
  }

  return <div className="mt-1.5 space-y-0.5">{elements}</div>;
};

// Render inline markdown: **bold**, _italic_
const RenderInline = ({ text }) => {
  if (!text) return null;
  const parts = [];
  const regex = new RegExp('\\*\\*([^*]+)\\*\\*|_([^_]+)_', 'g');
  let last = 0, m;
  while ((m = regex.exec(text)) !== null) {
    if (m.index > last) parts.push(text.slice(last, m.index));
    if (m[1]) parts.push(<strong key={m.index} className="font-black text-slate-800">{m[1]}</strong>);
    else if (m[2]) parts.push(<em key={m.index}>{m[2]}</em>);
    last = m.index + m[0].length;
  }
  if (last < text.length) parts.push(text.slice(last));
  return <>{parts}</>;
};
