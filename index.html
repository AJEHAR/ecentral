    const activeDayNames = new Set();
    const cur = strToD_(dateRange.start), end_ = strToD_(endStr);
    while (cur <= end_) { const dow=cur.getDay(); if(dow>=1&&dow<=5) activeDayNames.add(DAYS_MS[dow-1]); cur.setDate(cur.getDate()+1); }
    apiCall('getScheduleByTeacher', ascMapping.ascTeacherId).then(all => {
      const raw = Array.isArray(all) ? all : [];
      const filtered = raw.filter(s => activeDayNames.has(s.day));
      setAllSlots(filtered);
      setMergedSlots(mergeConsecutiveSlots(filtered));
      // Jangan reset mergeChoices di sini — biar persist dari localStorage
      setLoadingSlots(false);
    }).catch(e => { showToast(String(e),'error'); setLoadingSlots(false); });
  }, [step, ascMapping?.ascTeacherId, dateRange.start]);

  // ── Date helpers ──
  const dateToStr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const strToDate = s => { const [y,m,d]=s.split('-'); return new Date(Number(y),Number(m)-1,Number(d)); };
  const dayName   = s => DAYS_MS[strToDate(s).getDay()-1] || null;

  // Get dates in range (Mon-Fri only)
  const activeDates = useMemo(() => {
    if (!dateRange.start) return [];
    const endStr = dateRange.end || dateRange.start;
    const result = [];
    const cur = strToDate(dateRange.start);
    const end = strToDate(endStr);
    while (cur <= end) {
      const dow = cur.getDay();
      if (dow >= 1 && dow <= 5) result.push({ dateStr: dateToStr(cur), day: DAYS_MS[dow-1], date: new Date(cur) });
      cur.setDate(cur.getDate()+1);
    }
    return result;
  }, [dateRange]);

  // Load ASC slots when dates confirmed
  const loadSlotsForDates = async () => {
    if (!ascMapping) { showToast('Sila tetapkan nama ASC dalam ⚙ Setting dahulu.','warning'); setShowSetting(true); return; }
    if (activeDates.length === 0) { showToast('Sila pilih tarikh dahulu.','warning'); return; }
    setLoadingSlots(true);
    try {
      const all = await apiCall('getScheduleByTeacher', ascMapping.ascTeacherId);
      const raw = Array.isArray(all) ? all : [];
      // Filter hari yang dipilih sahaja
      const activeDayNames = [...new Set(activeDates.map(d=>d.day))];
      const filtered = raw.filter(s => activeDayNames.includes(s.day));
      setAllSlots(filtered);
      // Apply merge logic
      const merged = mergeConsecutiveSlots(filtered);
      setMergedSlots(merged);
      // Kekal mergeChoices yang ada (dari localStorage)
      setStep('slots');
    } catch(e) { showToast(String(e),'error'); }
    setLoadingSlots(false);
  };

  // Final slot list after user choices
  const finalSlots = useMemo(() => {
    const result = [];
    // Group non-consec slots by groupKey
    const nonConsecGroups = {};
    mergedSlots.forEach(s => {
      if (s.hasNonConsec) {
        if (!nonConsecGroups[s.groupKey]) nonConsecGroups[s.groupKey] = [];
        nonConsecGroups[s.groupKey].push(s);
      }
    });

    const handled = new Set();
    mergedSlots.forEach(s => {
      if (!s.hasNonConsec) { result.push(s); return; }
      if (handled.has(s.groupKey)) return;
      handled.add(s.groupKey);
      const choice = mergeChoices[s.groupKey]; // 'merge' | 'split' | undefined
      const grpSlots = nonConsecGroups[s.groupKey];
      if (choice === 'merge') {
        // Sort chains by period supaya timeLabel ikut susunan masa
        const sortedChains = [...grpSlots].sort((a,b) => a.period - b.period);
        // timeLabel: setiap chain tunjuk masa sendiri, TIDAK disambung melepasi gap
        const timeLabel = sortedChains.map(g => g.timeLabel || `${g.startTime}–${g.endTime}`).join(' & ');
        const allSourceSlots = sortedChains.flatMap(g => g.sourceSlots).sort((a,b)=>a.period-b.period);
        const firstChain = sortedChains[0];
        const lastChain  = sortedChains[sortedChains.length-1];
        result.push({
          ...firstChain,
          startTime:   firstChain.startTime,
          endTime:     lastChain.endTime,
          timeLabel,
          period:      firstChain.period,
          periodEnd:   lastChain.periodEnd || lastChain.period,
          merged:      true,
          sourceSlots: allSourceSlots,
          hasNonConsec: false
        });
      } else {
        // split (default) — kekalkan setiap chain berasingan
        grpSlots.forEach(g => result.push({ ...g, hasNonConsec: false }));
      }
    });
    return result.sort((a,b) => {
      const dd = DAYS_MS.indexOf(a.day) - DAYS_MS.indexOf(b.day);
      return dd !== 0 ? dd : a.period - b.period;
    });
  }, [mergedSlots, mergeChoices]);

  // Colour map for subjects
  const SUBJ_COLORS = ['bg-blue-500','bg-purple-500','bg-teal-500','bg-rose-500','bg-amber-500','bg-indigo-500','bg-green-500','bg-orange-500','bg-cyan-500','bg-pink-500'];
  const getSubjColor = name => SUBJ_COLORS[(name||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0)%SUBJ_COLORS.length];

  const resetForm = () => {
    setMinggu(activeFolder?.nama||''); setUnitTema(''); setTajuk(''); setSkSel(''); setSkCustom('');
    setSpCustom(''); setKemahiran(''); setObjektif(''); setKriteria(''); setAktiviti('');
    setBbm(''); setPentaksiran(''); setRefleksi(''); setCurrentRph(null); setCurrentDskpId('');
  };

  const handleSelectSlot = async (slot, dateStr, day) => {
    const exist = rphList.find(r => r.date===dateStr && r.subjectName===slot.subjectName && r.className===slot.className);
    setSelectedSlot(slot); setSelectedDateStr(dateStr); setSelectedDay(day);
    if (exist) {
      setStep('view');
      try {
        // Fetch full RPH data including all content fields
        const full = await apiCall('getRphById', exist.rphId);
        setCurrentRph(full);
        setMinggu(full.minggu||''); setUnitTema(full.unitTema||''); setTajuk(full.tajuk||'');
        setSkCustom(full.sk||''); setSpCustom(full.sp||''); setKemahiran(full.kemahiran||'');
        setCurrentDskpId(full.dskpId||'');
        setObjektif(full.objektif||''); setKriteria(full.kriteria||''); setAktiviti(full.aktiviti||'');
        setBbm(full.bbm||''); setPentaksiran(full.pentaksiran||''); setRefleksi(full.refleksi||'');
      } catch(e) { showToast(String(e),'error'); }
    } else {
      resetForm();
      if (activeFolder) setMinggu(activeFolder.nama||'');
      setStep('form');
    }
  };

  const handleGenerate = async () => {
    if (!tajuk.trim()) { showToast('Sila taip tajuk/tema dahulu.','warning'); return; }
    const fields = Object.entries(gemFields).filter(([,v])=>v).map(([k])=>k);
    if (fields.length===0) { showToast('Pilih sekurang-kurangnya satu field.','warning'); return; }
    setGenerating(true);
    try {
      const result = await apiCall('generateRphV2', JSON.stringify({
        userId: user.uid, subjectName: selectedSlot.subjectName, className: selectedSlot.className,
        date: selectedDateStr, day: selectedDay,
        startTime: selectedSlot.startTime, endTime: selectedSlot.endTime,
        tajuk: tajuk.trim(), sk: skCustom, sp: spCustom, kemahiran, generateFields: fields, useJawi
      }));
      if (result.success) {
        if (result.objektif    && gemFields.objektif)    setObjektif(result.objektif);
        if (result.kriteria    && gemFields.kriteria)    setKriteria(result.kriteria);
        if (result.aktiviti    && gemFields.aktiviti)    setAktiviti(result.aktiviti);
        if (result.bbm         && gemFields.bbm)         setBbm(result.bbm);
        if (result.pentaksiran && gemFields.pentaksiran) setPentaksiran(result.pentaksiran);
        if (result.refleksi    && gemFields.refleksi)    setRefleksi(result.refleksi);
        showToast('Gemini berjaya menjana kandungan RPH!','success');
      }
    } catch(e) { showToast(String(e),'error'); }
    setGenerating(false);
  };

  const [loadingNext, setLoadingNext] = useState(false);
  const handleNextSkSp = async () => {
    if (!selectedSlot) return;
    setLoadingNext(true);
    try {
      const r = await apiCall('getNextSkSp', user.uid, selectedSlot.subjectName, selectedSlot.className);
      if (r && r.found && r.item) {
        const item = r.item;
        setSkCustom(item.sk || '');
        setSpCustom(item.sp || '');
        setCurrentDskpId(item.dskpId || '');
        if (item.tema) setUnitTema(prev => prev || item.tema);
        if (item.tajuk) setTajuk(prev => prev || item.tajuk);
        showToast(`SP ${r.nextIndex + 1}/${r.total} dipilih otomatis ✓`, 'success');
      } else {
        showToast(r?.reason || 'Tiada SP seterusnya.', 'warning');
      }
    } catch(e) { showToast(String(e), 'error'); }
    setLoadingNext(false);
  };

  const handleSave = async () => {
    if (!tajuk.trim()) { showToast('Tajuk tidak boleh kosong.','warning'); return; }
    setSaving(true);
    try {
      await apiCall('saveRphV2', JSON.stringify({
        rphId: currentRph?.rphId||'', userId: user.uid, teacherName: user.fullName,
        folderId: activeFolder?.folderId||'',
        subjectName: selectedSlot.subjectName, subjectShort: selectedSlot.subjectShort||'',
        className: selectedSlot.className, date: selectedDateStr, day: selectedDay,
        startTime: selectedSlot.startTime, endTime: selectedSlot.endTime,
        minggu, unitTema, tajuk, sk: skCustom, sp: spCustom, kemahiran, dskpId: currentDskpId,
        objektif, kriteria, aktiviti, bbm, pentaksiran, refleksi
      }));
      showToast('RPH berjaya disimpan!','success');
      const updated = await apiCall('getRphList', user.uid);
      setRphList(Array.isArray(updated)?updated:[]);
      setEditingField(null);
      setStep('slots');
    } catch(e) { showToast(String(e),'error'); }
    setSaving(false);
  };

  const handleDelete = async () => {
    if (!confirmDel) return;
    try {
      await apiCall('deleteRph', confirmDel, user.uid);
      showToast('RPH dipadam.','success');
      const updated = await apiCall('getRphList', user.uid);
      setRphList(Array.isArray(updated)?updated:[]);
      setConfirmDel(null); setEditingField(null); setStep('slots');
    } catch(e) { showToast(String(e),'error'); setConfirmDel(null); }
  };

  // Export dari folder card (step='folder') — bukan activeFolder
  const handleExportFolder = async (folder, e) => {
    e && e.stopPropagation();
    const cnt = rphList.filter(r=>r.folderId===folder.folderId).length;
    if (cnt === 0) { showToast('Tiada RPH dalam folder ini.','warning'); return; }
    setExporting(folder.folderId);
    try {
      // Ambil cuti untuk folder ini
      const result = await apiCall('exportRphWeekFull', JSON.stringify({
        folderId: folder.folderId,
        userId: user.uid,
        teacherName: folder.guruNama || user.fullName,
        weekLabel: folder.nama || '',
        minggu: folder.minggu || ''
      }));
      if (result?.pdfUrl) {
        setPdfResult({ pdfUrl: result.pdfUrl, count: result.count, nama: folder.nama||'' });
      } else {
        showToast('Export berjaya tetapi tiada URL PDF. Semak Drive.','warning');
      }
    } catch(e) { showToast(String(e),'error'); }
    setExporting(false);
  };

  const handleExport = async () => {
    if (!activeFolder) { showToast('Tiada folder aktif.','warning'); return; }
    const rphDlm = rphList.filter(r=>r.folderId===activeFolder.folderId);
    if (rphDlm.length === 0) { showToast('Tiada RPH dalam folder ini untuk dieksport.','warning'); return; }
    setExporting(true);
    try {
      const result = await apiCall('exportRphWeekFull', JSON.stringify({
        folderId: activeFolder.folderId,
        userId: user.uid,
        teacherName: activeFolder.guruNama || user.fullName,
        weekLabel: activeFolder.nama || '',
        minggu: activeFolder.minggu || '',
        // cutiList diambil dari rphList dalam GAS
      }));
      if (result?.pdfUrl) {
        setPdfResult({ pdfUrl: result.pdfUrl, count: result.count, nama: activeFolder?.nama||'' });
      } else {
        showToast('Export berjaya tetapi tiada URL PDF dijana. Semak folder Google Drive anda.', 'warning');
      }
    } catch(e) { showToast(String(e),'error'); }
    setExporting(false);
  };

  // Export terus dari senarai slot (tanpa perlu masuk view)
  const handleExportFromList = async (rphId, subjectName, dateStr) => {
    setExportingSlotId(rphId);
    try {
      const result = await apiCall('exportRphSingle', JSON.stringify({
        rphId, userId: user.uid, teacherName: user.fullName,
      }));
      if (result?.pdfUrl) {
        setPdfResult({ pdfUrl: result.pdfUrl, count: 1, nama: `${subjectName} · ${dateStr}` });
      } else {
        showToast('Export berjaya tetapi tiada URL PDF. Semak Drive.', 'warning');
      }
    } catch(e) { showToast(String(e), 'error'); }
    setExportingSlotId(null);
  };

  // Jana refleksi AI untuk SATU slot terus dari senarai (tanpa buka Bulk Refleksi)
  const handleQuickGenRefleksi = async (rphId) => {
    setGenRefId(rphId);
    try {
      const r = await apiCall('generateRefleksiAI', rphId, user.uid);
      if (r.status === 'ok') {
        showToast('✅ Refleksi AI berjaya dijana!', 'success');
        const updated = await apiCall('getRphList', user.uid);
        setRphList(Array.isArray(updated) ? updated : []);
      } else if (r.status === 'skip') {
        showToast('⏭️ ' + (r.message || 'Dilangkau — tiada kandungan RPH.'), 'warning');
      } else {
        showToast('❌ ' + (r.message || 'Gagal jana refleksi.'), 'error');
      }
    } catch(e) { showToast(String(e), 'error'); }
    setGenRefId(null);
  };

  // Export satu slot RPH sahaja (dari view mode)
  const handleExportSlot = async () => {
    if (!currentRph) return;
    setExportingSlot(true);
    try {
      const result = await apiCall('exportRphSingle', JSON.stringify({
        rphId:       currentRph.rphId,
        userId:      user.uid,
        teacherName: user.fullName,
      }));
      if (result?.pdfUrl) {
        setPdfResult({ pdfUrl: result.pdfUrl, count: 1, nama: `${selectedSlot.subjectName} · ${selectedDateStr}` });
      } else {
        showToast('Export berjaya tetapi tiada URL PDF. Semak Drive.', 'warning');
      }
    } catch(e) { showToast(String(e), 'error'); }
    setExportingSlot(false);
  };

  // ── RENDER ──
  return (
    <div className="space-y-4 fade-in">

      {/* Header */}
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div>
          <h2 className="text-lg font-black text-slate-800">Rancangan Pengajaran Harian</h2>
          {ascMapping && <p className="text-xs text-slate-400 mt-0.5">Guru: <span className="font-bold text-purple-600">{ascMapping.ascTeacherName}</span></p>}
        </div>
        <div className="flex gap-2">
          <button onClick={()=>setShowArkib(true)} className="flex items-center gap-1.5 px-3 py-2 bg-amber-50 border border-amber-200 text-amber-700 rounded-xl text-xs font-black hover:bg-amber-100 transition active:scale-90">
            <Icon name="Archive" size={13}/> Arkib RPH
          </button>
          <button onClick={()=>setShowDskp(true)} className="flex items-center gap-1.5 px-3 py-2 bg-blue-50 border border-blue-200 text-blue-700 rounded-xl text-xs font-black hover:bg-blue-100 transition active:scale-90">
            <Icon name="BookOpen" size={13}/> Bank SK/SP
          </button>
          <button onClick={()=>setShowSetting(true)} className="p-2.5 bg-slate-100 text-slate-600 rounded-xl hover:bg-slate-200 transition active:scale-90 border border-slate-200">
            <Icon name="Settings" size={15}/>
          </button>
        </div>
      </div>

      {/* ═══════════════════════════════════════
          STEP 1: SENARAI FOLDER/MINGGU
      ═══════════════════════════════════════ */}
      {step === 'folder' && (
        <div className="space-y-3">
          {/* Skeleton semasa loading */}
          {loadingFolders ? (
            <div className="space-y-3">
              {[1,2,3].map(i=><RphSkeletonCard key={i}/>)}
            </div>
          ) : (
          <RphFolderList
            folders={folders} loading={false} userId={user.uid}
            ascMapping={ascMapping}
            rphList={rphList}
            onSelect={folder => {
              setActiveFolder(folder);
              setAllSlots([]); // reset supaya useEffect akan reload
              setMergedSlots([]);
              if (folder.startDate) {
                const fmtDate = s => {
                  if (!s) return '';
                  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
                  const d = new Date(s);
                  if (isNaN(d)) return s;
                  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                };
                const startD = fmtDate(folder.startDate);
                const endD   = fmtDate(folder.endDate) || startD;
                setDateRange({ start: startD, end: endD });
                // ── Load semula mergeChoices dari localStorage untuk folder ini ──
                try {
                  const saved = localStorage.getItem(`ecentral_merge_${folder.folderId}`);
                  setMergeChoicesRaw(saved ? JSON.parse(saved) : {});
                } catch(e) { setMergeChoicesRaw({}); }
                setStep('slots');
              } else {
                setDateRange({start:null,end:null});
                setMergeChoicesRaw({});
                setStep('dates');
              }
            }}
            onRefresh={() => apiCall('getRphFolders', user.uid).then(r=>setFolders(Array.isArray(r)?r:[])).catch(()=>{})}
            onCopyMingu={folder => setCopyMinguSrc(folder)}
            onExport={handleExportFolder}
            exporting={exporting}
            showToast={showToast}/>
          )}
        </div>
      )}

      {/* ═══════════════════════════════════════
          STEP 2: PILIH TARIKH
      ═══════════════════════════════════════ */}
      {step === 'dates' && (
        <div className="space-y-3">
          <div className="flex items-center gap-2">
            <button onClick={()=>setStep('folder')} className="p-2.5 bg-slate-100 rounded-xl hover:bg-slate-200 active:scale-90 transition"><Icon name="ArrowLeft" size={18}/></button>
            <div>
              <p className="font-black text-slate-800">{activeFolder?.nama}</p>
              <p className="text-xs text-slate-400">Pilih tarikh untuk RPH</p>
            </div>
          </div>
          <RphDatePicker
            dateRange={dateRange} setDateRange={setDateRange}
            activeDates={activeDates}
            onConfirm={loadSlotsForDates} loading={loadingSlots}/>
        </div>
      )}

      {/* ═══════════════════════════════════════
          STEP 3: SENARAI SLOT
      ═══════════════════════════════════════ */}
      {step === 'slots' && (
        <div className="space-y-3">
          <div className="flex items-center justify-between gap-2 flex-wrap">
            <div className="flex items-center gap-2">
              <button onClick={()=>setStep('folder')} className="p-2.5 bg-slate-100 rounded-xl hover:bg-slate-200 active:scale-90 transition"><Icon name="ArrowLeft" size={18}/></button>
              <div>
                <p className="font-black text-slate-800">{activeFolder?.nama}</p>
                <p className="text-xs text-slate-400">
                  {dateRange.start === dateRange.end ? dateRange.start : `${dateRange.start} – ${dateRange.end}`}
                  {' · '}{activeDates.length} hari · {finalSlots.length} slot
                </p>
              </div>
            </div>
            <div className="flex gap-2">
              <button onClick={()=>setShowBulkRef(true)}
                className="flex items-center gap-1.5 px-3 py-2 bg-amber-500 text-white rounded-xl text-xs font-black hover:bg-amber-600 transition active:scale-90">
                <Icon name="ClipboardList" size={12}/> Bulk Refleksi
              </button>
              <button onClick={handleExport} disabled={exporting}
                className="flex items-center gap-1.5 px-3 py-2 bg-green-600 text-white rounded-xl text-xs font-black hover:bg-green-700 transition disabled:opacity-60 active:scale-90">
                {exporting ? <Icon name="Loader2" size={12} className="animate-spin"/> : <Icon name="Download" size={12}/>}
                {exporting ? 'Menjana...' : 'Export Minggu'}
              </button>
            </div>
          </div>

          {/* Tanya gabung untuk non-konsekutif */}
          {mergedSlots.some(s=>s.hasNonConsec) && (
            <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 space-y-2">
              <p className="text-xs font-black text-amber-800">⚡ Terdapat subjek yang sama dengan waktu tidak berturutan:</p>
              {[...new Set(mergedSlots.filter(s=>s.hasNonConsec).map(s=>s.groupKey))].map(gk => {
                const grpSlots = mergedSlots.filter(s=>s.groupKey===gk);
                const first = grpSlots[0];
                const choice = mergeChoices[gk];
                return (
                  <div key={gk} className="bg-white border border-amber-100 rounded-xl p-3 flex items-center gap-3">
                    <div className="flex-1 min-w-0">
                      <p className="text-xs font-black text-slate-800">{first.subjectName} — {first.className}</p>
                      <p className="text-[10px] text-slate-500">{first.day} · Waktu: {grpSlots.map(s=>s.period+(s.periodEnd?'–'+s.periodEnd:'')).join(', ')}</p>
                    </div>
                    <div className="flex gap-1.5 flex-shrink-0">
                      <button onClick={()=>setMergeChoices(p=>({...p,[gk]:'merge'}))}
                        className={`px-2.5 py-1.5 rounded-xl text-[10px] font-black border transition ${choice==='merge'?'bg-purple-600 text-white border-purple-600':'bg-white text-slate-600 border-slate-300 hover:border-purple-300'}`}>
                        Gabung
                      </button>
                      <button onClick={()=>setMergeChoices(p=>({...p,[gk]:'split'}))}
                        className={`px-2.5 py-1.5 rounded-xl text-[10px] font-black border transition ${choice==='split'?'bg-slate-700 text-white border-slate-700':'bg-white text-slate-600 border-slate-300 hover:border-slate-400'}`}>
                        Pisah
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Skeleton semasa loadingSlots */}
          {loadingSlots && (
            <div className="space-y-3">
              {[1,2].map(i=><RphSkeletonSlot key={i}/>)}
            </div>
          )}

          {/* Grid slot ikut hari */}
          {!loadingSlots && activeDates.map(({dateStr, day}) => {
            const daySlots = finalSlots.filter(s=>s.day===day);
            const cutiHari = getCutiForDate(dateStr);
            return (
              <div key={dateStr} className={`rounded-2xl border shadow-sm overflow-hidden ${cutiHari ? 'bg-slate-50 border-slate-300 opacity-80' : 'bg-white border-slate-200'}`}>
                {/* Header hari */}
                <div className={`px-4 py-3 border-b flex items-center justify-between ${cutiHari ? 'bg-slate-100 border-slate-200' : 'bg-purple-50 border-purple-100'}`}>
                  <div className="flex items-center gap-2">
                    {cutiHari && <span className="text-base">🏖️</span>}
                    <p className={`font-black text-sm ${cutiHari ? 'text-slate-500' : 'text-purple-800'}`}>{day}</p>
                    {cutiHari && (
                      <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${cutiHari.jenisCuti==='sekolah' ? 'bg-blue-100 text-blue-700' : 'bg-orange-100 text-orange-700'}`}>
                        {cutiHari.jenisCuti==='sekolah' ? 'Cuti Sekolah' : 'Cuti Peribadi'}
                      </span>
                    )}
                  </div>
                  <div className="flex items-center gap-2">
                    <p className="text-xs text-slate-400">{new Date(dateStr+'T00:00:00').toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'})}</p>
                    <button onClick={()=>setCutiModal({tarikh:dateStr, hari:day, cuti:cutiHari})}
                      className={`flex items-center gap-1 px-2 py-1 rounded-lg text-[10px] font-black transition active:scale-90 ${cutiHari ? 'bg-slate-200 text-slate-600 hover:bg-slate-300' : 'bg-white border border-slate-200 text-slate-500 hover:bg-slate-50 hover:border-slate-300'}`}>
                      {cutiHari ? <><Icon name="Pencil" size={10}/> Edit Cuti</> : <><Icon name="CalendarX" size={10}/> Tandakan Cuti</>}
                    </button>
                  </div>
                </div>

                {/* Nota cuti */}
                {cutiHari?.nota && (
                  <div className="px-4 py-2 bg-slate-50 border-b border-slate-100 flex items-center justify-between gap-2">
                    <p className="text-xs text-slate-500 italic flex-1">📝 {cutiHari.nota}</p>
                    {cutiHari.imageUrl && (
                      <a href={cutiHari.imageUrl} target="_blank" rel="noopener"
                        className="flex items-center gap-1 px-2 py-1 bg-blue-50 text-blue-600 rounded-lg text-[10px] font-black hover:bg-blue-100 flex-shrink-0">
                        <Icon name="Image" size={10}/> Lihat Gambar
                      </a>
                    )}
                  </div>
                )}

                {/* Slot-slot */}
                {cutiHari ? (
                  // Hari cuti — tunjuk slot + status ada/tiada nota
                  <div>
                    {/* Status bar cuti */}
                    <div className="px-4 py-2 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
                      {cutiHari.nota || cutiHari.imageUrl ? (
                        <div className="flex items-center gap-1.5">
                          <span className="text-green-600 text-sm">✅</span>
                          <span className="text-[11px] font-black text-green-700">RPH Cuti lengkap</span>
                          {cutiHari.imageUrl && (
                            <a href={cutiHari.imageUrl} target="_blank" rel="noopener"
                              className="ml-2 flex items-center gap-1 px-2 py-0.5 bg-blue-50 text-blue-600 rounded-lg text-[10px] font-black hover:bg-blue-100">
                              <Icon name="Image" size={9}/> Lihat
                            </a>
                          )}
                        </div>
                      ) : (
                        <div className="flex items-center gap-1.5">
                          <span className="text-amber-500 text-sm">⚠️</span>
                          <span className="text-[11px] font-black text-amber-600">RPH Cuti belum diisi</span>
                          <button onClick={()=>setCutiModal({tarikh:dateStr, hari:day, cuti:cutiHari})}
                            className="ml-2 text-[10px] font-black text-purple-600 hover:underline">
                            Isi sekarang →
                          </button>
                        </div>
                      )}
                      {cutiHari.nota && <p className="text-[10px] text-slate-400 italic truncate max-w-[160px]">{cutiHari.nota}</p>}
                    </div>
                    <div className="divide-y divide-slate-100">
                      {daySlots.length === 0
                        ? <p className="text-center py-3 text-slate-300 text-xs">Tiada kelas</p>
                        : daySlots.map((slot,i) => (
                          <div key={i} className="px-4 py-2.5 flex items-center gap-3 opacity-40">
                            <div className="w-2 h-10 rounded-full flex-shrink-0 bg-slate-300"/>
                            <div className="text-xs font-black text-slate-400 w-24 flex-shrink-0">
                              <p className="leading-tight">{slot.timeLabel||`${slot.startTime}–${slot.endTime}`}</p>
                            </div>
                            <div className="flex-1 min-w-0">
                              <p className="text-sm font-black text-slate-500 line-through">{slot.subjectName}</p>
                              <p className="text-xs text-slate-400">{slot.className}</p>
                            </div>
                            <span className="text-[10px] font-black text-slate-400 bg-slate-100 px-2 py-1 rounded-lg">Cuti</span>
                          </div>
                        ))
                      }
                    </div>
                  </div>
                ) : (
                  // Hari biasa
                  daySlots.length === 0 ? (
                    <p className="text-center py-4 text-slate-400 text-xs">Tiada kelas pada hari ini</p>
                  ) : (
                    <div className="divide-y divide-slate-100">
                      {daySlots.map((slot, i) => {
                        const exist = rphList.find(r=>r.date===dateStr && r.subjectName===slot.subjectName && r.className===slot.className);
                        const col = getSubjColor(slot.subjectShort||slot.subjectName);
                        const hasRef = !!exist?.hasRefleksi;
                        return (
                          <div key={i} className="px-4 py-3">
                            {/* Baris atas: bar warna + masa + nama subjek */}
                            <div className="flex items-start gap-3">
                              <div className={`w-2 mt-1 rounded-full flex-shrink-0 ${col}`} style={{height:'36px'}}/>
                              <div className="flex-1 min-w-0">
                                <div className="flex items-center gap-1.5 flex-wrap">
                                  <p className="text-sm font-black text-slate-800 leading-tight">{slot.subjectName}</p>
                                  {exist && (hasRef
                                    ? <span className="text-[9px] font-black px-1.5 py-0.5 bg-green-100 text-green-600 rounded-full flex-shrink-0">✅ Ada Refleksi</span>
                                    : <span className="text-[9px] font-black px-1.5 py-0.5 bg-amber-100 text-amber-600 rounded-full flex-shrink-0">⭕ Belum Refleksi</span>)}
                                </div>
                                <p className="text-xs font-bold text-slate-500 mt-0.5">{slot.className}</p>
                                <p className="text-[11px] text-slate-400 mt-0.5 leading-tight">
                                  {slot.timeLabel || `${slot.startTime}–${slot.endTime}`}
                                  {slot.merged && <span className="text-purple-500 font-bold ml-1">· Waktu {slot.period}–{slot.periodEnd} digabung</span>}
                                </p>
                              </div>
                            </div>
                            {/* Baris bawah: butang-butang */}
                            <div className="mt-2.5 ml-5 flex gap-1.5">
                            {exist ? (<>
                                <button onClick={()=>handleSelectSlot(slot,dateStr,day)}
                                  className="flex items-center gap-1.5 px-3 py-2 bg-green-100 text-green-700 rounded-xl text-xs font-black hover:bg-green-200 transition active:scale-95 flex-1 justify-center">
                                  <Icon name="Eye" size={12}/> <span>Lihat RPH</span>
                                </button>
                                {!hasRef && (
                                  <button
                                    onClick={()=>handleQuickGenRefleksi(exist.rphId)}
                                    disabled={genRefId===exist.rphId}
                                    title="Jana refleksi AI untuk RPH ini"
                                    className="flex items-center gap-1 px-3 py-2 bg-violet-600 text-white rounded-xl text-xs font-black hover:bg-violet-700 transition active:scale-95 disabled:opacity-50">
                                    {genRefId===exist.rphId
                                      ? <Icon name="Loader2" size={12} className="animate-spin"/>
                                      : <Icon name="Sparkles" size={12}/>}
                                  </button>
                                )}
                                <button onClick={()=>setCopyRphSrc({ subjectName:slot.subjectName, subjectShort:slot.subjectShort||'', className:slot.className, date:dateStr, day, startTime:slot.startTime||'', endTime:slot.endTime||'', folderId:activeFolder?.folderId||'' })}
                                  title="Tampal RPH dari arkib ke slot ini"
                                  className="flex items-center gap-1 px-3 py-2 bg-amber-100 text-amber-700 rounded-xl text-xs font-black hover:bg-amber-200 transition active:scale-95">
                                  <Icon name="Copy" size={12}/>
                                </button>
                                <button
                                  onClick={()=>handleExportFromList(exist.rphId, slot.subjectName, dateStr)}
                                  disabled={exportingSlotId===exist.rphId}
                                  title="Export RPH ini ke PDF"
                                  className="flex items-center gap-1 px-3 py-2 bg-green-600 text-white rounded-xl text-xs font-black hover:bg-green-700 transition active:scale-95 disabled:opacity-50">
                                  {exportingSlotId===exist.rphId
                                    ? <Icon name="Loader2" size={12} className="animate-spin"/>
                                    : <Icon name="Download" size={12}/>}
                                </button>
                              </>) : (<>
                                <button onClick={()=>handleSelectSlot(slot,dateStr,day)}
                                  className="flex items-center gap-1.5 px-3 py-2 bg-purple-600 text-white rounded-xl text-xs font-black hover:bg-purple-700 transition active:scale-95 shadow-md shadow-purple-200 flex-1 justify-center">
                                  <Icon name="Plus" size={12}/> <span>Buat RPH</span>
                                </button>
                                <button onClick={()=>setCopyRphSrc({ subjectName:slot.subjectName, subjectShort:slot.subjectShort||'', className:slot.className, date:dateStr, day, startTime:slot.startTime||'', endTime:slot.endTime||'', folderId:activeFolder?.folderId||'' })}
                                  title="Tampal dari RPH sedia ada"
                                  className="flex items-center gap-1 px-3 py-2 bg-amber-100 text-amber-700 rounded-xl text-xs font-black hover:bg-amber-200 transition active:scale-95">
                                  <Icon name="Copy" size={12}/>
                                </button>
                              </>)}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* ═══════════════════════════════════════
          STEP 4/5: FORM / VIEW RPH
      ═══════════════════════════════════════ */}
      {(step==='form'||step==='view') && selectedSlot && (
        <div className="space-y-3">
          <div className="flex items-center gap-3">
            <button onClick={()=>setStep('slots')} className="p-2.5 bg-slate-100 rounded-xl hover:bg-slate-200 active:scale-90 transition"><Icon name="ArrowLeft" size={18}/></button>
            <div className="flex-1 min-w-0">
              <p className="font-black text-slate-800 text-sm truncate">{step==='view'?'RPH Tersimpan':'Buat RPH Baru'}</p>
              <p className="text-xs text-slate-400 truncate">{selectedSlot.subjectName} · {selectedSlot.className} · {selectedDateStr} · {selectedSlot.timeLabel || `${selectedSlot.startTime}–${selectedSlot.endTime}`}</p>
            </div>
            {step==='view' && (
              <div className="flex gap-2 flex-shrink-0">
                <button onClick={handleExportSlot} disabled={exportingSlot||!currentRph}
                  className="flex items-center gap-1 px-3 py-2 bg-green-50 text-green-700 border border-green-200 rounded-xl text-xs font-black hover:bg-green-100 transition active:scale-90 disabled:opacity-50">
                  {exportingSlot ? <Icon name="Loader2" size={12} className="animate-spin"/> : <Icon name="Download" size={12}/>}
                  {exportingSlot ? '' : 'PDF'}
                </button>
                <button onClick={()=>setStep('form')} className="flex items-center gap-1 px-3 py-2 bg-purple-50 text-purple-700 border border-purple-200 rounded-xl text-xs font-black hover:bg-purple-100 transition active:scale-90"><Icon name="Pencil" size={12}/> Edit</button>
                <button onClick={()=>setConfirmDel(currentRph?.rphId)} className="p-2 bg-red-50 text-red-600 border border-red-200 rounded-xl hover:bg-red-100 transition active:scale-90"><Icon name="Trash2" size={14}/></button>
              </div>
            )}
          </div>

          {/* Maklumat Asas */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 space-y-3">
            <p className="text-xs font-black text-slate-500 uppercase tracking-wider">Maklumat Asas</p>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Minggu</label>
                <input value={minggu} onChange={e=>setMinggu(e.target.value)} placeholder="cth: 18" readOnly={step==='view'} className={_IC}/>
              </div>
              <div>
                <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Unit / Tema</label>
                <input value={unitTema} onChange={e=>setUnitTema(e.target.value)} placeholder="cth: Unit 1" readOnly={step==='view'} className={_IC}/>
              </div>
            </div>
            <div>
              <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Tajuk Pelajaran</label>
              <input value={tajuk} onChange={e=>setTajuk(e.target.value)} placeholder="cth: Menambah nombor bulat" readOnly={step==='view'} className={_IC}/>
            </div>
          </div>

          {/* SK / SP */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 space-y-3">
            <div className="flex items-center justify-between">
              <p className="text-xs font-black text-slate-500 uppercase tracking-wider">Standard Kandungan & Pembelajaran</p>
              {step==='form' && (
                <div className="flex items-center gap-2">
                  <button onClick={handleNextSkSp} disabled={loadingNext}
                    title="Auto pilih SK/SP seterusnya berdasarkan RPH terakhir"
                    className="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-indigo-50 border border-indigo-200 text-[10px] font-black text-indigo-700 hover:bg-indigo-100 disabled:opacity-50 transition">
                    {loadingNext ? <Icon name="Loader" size={11} className="animate-spin"/> : <Icon name="SkipForward" size={11}/>}
                    {loadingNext ? 'Mencari...' : 'Seterusnya'}
                  </button>
                  <button onClick={()=>setShowDskp(true)} className="text-[10px] font-black text-purple-600 hover:underline">⚙ Urus DSKP</button>
                </div>
              )}
            </div>

            {/* Panel cari SK/SP — hanya dalam form mode */}
            {step==='form' && (
              <DskpPicker
                dskpList={dskpList}
                onSelect={item => {
                  setSkCustom(item.sk || '');
                  setSpCustom(item.sp || '');
                  if (item.tema)  setUnitTema(item.tema);
                  if (item.tajuk) setTajuk(prev => prev || item.tajuk);
                }}
                subjekNama={selectedSlot?.subjectName}
                showToast={showToast}
                onOpenDskp={()=>setShowDskp(true)}/>
            )}

            {[{label:'Standard Kandungan (SK)',val:skCustom,set:setSkCustom},{label:'Standard Pembelajaran (SP)',val:spCustom,set:setSpCustom}].map(({label,val,set})=>(
              <div key={label}>
                <label className="text-xs font-black text-slate-500 uppercase tracking-wider">{label}</label>
                <textarea value={val} onChange={e=>set(e.target.value)} rows={2} readOnly={step==='view'}
                  placeholder={step==='form'?'Pilih dari senarai di atas atau taip sendiri...':''}
                  className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 bg-slate-50 resize-none leading-relaxed"/>
              </div>
            ))}
            <div>
              <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Kemahiran</label>
              <input value={kemahiran} onChange={e=>setKemahiran(e.target.value)} readOnly={step==='view'} placeholder="cth: Berfikir kritis, Komunikasi" className={_IC}/>
            </div>
          </div>

          {/* Gemini */}
          {step==='form' && (
            <div className="bg-gradient-to-br from-purple-50 to-indigo-50 border border-purple-200 rounded-2xl p-4 space-y-3">
              <div className="flex items-center gap-2"><Icon name="Sparkles" size={16} className="text-purple-600"/><p className="text-sm font-black text-purple-800">Jana dengan AI</p></div>
              {geminiConfigured === false ? (
                <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 flex items-start gap-2">
                  <Icon name="AlertTriangle" size={14} className="text-amber-600 flex-shrink-0 mt-0.5"/>
                  <div><p className="text-xs font-black text-amber-800">API Key belum ditetapkan</p><p className="text-[10px] text-amber-600 mt-0.5">Pergi ke <span className="font-bold">Profil → AI Jana Kandungan RPH</span> untuk setup Groq (percuma).</p></div>
                </div>
              ) : (
                <>
                  <div className="grid grid-cols-3 gap-2">
                    {[{k:'objektif',l:'Objektif'},{k:'kriteria',l:'Kriteria Kejayaan'},{k:'aktiviti',l:'Aktiviti P&P'},{k:'bbm',l:'BBB/BBM'},{k:'pentaksiran',l:'Pentaksiran'},{k:'refleksi',l:'Refleksi'}].map(({k,l})=>(
                      <button key={k} onClick={()=>toggleGemField(k)} className={`flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-black border-2 transition active:scale-95 ${gemFields[k]?'bg-purple-600 text-white border-purple-600':'bg-white text-slate-600 border-slate-200 hover:border-purple-300'}`}>
                        <Icon name={gemFields[k]?'CheckSquare':'Square'} size={12}/>{l}
                      </button>
                    ))}
                  </div>
                  {['PENDIDIKAN ISLAM','PI','QURAN','TASMIK'].some(k=>(selectedSlot?.subjectName||'').toUpperCase().includes(k)) && (
                    <button onClick={()=>setUseJawi(v=>!v)}
                      className={`w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-black border-2 transition active:scale-95 ${useJawi?'bg-emerald-600 text-white border-emerald-600':'bg-white text-slate-600 border-slate-200 hover:border-emerald-300'}`}>
                      <span className="flex items-center gap-2"><Icon name={useJawi?'CheckSquare':'Square'} size={12}/>Jana dalam tulisan Jawi</span>
                      <span className="text-[10px] opacity-70">{useJawi?'✓ Aktif':'Pilih untuk output Jawi'}</span>
                    </button>
                  )}
                  <button onClick={handleGenerate} disabled={generating||!tajuk.trim()} className="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl font-black text-sm hover:opacity-90 active:scale-95 transition disabled:opacity-40 flex items-center justify-center gap-2">
                    {generating?<><Icon name="Loader2" size={16} className="animate-spin"/>Menjana...</>:<><Icon name="Sparkles" size={16}/>Jana Sekarang</>}
                  </button>
                </>
              )}
            </div>
          )}

          {/* Content fields */}
          {[
            {k:'objektif',  label:'Objektif Pembelajaran',        val:objektif,    set:setObjektif,    rows:4},
            {k:'kriteria',  label:'Kriteria Kejayaan',            val:kriteria,    set:setKriteria,    rows:3},
            {k:'aktiviti',  label:'Aktiviti P&P',                 val:aktiviti,    set:setAktiviti,    rows:14},
            {k:'bbm',       label:'Bahan Bantu Belajar (BBB/BBM)',val:bbm,         set:setBbm,         rows:4},
            {k:'pentaksiran',label:'Pentaksiran / Penilaian',     val:pentaksiran, set:setPentaksiran, rows:4},
            {k:'refleksi',  label:'Refleksi Guru',                val:refleksi,    set:setRefleksi,    rows:3},
          ].map(({k,label,val,set,rows}) => (
            <div key={k} className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
              <div className="flex items-center justify-between mb-1.5">
                <label className="text-xs font-black text-slate-500 uppercase tracking-wider">{label}</label>
                {step==='view' && val && (
                  <button onClick={()=>setEditingField(editingField===k?null:k)}
                    className="text-[10px] font-black text-purple-500 hover:text-purple-700 transition">
                    {editingField===k ? '✓ Selesai' : '✏️ Edit'}
                  </button>
                )}
              </div>
              {step==='view' && editingField !== k ? (
                <RphMarkdown text={val} placeholder={label}/>
              ) : (
                <textarea value={val} onChange={e=>set(e.target.value)} rows={rows}
                  placeholder={step==='form'?`${label}...`:''}
                  className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 resize-none leading-relaxed font-mono bg-slate-50"/>
              )}
            </div>
          ))}

          {step==='form' && (
            <button onClick={handleSave} disabled={saving||!tajuk.trim()} className="w-full py-3.5 bg-purple-600 text-white rounded-xl font-black hover:bg-purple-700 active:scale-95 transition disabled:opacity-40 flex items-center justify-center gap-2 shadow-lg shadow-purple-200">
              {saving?<><Icon name="Loader2" size={16} className="animate-spin"/>Menyimpan...</>:<><Icon name="Save" size={16}/>Simpan RPH</>}
            </button>
          )}
        </div>
      )}

      {/* Modals */}
      {showSetting && (
        <RphSettingModal user={user} teachers={teachers} ascMapping={ascMapping}
          onSave={async(tid,tname)=>{ await apiCall('saveTeacherAscMapping',user.uid,tid,tname); setAscMapping({ascTeacherId:tid,ascTeacherName:tname}); showToast('Setting disimpan!','success'); setShowSetting(false); }}
          onClose={()=>setShowSetting(false)}/>
      )}
      {showDskp && <DskpSettingsModal user={user} showToast={showToast} onClose={()=>setShowDskp(false)} ascSubjekList={ascSubjekList}/>}
      {confirmDel && <ConfirmModal title="Padam RPH?" message="RPH ini akan dipadamkan." danger onConfirm={handleDelete} onCancel={()=>setConfirmDel(null)}/>}
      {/* ── Modal PDF Result ── */}
      {pdfResult && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[250] flex items-center justify-center fade-in p-4" onClick={()=>setPdfResult(null)}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 pop-in space-y-4" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 bg-green-100 rounded-2xl flex items-center justify-center flex-shrink-0">
                <Icon name="CheckCircle" size={24} className="text-green-600"/>
              </div>
              <div>
                <p className="font-black text-slate-800">PDF Berjaya Dijana!</p>
                <p className="text-xs text-slate-400">{pdfResult.count} RPH · {pdfResult.nama}</p>
              </div>
            </div>
            <p className="text-xs text-slate-500 bg-slate-50 rounded-xl px-3 py-2.5">
              PDF disimpan dalam Google Drive anda di folder <span className="font-black">eCentral RPH</span>.
            </p>
            <div className="space-y-2">
              <a href={pdfResult.pdfUrl} target="_blank" rel="noopener"
                className="w-full py-3 bg-green-600 text-white rounded-xl font-black text-sm hover:bg-green-700 active:scale-95 transition flex items-center justify-center gap-2">
                <Icon name="ExternalLink" size={15}/> Buka PDF
              </a>
              <button onClick={()=>setPdfResult(null)}
                className="w-full py-2.5 text-slate-500 text-sm font-bold hover:bg-slate-50 rounded-xl transition">
                Tutup
              </button>
            </div>
          </div>
        </div>
      )}

      {showBulkRef && (
        <BulkRefleksiModal
          rphList={rphList.filter(r=>r.folderId===activeFolder?.folderId && !r.isCuti)}
          userId={user.uid}
          folderNama={activeFolder?.nama||''}
          showToast={showToast}
          onClose={()=>setShowBulkRef(false)}
          onDone={async()=>{
            setShowBulkRef(false);
            try { const r=await apiCall('getRphList',user.uid); setRphList(Array.isArray(r)?r:[]); } catch(e){}
          }}
        />
      )}
      {cutiModal && (
        <CutiRphModal
          tarikh={cutiModal.tarikh}
          hari={cutiModal.hari}
          cutiSedia={cutiModal.cuti}
          userId={user.uid}
          folderId={activeFolder?.folderId||''}
          showToast={showToast}
          onClose={()=>setCutiModal(null)}
          onDone={async()=>{
            setCutiModal(null);
            // Refresh rphList — cutiList auto-update via useEffect
            try { const r = await apiCall('getRphList', user.uid); setRphList(Array.isArray(r)?r:[]); } catch(e){}
          }}
        />
      )}
      {copyRphSrc && (
        <CopyRphModal
          destSlot={copyRphSrc}
          rphList={rphList}
          folders={folders}
          userId={user.uid}
          showToast={showToast}
          onClose={()=>setCopyRphSrc(null)}
          onDone={async()=>{
            setCopyRphSrc(null);
            const updated = await apiCall('getRphList', user.uid);
            setRphList(Array.isArray(updated)?updated:[]);
            showToast('RPH berjaya ditampal!','success');
          }}
        />
      )}
      {copyMinguSrc && (
        <CopyMingguModal
          destFolder={copyMinguSrc}
          folders={folders}
          userId={user.uid}
          rphList={rphList}
          showToast={showToast}
          onClose={()=>setCopyMinguSrc(null)}
          onDone={async()=>{
            setCopyMinguSrc(null);
            const updated = await apiCall('getRphList', user.uid);
            setRphList(Array.isArray(updated)?updated:[]);
            showToast('RPH berjaya ditampal ke ' + copyMinguSrc?.nama + '!', 'success');
          }}
        />
      )}
      {showArkib && (
        <ArkibRphModal
          userId={user.uid}
          folders={folders}
          rphList={rphList}
          showToast={showToast}
          onClose={()=>setShowArkib(false)}
          onCopy={rph => {
            // Copy kandungan RPH ke form semasa (jika ada slot aktif)
            setUnitTema(rph.unitTema||''); setTajuk(rph.tajuk||'');
            setSkCustom(rph.sk||''); setSpCustom(rph.sp||'');
            setKemahiran(rph.kemahiran||''); setObjektif(rph.objektif||'');
            setKriteria(rph.kriteria||''); setAktiviti(rph.aktiviti||'');
            setBbm(rph.bbm||''); setPentaksiran(rph.pentaksiran||'');
            setRefleksi(rph.refleksi||'');
            setShowArkib(false);
            showToast('Kandungan RPH berjaya disalin. Semak dan simpan.','success');
            // Kalau tiada slot aktif, hantar ke step folder dulu
            if (!selectedSlot) setStep('folder');
          }}
        />
      )}
    </div>
  );
};
