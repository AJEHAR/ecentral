const DokumenUploadModal = ({ folderId, userId, showToast, onClose, onDone }) => {
  const [files,     setFiles]    = useState([]);
  const [uploading, setUploading]= useState(false);
  const [progress,  setProgress] = useState(0); // current file index
  const [nota,      setNota]     = useState('');
  const fileRef = useRef(null);
  const MAX = 50 * 1024 * 1024;    // 50MB — had Google Drive
  const GAS_MAX = 6 * 1024 * 1024; // ~6MB — had selamat google.script.run

  const handleFiles = (e) => {
    const picked = Array.from(e.target.files || []);
    const ok = picked.filter(f => f.size <= MAX);
    const tooBig = picked.filter(f => f.size > MAX);
    if (tooBig.length) showToast(`${tooBig.length} fail diabaikan (melebihi 50MB).`, 'warning');
    setFiles(prev => [...prev, ...ok]);
  };

  const removeFile = (i) => setFiles(f => f.filter((_,idx)=>idx!==i));

  const handleUpload = async () => {
    if (files.length === 0) return;
    // Jika webAppUrl belum load, amaran untuk fail besar
    if (!window._webAppUrl) {
      const bigFiles = files.filter(f => f.size > GAS_MAX);
      if (bigFiles.length > 0) {
        const names = bigFiles.map(f=>`• ${f.name} (${(f.size/1024/1024).toFixed(1)}MB)`).join('\n');
        if (!window.confirm(`Web App URL belum dimuatkan. Fail besar mungkin gagal:\n${names}\n\nTeruskan?`)) return;
      }
    }
    setUploading(true);
    let done = 0, fail = 0;
    for (let i = 0; i < files.length; i++) {
      setProgress(i+1);
      try {
        const base64 = await new Promise((res,rej) => {
          const r = new FileReader();
          r.onload  = ev => res(ev.target.result.split(',')[1]);
          r.onerror = rej;
          r.readAsDataURL(files[i]);
        });
        // Guna fetch jika webAppUrl ada (bypass had 6MB), fallback ke apiCall
        if (window._webAppUrl) {
          await uploadViaFetch({
            userId, folderId, base64,
            nama: files[i].name,
            mimeType: files[i].type || 'application/octet-stream',
            nota: nota.trim(),
          });
        } else {
          await apiCall('uploadDokumen', JSON.stringify({
            userId, folderId, base64,
            nama: files[i].name,
            mimeType: files[i].type || 'application/octet-stream',
            nota: nota.trim(),
          }));
        }
        done++;
      } catch(e) { fail++; showToast(`Gagal: ${files[i].name} — ${String(e)}`, 'error'); }
    }
    setUploading(false);
    if (done > 0) { showToast(`${done} fail berjaya diupload!`, 'success'); onDone(); }
    else if (fail > 0) showToast('Semua fail gagal diupload. Cuba fail yang lebih kecil.', 'error');
  };

  return (
    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-end md:items-center justify-center fade-in" onClick={onClose}>
      <div className="bg-white rounded-t-3xl md:rounded-2xl shadow-2xl w-full md:max-w-md slide-up overflow-hidden flex flex-col" style={{maxHeight:'90dvh'}} onClick={e=>e.stopPropagation()}>

        <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
          <p className="font-black text-slate-800">Upload Dokumen</p>
          <button onClick={onClose} className="p-2 bg-slate-100 rounded-xl"><Icon name="X" size={15}/></button>
        </div>

        <div className="p-5 space-y-4 overflow-y-auto flex-1">
          {/* Drop zone */}
          <button onClick={()=>fileRef.current.click()}
            className="w-full py-8 border-2 border-dashed border-slate-200 rounded-2xl text-slate-400 hover:border-purple-300 hover:text-purple-400 transition flex flex-col items-center gap-2">
            <Icon name="Upload" size={28}/>
            <p className="text-sm font-black">Klik untuk pilih fail</p>
            <p className="text-[11px] font-normal">Semua format · Optimal &lt;6MB · Maks 50MB</p>
          </button>
          <input ref={fileRef} type="file" multiple className="hidden" onChange={handleFiles}/>

          {/* Senarai fail */}
          {files.length > 0 && (
            <div className="space-y-1.5">
              {files.map((f,i) => {
                const ext = (f.name.split('.').pop()||'').toUpperCase();
                const col = FILE_COLORS[ext] || FILE_COLORS.DEFAULT;
                return (
                  <div key={i} className="flex items-center gap-3 px-3 py-2.5 bg-slate-50 rounded-xl border border-slate-100">
                    <span className={`text-[10px] font-black px-1.5 py-0.5 rounded-lg ${col}`}>{ext||'FILE'}</span>
                    <p className="flex-1 text-xs font-bold text-slate-700 truncate">{f.name}</p>
                    <p className="text-[10px] text-slate-400 flex-shrink-0">{formatSaiz(f.size)}</p>
                    <button onClick={()=>removeFile(i)} className="p-1 text-slate-300 hover:text-red-400 transition"><Icon name="X" size={12}/></button>
                  </div>
                );
              })}
            </div>
          )}

          {/* Nota */}
          <div>
            <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Nota <span className="font-normal">(pilihan)</span></label>
            <input value={nota} onChange={e=>setNota(e.target.value)}
              placeholder="Nota untuk semua fail yang diupload..."
              className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 bg-slate-50"/>
          </div>
        </div>

        <div className="p-5 border-t border-slate-100">
          {uploading && (
            <div className="mb-3">
              <div className="flex justify-between text-xs text-slate-500 mb-1">
                <span>Mengupload {progress}/{files.length}...</span>
                <span>{Math.round(progress/files.length*100)}%</span>
              </div>
              <div className="w-full bg-slate-100 rounded-full h-2">
                <div className="bg-purple-500 h-2 rounded-full transition-all" style={{width: `${progress/files.length*100}%`}}/>
              </div>
            </div>
          )}
          <button onClick={handleUpload} disabled={uploading||files.length===0}
            className="w-full py-3.5 bg-purple-600 text-white rounded-xl font-black hover:bg-purple-700 active:scale-95 transition disabled:opacity-40 flex items-center justify-center gap-2">
            {uploading ? <><Icon name="Loader2" size={15} className="animate-spin"/>Mengupload...</>
                       : <><Icon name="Upload" size={15}/>Upload {files.length > 0 ? `${files.length} Fail` : ''}</>}
          </button>
        </div>
      </div>
    </div>
  );
};

// ── Komponen Utama ModulDokumen ──
const ModulDokumen = ({ user, showToast }) => {
  const [folders,       setFolders]       = useState([]);
  const [activeFolder,  setActiveFolder]  = useState(null);
  const [dokList,       setDokList]       = useState([]);
  const [loading,       setLoading]       = useState(false);
  const [loadingDok,    setLoadingDok]    = useState(false);
  const [showFolderModal, setShowFolderModal] = useState(false);
  const [editFolder,    setEditFolder]    = useState(null);
  const [showUpload,    setShowUpload]    = useState(false);
  const [search,        setSearch]        = useState('');
  const [filterTahun,   setFilterTahun]   = useState('');
  const [filterKat,     setFilterKat]     = useState('');
  const [deletingFold,  setDeletingFold]  = useState('');
  const [deletingDok,   setDeletingDok]   = useState('');

  // Load folders
  const loadFolders = async () => {
    setLoading(true);
    try {
      const r = await apiCall('getDokumenFolders', user.uid);
      setFolders(Array.isArray(r)?r:[]);
    } catch(e) { showToast(String(e),'error'); }
    setLoading(false);
  };
  useEffect(() => { loadFolders(); }, []);

  // Load dokumen bila folder berubah
  useEffect(() => {
    if (!activeFolder) { setDokList([]); return; }
    setLoadingDok(true);
    apiCall('getDokumenList', user.uid, activeFolder.folderId)
      .then(r => { setDokList(Array.isArray(r)?r:[]); setLoadingDok(false); })
      .catch(e => { showToast(String(e),'error'); setLoadingDok(false); });
  }, [activeFolder?.folderId]);

  // Grouping folder ikut tahun
  const tahunList  = useMemo(() => [...new Set(folders.map(f=>f.tahun||'').filter(Boolean))].sort((a,b)=>b.localeCompare(a)), [folders]);
  const kategoriList= useMemo(() => [...new Set(folders.map(f=>f.kategori||'').filter(Boolean))].sort(), [folders]);

  const filteredFolders = useMemo(() => folders.filter(f => {
    if (filterTahun && f.tahun !== filterTahun) return false;
    if (filterKat   && f.kategori !== filterKat) return false;
    if (search && !f.nama.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  }), [folders, filterTahun, filterKat, search]);

  const filteredDok = useMemo(() => {
    if (!search) return dokList;
    return dokList.filter(d => d.nama.toLowerCase().includes(search.toLowerCase()) || (d.nota||'').toLowerCase().includes(search.toLowerCase()));
  }, [dokList, search]);

  const handleSaveFolder = async (data) => {
    try {
      await apiCall('saveDokumenFolder', JSON.stringify({
        ...data, userId: user.uid,
        folderId: editFolder?.folderId || ''
      }));
      showToast(editFolder ? 'Folder dikemaskini!' : 'Folder baru dicipta!', 'success');
      setShowFolderModal(false); setEditFolder(null);
      await loadFolders();
    } catch(e) { showToast(String(e),'error'); }
  };

  const handleDeleteFolder = async (folder, e) => {
    e.stopPropagation();
    const cnt = await apiCall('getDokumenList', user.uid, folder.folderId).then(r=>(Array.isArray(r)?r:[]).length).catch(()=>0);
    if (!window.confirm(`Padam folder "${folder.nama}"${cnt>0?` dan ${cnt} dokumen di dalamnya`:''}?`)) return;
    setDeletingFold(folder.folderId);
    try {
      await apiCall('deleteDokumenFolder', folder.folderId, user.uid);
      showToast('Folder dipadam.', 'success');
      if (activeFolder?.folderId === folder.folderId) setActiveFolder(null);
      await loadFolders();
    } catch(e) { showToast(String(e),'error'); }
    setDeletingFold('');
  };

  const handleDeleteDok = async (dok) => {
    if (!window.confirm(`Padam "${dok.nama}"?`)) return;
    setDeletingDok(dok.dokId);
    try {
      await apiCall('deleteDokumen', dok.dokId, user.uid);
      showToast('Dokumen dipadam.', 'success');
      setDokList(d => d.filter(x=>x.dokId!==dok.dokId));
    } catch(e) { showToast(String(e),'error'); }
    setDeletingDok('');
  };

  return (
    <div className="space-y-4 fade-in">
      {/* Header */}
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div>
          <h2 className="text-lg font-black text-slate-800">Dokumen Saya</h2>
          <p className="text-xs text-slate-400">{folders.length} folder · Peribadi</p>
        </div>
        <button onClick={()=>{ setEditFolder(null); setShowFolderModal(true); }}
          className="flex items-center gap-2 px-3 py-2 bg-purple-600 text-white rounded-xl text-xs font-black hover:bg-purple-700 active:scale-95 transition shadow-md">
          <Icon name="FolderPlus" size={13}/> Folder Baru
        </button>
      </div>

      {/* Filter bar */}
      {folders.length > 0 && (
        <div className="flex gap-2 flex-wrap">
          <div className="relative flex-1 min-w-[160px]">
            <Icon name="Search" size={13} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"/>
            <input value={search} onChange={e=>setSearch(e.target.value)}
              placeholder={activeFolder ? 'Cari dokumen...' : 'Cari folder...'}
              className="w-full pl-8 pr-3 py-2 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-purple-300"/>
          </div>
          {!activeFolder && (<>
            {tahunList.length > 1 && (
              <select value={filterTahun} onChange={e=>setFilterTahun(e.target.value)}
                className="px-3 py-2 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:outline-none">
                <option value="">Semua Tahun</option>
                {tahunList.map(y=><option key={y} value={y}>{y}</option>)}
              </select>
            )}
            {kategoriList.length > 1 && (
              <select value={filterKat} onChange={e=>setFilterKat(e.target.value)}
                className="px-3 py-2 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:outline-none">
                <option value="">Semua Kategori</option>
                {kategoriList.map(k=><option key={k} value={k}>{k}</option>)}
              </select>
            )}
          </>)}
        </div>
      )}

      {/* View: Folder list */}
      {!activeFolder && (
        <>
          {loading ? (
            <div className="text-center py-16 text-slate-400 text-sm">Memuatkan...</div>
          ) : folders.length === 0 ? (
            <div className="text-center py-16">
              <div className="text-5xl mb-3">📁</div>
              <p className="font-black text-slate-500">Belum ada folder</p>
              <p className="text-xs text-slate-400 mt-1">Klik "Folder Baru" untuk mulakan</p>
            </div>
          ) : filteredFolders.length === 0 ? (
            <p className="text-center py-8 text-slate-400 text-sm">Tiada folder sepadan.</p>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              {filteredFolders.map(folder => {
                const col = getFolderColor(folder.warna);
                return (
                  <div key={folder.folderId} onClick={()=>{ setActiveFolder(folder); setSearch(''); }}
                    className="bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow-md hover:border-purple-200 transition cursor-pointer group overflow-hidden">
                    {/* Colour strip */}
                    <div className={`h-2 ${col.bg}`}/>
                    <div className="p-4">
                      <div className="flex items-start gap-3 mb-3">
                        <div className={`w-10 h-10 rounded-xl ${col.light} flex items-center justify-center flex-shrink-0`}>
                          <Icon name="FolderOpen" size={18} className={col.text}/>
                        </div>
                        <div className="flex-1 min-w-0">
                          <p className="font-black text-slate-800 text-sm leading-tight truncate">{folder.nama}</p>
                          <div className="flex items-center gap-1.5 mt-0.5 flex-wrap">
                            {folder.tahun    && <span className="text-[10px] font-black px-1.5 py-0.5 bg-slate-100 text-slate-500 rounded-full">{folder.tahun}</span>}
                            {folder.kategori && <span className={`text-[10px] font-black px-1.5 py-0.5 ${col.light} ${col.text} rounded-full`}>{folder.kategori}</span>}
                          </div>
                        </div>
                      </div>
                      {/* Actions */}
                      <div className="flex gap-1 pt-2 border-t border-slate-100">
                        <button onClick={e=>{ e.stopPropagation(); setEditFolder(folder); setShowFolderModal(true); }}
                          className="flex-1 py-1.5 text-[10px] font-black text-slate-400 hover:bg-slate-50 rounded-lg transition flex items-center justify-center gap-1">
                          <Icon name="Pencil" size={10}/> Edit
                        </button>
                        <div className="w-px bg-slate-100"/>
                        <button onClick={e=>handleDeleteFolder(folder,e)} disabled={deletingFold===folder.folderId}
                          className="flex-1 py-1.5 text-[10px] font-black text-red-400 hover:bg-red-50 rounded-lg transition flex items-center justify-center gap-1 disabled:opacity-40">
                          {deletingFold===folder.folderId ? <Icon name="Loader2" size={10} className="animate-spin"/> : <><Icon name="Trash2" size={10}/> Padam</>}
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}

      {/* View: Dokumen dalam folder */}
      {activeFolder && (
        <div className="space-y-3">
          {/* Sub-header */}
          <div className="flex items-center justify-between gap-2 flex-wrap">
            <div className="flex items-center gap-2">
              <button onClick={()=>{ setActiveFolder(null); setSearch(''); }}
                className="p-2.5 bg-slate-100 rounded-xl hover:bg-slate-200 active:scale-90 transition">
                <Icon name="ArrowLeft" size={18}/>
              </button>
              <div>
                <p className="font-black text-slate-800">{activeFolder.nama}</p>
                <p className="text-xs text-slate-400">
                  {activeFolder.tahun && `${activeFolder.tahun} · `}
                  {activeFolder.kategori && `${activeFolder.kategori} · `}
                  {dokList.length} dokumen
                </p>
              </div>
            </div>
            <button onClick={()=>setShowUpload(true)}
              className="flex items-center gap-1.5 px-3 py-2 bg-purple-600 text-white rounded-xl text-xs font-black hover:bg-purple-700 active:scale-95 transition shadow-md">
              <Icon name="Upload" size={13}/> Upload
            </button>
          </div>

          {/* Senarai dokumen */}
          {loadingDok ? (
            <div className="text-center py-12 text-slate-400 text-sm">Memuatkan...</div>
          ) : filteredDok.length === 0 && !search ? (
            <div className="text-center py-16">
              <div className="text-5xl mb-3">📂</div>
              <p className="font-black text-slate-500">Folder kosong</p>
              <p className="text-xs text-slate-400 mt-1">Klik "Upload" untuk tambah dokumen</p>
            </div>
          ) : filteredDok.length === 0 ? (
            <p className="text-center py-8 text-slate-400 text-sm">Tiada dokumen sepadan.</p>
          ) : (
            <div className="space-y-2">
              {filteredDok.map(dok => {
                const ext = (dok.format||'').toUpperCase();
                const icon = FILE_ICONS[ext] || FILE_ICONS.DEFAULT;
                const col  = FILE_COLORS[ext] || FILE_COLORS.DEFAULT;
                return (
                  <div key={dok.dokId} className="bg-white border border-slate-200 rounded-2xl p-4 flex items-center gap-3 hover:border-purple-200 transition group shadow-sm">
                    {/* Icon */}
                    <div className={`w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 text-lg ${col.replace('text-','bg-').replace('-700','-100')}`}>
                      {icon}
                    </div>
                    {/* Info */}
                    <div className="flex-1 min-w-0">
                      <p className="font-black text-slate-800 text-sm truncate">{dok.nama}</p>
                      <div className="flex items-center gap-2 mt-0.5">
                        <span className={`text-[9px] font-black px-1.5 py-0.5 rounded-full ${col}`}>{ext||'FAIL'}</span>
                        <span className="text-[10px] text-slate-400">{formatSaiz(dok.saiz)}</span>
                        {dok.nota && <span className="text-[10px] text-slate-400 truncate max-w-[120px]">· {dok.nota}</span>}
                      </div>
                    </div>
                    {/* Actions */}
                    <div className="flex items-center gap-1.5 flex-shrink-0">
                      <a href={dok.fileUrl} target="_blank" rel="noopener"
                        className="flex items-center gap-1.5 px-3 py-2 bg-purple-600 text-white rounded-xl text-xs font-black hover:bg-purple-700 active:scale-95 transition shadow-sm">
                        <Icon name="ExternalLink" size={13}/> Buka
                      </a>
                      <button onClick={()=>handleDeleteDok(dok)} disabled={deletingDok===dok.dokId}
                        className="p-2 bg-slate-50 text-slate-400 rounded-xl hover:bg-red-50 hover:text-red-500 transition disabled:opacity-40" title="Padam">
                        {deletingDok===dok.dokId ? <Icon name="Loader2" size={14} className="animate-spin"/> : <Icon name="Trash2" size={14}/>}
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* Modals */}
      {(showFolderModal||editFolder) && (
        <DokumenFolderModal
          folder={editFolder}
          onSave={handleSaveFolder}
          onClose={()=>{ setShowFolderModal(false); setEditFolder(null); }}
        />
      )}
      {showUpload && activeFolder && (
        <DokumenUploadModal
          folderId={activeFolder.folderId}
          userId={user.uid}
          showToast={showToast}
          onClose={()=>setShowUpload(false)}
          onDone={async()=>{
            setShowUpload(false);
            const r = await apiCall('getDokumenList', user.uid, activeFolder.folderId).catch(()=>[]);
            setDokList(Array.isArray(r)?r:[]);
          }}
        />
      )}
    </div>
  );
};

const DARJAH_LIST = ['Pra Sekolah','Tahun 1','Tahun 2','Tahun 3','Tahun 4','Tahun 5','Tahun 6'];

// Searchable dropdown component
const SearchableSelect = ({ value, onChange, options, placeholder, label }) => {
  const [open, setOpen]     = useState(false);
  const [query, setQuery]   = useState('');
  const ref = useRef(null);
  const filtered = options.filter(o => o.label.toLowerCase().includes(query.toLowerCase()));
  const selected = options.find(o => o.value === value);

  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  return (
    <div ref={ref} className="relative">
      {label && <label className="text-xs font-black text-slate-500 uppercase tracking-wider">{label}</label>}
      <button onClick={()=>setOpen(o=>!o)} type="button"
        className={`mt-1.5 w-full border rounded-xl px-3 py-2.5 text-sm font-bold text-left flex items-center justify-between transition focus:outline-none focus:ring-2 focus:ring-purple-400 ${value ? 'border-purple-300 bg-purple-50/50 text-slate-800' : 'border-slate-200 bg-slate-50 text-slate-400'}`}>
        <span className="truncate">{selected ? selected.label : placeholder}</span>
        <Icon name={open?'ChevronUp':'ChevronDown'} size={14} className="flex-shrink-0 ml-2 text-slate-400"/>
      </button>
      {open && (
        <div className="absolute z-50 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-xl overflow-hidden">
          <div className="p-2 border-b border-slate-100">
            <div className="relative">
              <Icon name="Search" size={13} className="absolute left-2.5 top-2.5 text-slate-400"/>
              <input autoFocus value={query} onChange={e=>setQuery(e.target.value)}
                placeholder="Cari..."
                className="w-full pl-7 pr-3 py-2 text-xs rounded-lg border border-slate-200 focus:outline-none focus:border-purple-400 bg-slate-50"/>
            </div>
          </div>
          <div className="max-h-48 overflow-y-auto">
            {filtered.length === 0
              ? <p className="text-xs text-slate-400 text-center py-3">Tiada hasil</p>
              : filtered.map(o => (
                  <button key={o.value} onClick={()=>{ onChange(o.value); setOpen(false); setQuery(''); }} type="button"
                    className={`w-full text-left px-3 py-2.5 text-sm hover:bg-purple-50 transition flex items-center gap-2 ${value===o.value?'bg-purple-50 font-black text-purple-700':'text-slate-700'}`}>
                    {value===o.value && <Icon name="Check" size={12} className="text-purple-600 flex-shrink-0"/>}
                    <span className="truncate">{o.label}</span>
                  </button>
                ))
            }
          </div>
        </div>
      )}
    </div>
  );
};

// ── RPT: Transfer Request Modal (Guru biasa hantar permohonan) ──
const RptRequestTransferModal = ({ rpt, userList, ascTeachers, user, showToast, onClose, onDone }) => {
  const [targetName, setTargetName] = useState('');
  const [targetUid,  setTargetUid]  = useState('');
  const [sebab,      setSebab]      = useState('');
  const [saving,     setSaving]     = useState(false);

  // Guru boleh pilih sama ada serah kepada orang lain (guna userList) ATAU tuntut RPT milik orang lain
  // Di sini: guru serah RPT mereka kepada guru lain
  const ownerOptions = userList
    .filter(u => u.uid !== rpt.ownerUserId)
    .map(u => ({ value: u.uid, label: u.fullName }));

  const handle = async () => {
    if (!targetUid || !sebab.trim()) { showToast('Sila pilih penerima dan nyatakan sebab.','warning'); return; }
    setSaving(true);
    try {
      await apiCall('submitRptTransferRequest', JSON.stringify({
        rptId:         rpt.rptId,
        rptFilename:   rpt.filename,
        fromUserId:    rpt.ownerUserId,
        fromUserName:  rpt.ownerName,
        toUserId:      targetUid,
        toUserName:    targetName,
        requestedBy:   user.uid,
        requestedByName: user.fullName,
        sebab:         sebab.trim()
      }));
      showToast('Permohonan dihantar! Menunggu kelulusan.','success');
      onDone();
    } catch(e) { showToast(String(e),'error'); }
    setSaving(false);
  };

  return (
    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] flex items-end md:items-center justify-center fade-in" onClick={()=>!saving&&onClose()}>
      <div className="bg-white rounded-t-3xl md:rounded-2xl shadow-2xl w-full md:max-w-md p-6 slide-up space-y-4 max-h-[92dvh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="w-10 h-1 bg-slate-300 rounded-full mx-auto md:hidden"/>
        <div className="flex items-center gap-2">
          <div className="w-8 h-8 rounded-xl bg-amber-100 flex items-center justify-center">
            <Icon name="ArrowRightLeft" size={15} className="text-amber-600"/>
          </div>

};

// ── RPT: Approve/Reject permohonan (Pentadbir + pemilik semasa) ──
const RptTransferRequestsPanel = ({ user, userList, showToast, onDone }) => {
  const isPriv = user.role === 'Admin' || user.role === 'Pentadbir';
  const [requests, setRequests] = useState([]);
  const [loading,  setLoading]  = useState(true);
  const [busy,     setBusy]     = useState('');

  const loadReq = async () => {
    setLoading(true);
    try {
      const r = await apiCall('getRptTransferRequests', user.uid, user.role);
      setRequests(Array.isArray(r) ? r : []);
    } catch(e) { showToast(String(e),'error'); }
    setLoading(false);
  };
  useEffect(() => { loadReq(); }, []);

  const decide = async (reqId, action) => {
    setBusy(reqId + action);
    try {
      await apiCall('decideRptTransferRequest', reqId, action, user.uid, user.role);
      showToast(action === 'Lulus' ? 'Permohonan diluluskan!' : 'Permohonan ditolak.', action === 'Lulus' ? 'success' : 'warning');
      loadReq();
      onDone();
    } catch(e) { showToast(String(e),'error'); }
    setBusy('');
  };

  if (loading) return <div className="flex justify-center py-6"><Icon name="Loader2" size={24} className="animate-spin text-purple-400"/></div>;
  if (requests.length === 0) return (
    <div className="text-center py-8 text-slate-400">
      <Icon name="CheckCircle" size={28} className="mx-auto mb-2 opacity-30"/>
      <p className="text-sm font-bold">Tiada permohonan menunggu</p>
    </div>
  );

  return (
    <div className="space-y-3">
      {requests.map(req => (
        <div key={req.reqId} className="bg-white border border-amber-200 rounded-2xl p-4 shadow-sm">
          <div className="flex items-start justify-between gap-3">
            <div className="flex-1 min-w-0">
              <p className="font-black text-slate-800 text-sm truncate">📄 {req.rptFilename}</p>
              <div className="mt-1.5 space-y-0.5 text-xs text-slate-600">
                <p>Dari: <b className="text-purple-700">{req.fromUserName}</b> → Kepada: <b className="text-green-700">{req.toUserName}</b></p>
                <p>Dimohon oleh: {req.requestedByName} · {new Date(req.createdAt).toLocaleDateString('ms-MY',{day:'numeric',month:'short'})}</p>
                {req.sebab && <p className="italic text-slate-500">"{req.sebab}"</p>}
              </div>
            </div>
            <span className="text-[10px] font-black px-2 py-1 bg-amber-100 text-amber-700 rounded-full flex-shrink-0">Menunggu</span>
          </div>
          <div className="flex gap-2 mt-3">
            <button onClick={()=>decide(req.reqId,'Tolak')} disabled={!!busy}
              className="flex-1 py-2 bg-red-50 text-red-600 border border-red-200 rounded-xl text-xs font-black hover:bg-red-100 transition disabled:opacity-40 active:scale-95">
              {busy===req.reqId+'Tolak' ? <Icon name="Loader2" size={12} className="animate-spin mx-auto"/> : '✕ Tolak'}
            </button>
            <button onClick={()=>decide(req.reqId,'Lulus')} disabled={!!busy}
              className="flex-1 py-2 bg-green-500 text-white rounded-xl text-xs font-black hover:bg-green-600 transition disabled:opacity-40 active:scale-95">
              {busy===req.reqId+'Lulus' ? <Icon name="Loader2" size={12} className="animate-spin mx-auto"/> : '✓ Lulus'}
            </button>
          </div>
        </div>
      ))}
    </div>
  );
};

const ModulRPT = ({ user, showToast }) => {
  const isPriv = user.role === 'Admin' || user.role === 'Pentadbir';
  const currentYear = new Date().getFullYear();

  const [settings,     setSettings]     = useState({ categories:[], subjects:[], panitia:[] });
  const [rptList,      setRptList]       = useState([]);
  const [userList,     setUserList]      = useState([]);
  const [ascTeachers,  setAscTeachers]   = useState([]);
  const [loading,      setLoading]       = useState(true);
  const [showUpload,   setShowUpload]    = useState(false);
  const [showSettings, setShowSettings]  = useState(false);
  const [editRpt,      setEditRpt]       = useState(null);   // direct transfer (priv only)
  const [reqRpt,       setReqRpt]        = useState(null);   // request transfer (guru)
  const [replaceRptData, setReplaceRptData] = useState(null); // gantikan RPT
  const [qrLoading,    setQrLoading]    = useState(false);   // jana QR sheet
  const [showRequests, setShowRequests]  = useState(false);
  const [pendingCount, setPendingCount]  = useState(0);
  const [confirmDel,   setConfirmDel]    = useState(null);

  // Filters
  const [fGuru,    setFGuru]    = useState('');
  const [fCat,     setFCat]     = useState('');
  const [fSubj,    setFSubj]    = useState('');
  const [fPanitia, setFPanitia] = useState('');
  const [fDarjah,  setFDarjah]  = useState('');
  const [fTahun,   setFTahun]   = useState('');
  const [fSearch,  setFSearch]  = useState('');

  const load = async () => {
    setLoading(true);
    try {
      const [sR, rR, uR, tR, pR] = await Promise.allSettled([
        apiCall('getRptSettings'),
        apiCall('getRptList'),
        apiCall('getUserListForRpt'),
        apiCall('getTeacherList'),
        apiCall('getRptTransferRequests', user.uid, user.role)
      ]);
      const s = sR.status === 'fulfilled' ? sR.value : null;
      const r = rR.status === 'fulfilled' ? rR.value : [];
      const u = uR.status === 'fulfilled' ? uR.value : [];
      const t = tR.status === 'fulfilled' ? tR.value : [];
      const pending = pR.status === 'fulfilled' ? pR.value : [];
      setSettings(s && typeof s === 'object' ? { categories: Array.isArray(s.categories)?s.categories:[], subjects: Array.isArray(s.subjects)?s.subjects:[], panitia: Array.isArray(s.panitia)?s.panitia:[] } : { categories:[], subjects:[], panitia:[] });
      setRptList(Array.isArray(r) ? r : []);
      setUserList(Array.isArray(u) ? u : []);
      setAscTeachers(Array.isArray(t) ? t : []);
      setPendingCount(Array.isArray(pending) ? pending.length : 0);
      // Log mana-mana yang gagal
      [sR,rR,uR,tR,pR].forEach((res,i) => { if(res.status==='rejected') console.warn('RPT load['+i+'] failed:', res.reason); });
    } catch(e) { showToast(String(e),'error'); }
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const teacherOptions = useMemo(() => userList.map(u => ({ value:u.uid, label:u.fullName })), [userList]);

  const filtered = useMemo(() => {
    const q = fSearch.toLowerCase();
    return rptList.filter(r =>
      (!fGuru    || r.ownerUserId === fGuru) &&
      (!fCat     || r.category    === fCat) &&
      (!fSubj    || r.subject     === fSubj) &&
      (!fPanitia || r.panitia     === fPanitia) &&
      (!fDarjah  || r.darjah      === fDarjah) &&
      (!fTahun   || String(r.tahun) === String(fTahun)) &&
      (!fSearch  || r.filename.toLowerCase().includes(q) || (r.ownerName||'').toLowerCase().includes(q) || (r.subject||'').toLowerCase().includes(q) || (r.panitia||'').toLowerCase().includes(q))
    );
  }, [rptList, fGuru, fCat, fSubj, fPanitia, fDarjah, fTahun, fSearch]);

  const activeFilters = [fGuru,fCat,fSubj,fPanitia,fDarjah,fTahun,fSearch].filter(Boolean).length;
  const clearFilters  = () => { setFGuru(''); setFCat(''); setFSubj(''); setFPanitia(''); setFDarjah(''); setFTahun(''); setFSearch(''); };

  const handleDelete = async () => {
    if (!confirmDel) return;
    try {
      await apiCall('deleteRpt', confirmDel, user.uid, user.role);
      showToast('RPT dipadamkan.','success');
      setConfirmDel(null); load();
    } catch(e) { showToast(String(e),'error'); setConfirmDel(null); }

            {pindaan.map(r => (

                    <p className="text-xs font-black text-slate-800 truncate">{r.filename}</p>

                        <span className="inline-flex items-center gap-1 text-xs font-black px-2 py-1 bg-purple-100 text-purple-700 rounded-lg">

                      <td className="px-4 py-3">

                      </td>
                      <td className="px-4 py-3">
                        {r.panitia ? <span className="text-[10px] font-black px-2 py-1 bg-teal-100 text-teal-700 rounded-lg">{r.panitia}</span> : <span className="text-slate-300">—</span>}
                      </td>
                      <td className="px-4 py-3">
                        {r.darjah ? <span className="text-[10px] font-black px-2 py-1 bg-green-100 text-green-700 rounded-lg">{r.darjah}</span> : <span className="text-slate-300">—</span>}
                      </td>
                      <td className="px-4 py-3">
                        <span className="text-[10px] font-black px-2 py-1 bg-slate-100 text-slate-600 rounded-lg">{r.tahun}</span>
                      </td>
                      <td className="px-4 py-3">
                        <div className="flex items-center justify-center gap-1.5">
                          {/* View */}
                          <a href={r.driveLink} target="_blank" rel="noopener" title="Buka Dokumen"
                            className="flex items-center gap-1 px-2.5 py-1.5 bg-blue-500 text-white rounded-lg text-[10px] font-black hover:bg-blue-600 transition active:scale-90 shadow-sm">
                            <Icon name="ExternalLink" size={11}/> Buka
                          </a>
                          {/* Kemaskini (gantikan fail) — guru bila ada pindaan */}
                          {canReplace && (
                            <button onClick={()=>setReplaceRptData(r)} title="Kemaskini Fail"
                              className="flex items-center gap-1 px-2.5 py-1.5 bg-amber-500 text-white rounded-lg text-[10px] font-black hover:bg-amber-600 transition active:scale-90 shadow-sm">
                              <Icon name="RefreshCw" size={11}/> Kemaskini
                            </button>
                          )}
                          {/* Direct Transfer — Pentadbir/Admin sahaja */}
                          {canDirectTransfer && (
                            <button onClick={()=>setEditRpt(r)} title="Pindah Milik Terus"
                              className="flex items-center gap-1 px-2.5 py-1.5 bg-amber-500 text-white rounded-lg text-[10px] font-black hover:bg-amber-600 transition active:scale-90 shadow-sm">
                              <Icon name="ArrowRightLeft" size={11}/> Pindah
                            </button>
                          )}
                          {/* Request Transfer — guru pemilik sahaja */}
                          {canRequestTransfer && (
                            <button onClick={()=>setReqRpt(r)} title="Mohon Pindah Milik"
                              className="flex items-center gap-1 px-2.5 py-1.5 bg-orange-400 text-white rounded-lg text-[10px] font-black hover:bg-orange-500 transition active:scale-90 shadow-sm">
                              <Icon name="SendHorizonal" size={11}/> Mohon
                            </button>
                          )}
                          {/* Delete */}
                          {canDelete && (
                            <button onClick={()=>setConfirmDel(r.rptId)} title="Padam"
                              className="flex items-center gap-1 px-2.5 py-1.5 bg-red-500 text-white rounded-lg text-[10px] font-black hover:bg-red-600 transition active:scale-90 shadow-sm">
                              <Icon name="Trash2" size={11}/> Padam
                            </button>
                          )}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {/* Mobile card view */}
          <div className="md:hidden divide-y divide-slate-100">
            {filtered.map((r, idx) => {
              const canDirectTransfer = isPriv;
              const canRequestTransfer = r.ownerUserId === user.uid && !isPriv;
              const canDelete = r.ownerUserId === user.uid || isPriv;
              return (
                <div key={r.rptId} className="p-4 space-y-2">
                  <div className="flex items-start gap-2">
                    <div className="w-8 h-8 rounded-lg bg-blue-50 border border-blue-100 flex items-center justify-center flex-shrink-0">
                      <Icon name="FileText" size={14} className="text-blue-600"/>
                    </div>
                    <div className="flex-1 min-w-0">
                      <p className="font-black text-slate-800 text-sm truncate">{r.filename}</p>
                      <p className="text-[10px] text-slate-400">{r.uploadedAt ? new Date(r.uploadedAt).toLocaleDateString('ms-MY',{day:'numeric',month:'short',year:'numeric'}) : ''}</p>
                    </div>
                  </div>
                  <div className="flex flex-wrap gap-1">
                    {r.ownerName && <span className="text-[10px] font-black px-2 py-0.5 bg-purple-100 text-purple-700 rounded-full flex items-center gap-1"><Icon name="User" size={9}/>{r.ownerName.split(' ')[0]}</span>}
                    {r.tahun     && <span className="text-[10px] font-black px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full">{r.tahun}</span>}
                    {r.category  && <span className="text-[10px] font-black px-2 py-0.5 bg-amber-100 text-amber-700 rounded-full">{r.category}</span>}
                    {r.subject   && <span className="text-[10px] font-black px-2 py-0.5 bg-blue-100 text-blue-700 rounded-full">{r.subject}</span>}
                    {r.panitia   && <span className="text-[10px] font-black px-2 py-0.5 bg-teal-100 text-teal-700 rounded-full">{r.panitia}</span>}
                    {r.darjah    && <span className="text-[10px] font-black px-2 py-0.5 bg-green-100 text-green-700 rounded-full">{r.darjah}</span>}
                  </div>
                  <div className="flex gap-1.5 pt-1">
                    <a href={r.driveLink} target="_blank" rel="noopener"
                      className="flex-1 flex items-center justify-center gap-1 py-2 bg-blue-500 text-white rounded-xl text-xs font-black hover:bg-blue-600 transition active:scale-95">
                      <Icon name="ExternalLink" size={12}/> Buka
                    </a>
                    {canDirectTransfer && (
                      <button onClick={()=>setEditRpt(r)}
                        className="flex-1 flex items-center justify-center gap-1 py-2 bg-amber-500 text-white rounded-xl text-xs font-black hover:bg-amber-600 transition active:scale-95">
                        <Icon name="ArrowRightLeft" size={12}/> Pindah
                      </button>
                    )}
                    {canRequestTransfer && (
                      <button onClick={()=>setReqRpt(r)}
                        className="flex-1 flex items-center justify-center gap-1 py-2 bg-orange-400 text-white rounded-xl text-xs font-black hover:bg-orange-500 transition active:scale-95">
                        <Icon name="SendHorizonal" size={12}/> Mohon
                      </button>
                    )}
                    {canDelete && (
                      <button onClick={()=>setConfirmDel(r.rptId)}
                        className="flex items-center justify-center gap-1 px-3 py-2 bg-red-500 text-white rounded-xl text-xs font-black hover:bg-red-600 transition active:scale-95">
                        <Icon name="Trash2" size={12}/>
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Modals */}
      {showUpload && (
        <RptUploadModal user={user} settings={settings} userList={userList} ascTeachers={ascTeachers} isPriv={isPriv}
          showToast={showToast} onClose={()=>setShowUpload(false)} onDone={()=>{ setShowUpload(false); load(); }}/>
      )}
      {/* Modal gantikan RPT */}
      {replaceRptData && (
        <RptUploadModal user={user} settings={settings} userList={userList} ascTeachers={ascTeachers} isPriv={isPriv}
          showToast={showToast} onClose={()=>setReplaceRptData(null)} onDone={()=>{ setReplaceRptData(null); load(); }}

      {showSettings && (
        <RptSettingsModal settings={settings} showToast={showToast}

      {/* Direct transfer — Pentadbir/Admin */}
      {editRpt && (

          onTransfer={(uid,name)=>handleTransfer(editRpt.rptId, uid, name)}

      {reqRpt && (
        <RptRequestTransferModal rpt={reqRpt} userList={userList} ascTeachers={ascTeachers} user={user}
          showToast={showToast} onClose={()=>setReqRpt(null)} onDone={()=>{ setReqRpt(null); load(); }}/>
      )}
      {/* Senarai permohonan menunggu */}

        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] flex items-end md:items-center justify-center fade-in" onClick={()=>setShowRequests(false)}>

            <div className="flex items-center justify-between flex-shrink-0">
              <h3 className="font-black text-slate-800">🔄 Permohonan Pindah Milik</h3>
              <button onClick={()=>setShowRequests(false)} className="p-1.5 rounded-lg hover:bg-slate-100 transition"><Icon name="X" size={16}/></button>
            </div>
            <div className="flex-1 overflow-y-auto min-h-0">
              <RptTransferRequestsPanel user={user} userList={userList} showToast={showToast} onDone={()=>{ load(); }}/>

      {confirmDel && (
        <ConfirmModal title="Padam RPT?" message="Dokumen ini akan dipadamkan. Fail di Google Drive tidak terpadam secara automatik."
          danger onConfirm={handleDelete} onCancel={()=>setConfirmDel(null)}/>
      )}
    </div>
  );
};

const RptUploadModal = ({ user, settings, userList, ascTeachers, isPriv, showToast, onClose, onDone, replaceRpt: replaceRptData }) => {
  const currentYear = new Date().getFullYear();
  const isReplace = !!replaceRptData;
  const [file,       setFile]       = useState(null);
  const [ownerId,    setOwnerId]    = useState(isReplace ? replaceRptData.ownerUserId : (isPriv ? '' : user.uid));
  const [ownerName,  setOwnerName]  = useState(isReplace ? replaceRptData.ownerName  : (isPriv ? '' : ''));
  const [pentadbirId,setPentadbirId]= useState(isReplace ? (replaceRptData.pentadbirUid||'') : '');
  const [category,   setCategory]   = useState(isReplace ? replaceRptData.category   : '');
  const [subject,    setSubject]    = useState(isReplace ? replaceRptData.subject     : '');
  const [panitia,    setPanitia]    = useState(isReplace ? replaceRptData.panitia     : '');
  const [darjah,     setDarjah]     = useState(isReplace ? replaceRptData.darjah      : '');
  const [tahun,      setTahun]      = useState(isReplace ? replaceRptData.tahun       : String(currentYear));
  const [uploading,  setUploading]  = useState(false);
  const [progress,   setProgress]   = useState('');
  const fileRef = useRef(null);

  const pentadbirOptions = userList.filter(u => u.role === 'Admin' || u.role === 'Pentadbir').map(u => ({ value:u.uid, label:u.fullName }));
  const handleFile = (e) => { const f = e.target.files[0]; if (f) setFile(f); };
  const isComplete = file && ownerName && subject && panitia && darjah && tahun;
  const toBase64 = (f) => new Promise((res,rej) => { const r = new FileReader(); r.onload = ev => res(ev.target.result.split(',')[1]); r.onerror = () => rej('Gagal baca fail'); r.readAsDataURL(f); });

  const handleUpload = async () => {
    if (!isComplete) { showToast('Sila lengkapkan semua maklumat.','warning'); return; }
    if (file.size > 3.5 * 1024 * 1024) { showToast('Fail terlalu besar. Maksimum 3.5MB.','error'); return; }
    setUploading(true);
    try {
      setProgress('Membaca fail...');
      const base64 = await toBase64(file);
      const mime = file.type || (file.name.endsWith('.pdf') ? 'application/pdf' : 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
      if (isReplace) {
        setProgress('Menggantikan fail lama...');
        await apiCall('replaceRpt', replaceRptData.rptId, base64, file.name, mime, user.uid, user.fullName);
        showToast('RPT berjaya dikemaskini! Status ditetapkan semula.','success');
      } else {
        setProgress('Menghantar ke Google Drive...');
        const driveResult = await apiCall('uploadRptToDrive', base64, file.name, mime);
        setProgress('Menyimpan maklumat...');
        await apiCall('saveRptMetadata', JSON.stringify({
          ownerUserId: ownerId, ownerName, pentadbirUid: pentadbirId,
          uploaderUserId: user.uid, uploaderName: user.fullName,
          filename: file.name, driveLink: driveResult.driveLink,
          category, subject, panitia, darjah, tahun, semakanStatus: 'Menunggu Semakan'
        }));
        showToast('RPT berjaya diupload!','success');
      }
      onDone();
    } catch(e) { showToast(String(e),'error'); setProgress(''); }
    setUploading(false);
  };

  return (
    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] flex items-end md:items-center justify-center fade-in" onClick={()=>!uploading&&onClose()}>
      <div className="bg-white rounded-t-3xl md:rounded-2xl shadow-2xl w-full md:max-w-md p-6 slide-up space-y-4 max-h-[95dvh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="w-10 h-1 bg-slate-300 rounded-full mx-auto md:hidden"/>
        <div className="flex items-center gap-2">
          <h3 className="font-black text-slate-800 text-base">{isReplace ? '🔄 Kemaskini RPT' : '📄 Upload RPT'}</h3>
          {isReplace && <span className="text-[10px] font-black px-2 py-0.5 bg-amber-100 text-amber-700 rounded-full">Status akan ditetapkan semula</span>}
        </div>
        {isReplace && (
          <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800 space-y-0.5">
            <p className="font-black">Menggantikan: {replaceRptData.filename}</p>
            <p className="text-amber-600">Fail lama digantikan dan status semakan ditetapkan semula kepada <b>Menunggu Semakan</b>.</p>
          </div>
        )}
        <div className="border-2 border-dashed border-purple-200 rounded-xl p-5 text-center bg-purple-50/30 cursor-pointer hover:border-purple-400 hover:bg-purple-50 transition" onClick={()=>fileRef.current?.click()}>
          {file ? (
            <><Icon name="FileText" size={22} className="text-purple-500 mx-auto mb-1"/>
            <p className="text-sm font-black text-purple-700 truncate">{file.name}</p>
            <p className="text-xs text-slate-400">{(file.size/1024/1024).toFixed(2)} MB · Klik untuk tukar</p></>
          ) : (
            <><Icon name="Upload" size={22} className="text-purple-300 mx-auto mb-1"/>
            <p className="text-sm font-black text-purple-500">{isReplace ? 'Pilih fail baru (PDF atau Word)' : 'Pilih fail PDF atau Word'}</p>
            <p className="text-xs text-slate-400">Maks 3.5MB · .pdf .doc .docx</p></>
          )}
        </div>
        <input ref={fileRef} type="file" accept=".pdf,.doc,.docx" className="hidden" onChange={handleFile}/>
        {!isReplace && (isPriv ? (
          <SearchableSelect value={ownerId}
            onChange={v => { setOwnerId(v); setOwnerName(userList.find(u=>u.uid===v)?.fullName||''); }}
            options={userList.map(u => ({ value:u.uid, label:u.fullName }))}
            placeholder="Pilih guru..." label="Pemilik RPT (Guru)"/>
        ) : (
          <div>
            <SearchableSelect value={ownerName}
              onChange={v => { setOwnerName(v); setOwnerId(user.uid); }}
              options={ascTeachers.map(t => ({ value:t.name, label:t.name }))}
              placeholder="Pilih nama anda dalam jadual..." label="Pemilik RPT (Guru)"/>
            {ascTeachers.length === 0 && <p className="text-xs text-amber-600 mt-1">⚠ Tiada data guru ASC. Admin perlu upload jadual XML dahulu.</p>}
          </div>
        ))}
        {!isPriv && !isReplace && pentadbirOptions.length > 0 && (
          <SearchableSelect value={pentadbirId} onChange={setPentadbirId}
            options={pentadbirOptions} placeholder="Pilih pentadbir atau GPK anda..." label="Pentadbir GPK"/>
        )}
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Kategori</label>
            <select value={category} onChange={e=>setCategory(e.target.value)} className={_SC}>
              <option value="">-- Pilih --</option>{(settings.categories||[]).map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Subjek</label>
            <select value={subject} onChange={e=>setSubject(e.target.value)} className={_SC}>
              <option value="">-- Pilih --</option>{(settings.subjects||[]).map(s=><option key={s}>{s}</option>)}
            </select>
          </div>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Panitia</label>
            <select value={panitia} onChange={e=>setPanitia(e.target.value)} className={_SC}>
              <option value="">-- Pilih --</option>{(settings.panitia||[]).map(p=><option key={p}>{p}</option>)}
            </select>
          </div>
          <div>
            <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Darjah</label>
            <select value={darjah} onChange={e=>setDarjah(e.target.value)} className={_SC}>
              <option value="">-- Pilih --</option>{DARJAH_LIST.map(d=><option key={d}>{d}</option>)}
            </select>
          </div>
        </div>
        <div>
          <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Tahun</label>
          <select value={tahun} onChange={e=>setTahun(e.target.value)} className={_SC}>
            {[currentYear, currentYear-1, currentYear+1].map(y=><option key={y} value={String(y)}>{y}</option>)}
          </select>
        </div>
        {uploading && (
          <div className="flex items-center gap-2 text-purple-600 text-sm font-bold bg-purple-50 rounded-xl px-3 py-2.5">
            <Icon name="Loader2" size={15} className="animate-spin"/>{progress}
          </div>
        )}
        <div className="flex gap-3 pt-1">
          <button onClick={onClose} disabled={uploading} className="flex-1 py-3 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition disabled:opacity-40">Batal</button>
          <button onClick={handleUpload} disabled={uploading || !isComplete}
            className={`flex-1 py-3 text-white rounded-xl font-black transition disabled:opacity-40 active:scale-95 shadow-lg ${isReplace?'bg-amber-500 hover:bg-amber-600':'bg-purple-600 hover:bg-purple-700'}`}>
            {uploading ? 'Menghantar...' : (isReplace ? '🔄 Kemaskini' : 'Upload')}
          </button>
        </div>
      </div>
    </div>
  );
};

const RptTransferModal = ({ rpt, userList, onTransfer, onClose }) => {
  const [newOwner, setNewOwner] = useState('');
  const [saving, setSaving]     = useState(false);
  const ownerOptions = userList.map(u => ({ value:u.uid, label:u.fullName }));
  const newOwnerName = userList.find(u=>u.uid===newOwner)?.fullName || '';

  const handle = async () => {
    if (!newOwner) return;
    setSaving(true);
    try { await onTransfer(newOwner, newOwnerName); } finally { setSaving(false); }
  };

  return (
    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] flex items-end md:items-center justify-center fade-in" onClick={onClose}>
      <div className="bg-white rounded-t-3xl md:rounded-2xl shadow-2xl w-full md:max-w-sm p-6 slide-up space-y-4" onClick={e=>e.stopPropagation()}>
        <div className="w-10 h-1 bg-slate-300 rounded-full mx-auto md:hidden"/>
        <h3 className="font-black text-slate-800">🔄 Pindah Milik RPT</h3>
        <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800">
          <p className="font-black mb-0.5">Dokumen: {rpt.filename}</p>
          <p>Pemilik semasa: <b>{rpt.ownerName}</b></p>
        </div>
        <SearchableSelect value={newOwner} onChange={setNewOwner}
          options={ownerOptions.filter(o=>o.value!==rpt.ownerUserId)}
          placeholder="Pilih guru baru..." label="Pindah kepada"/>
        <div className="flex gap-3">
          <button onClick={onClose} className="flex-1 py-3 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition">Batal</button>
          <button onClick={handle} disabled={saving||!newOwner}
            className="flex-1 py-3 bg-amber-500 text-white rounded-xl font-black hover:bg-amber-600 transition disabled:opacity-40 active:scale-95">
            {saving?'Memproses...':'Pindah Milik'}
          </button>
        </div>
      </div>
    </div>
  );
};

const RptSettingsModal = ({ settings, showToast, onClose, onSave }) => {
  const [categories, setCategories] = useState([...(settings?.categories||[])]);
  const [subjects,   setSubjects]   = useState([...(settings?.subjects||[])]);
  const [panitia,    setPanitia]    = useState([...(settings?.panitia||[])]);
  const [newVals,    setNewVals]    = useState({ categories:'', subjects:'', panitia:'' });
  const [saving, setSaving]         = useState(false);

  const add = (key, setter, list) => {
    const v = newVals[key].trim();
    if (v && !list.includes(v)) {
      setter(l => [...l, v]);
      setNewVals(p => ({...p, [key]:''}));
    }
  };

  const remove = (key, setter, item) => setter(l => l.filter(x => x !== item));

  const handleSave = async () => {
    setSaving(true);
    try { await onSave({ categories, subjects, panitia }); } finally { setSaving(false); }
  };

  const sections = [
    { key:'categories', label:'Kategori', list:categories, setter:setCategories, color:'amber' },
    { key:'subjects',   label:'Subjek',   list:subjects,   setter:setSubjects,   color:'blue'  },
    { key:'panitia',    label:'Panitia',  list:panitia,    setter:setPanitia,    color:'teal'  },
  ];

  return (
    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] flex items-end md:items-center justify-center fade-in" onClick={onClose}>
      <div className="bg-white rounded-t-3xl md:rounded-2xl shadow-2xl w-full md:max-w-md p-6 slide-up max-h-[92dvh] flex flex-col gap-4" onClick={e=>e.stopPropagation()}>
        <div className="w-10 h-1 bg-slate-300 rounded-full mx-auto md:hidden"/>
        <h3 className="font-black text-slate-800">⚙️ Tetapan RPT</h3>

        <div className="flex-1 overflow-y-auto space-y-5 min-h-0 pr-0.5">
          {sections.map(({ key, label, list, setter, color }) => (
            <div key={key}>
              <p className="text-xs font-black text-slate-500 uppercase tracking-wider mb-2">{label}</p>
              <div className="flex flex-wrap gap-1.5 mb-2 min-h-[32px]">
                {list.length === 0
                  ? <p className="text-xs text-slate-400 italic">Tiada item</p>
                  : list.map(item => (
                    <span key={item} className={`flex items-center gap-1 px-2.5 py-1 bg-${color}-100 text-${color}-700 rounded-full text-xs font-black`}>
                      {item}
                      <button onClick={()=>remove(key,setter,item)} className="hover:text-red-500 transition ml-0.5 leading-none">
                        <Icon name="X" size={9}/>
                      </button>
                    </span>
                  ))
                }
              </div>
              <div className="flex gap-2">
                <input value={newVals[key]} onChange={e=>setNewVals(p=>({...p,[key]:e.target.value}))}
                  onKeyDown={e=>e.key==='Enter'&&add(key,setter,list)}
                  placeholder={`Tambah ${label.toLowerCase()}...`}
                  className="flex-1 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"/>
                <button onClick={()=>add(key,setter,list)}
                  className="px-3 py-2 bg-purple-600 text-white rounded-xl hover:bg-purple-700 transition active:scale-90">
                  <Icon name="Plus" size={14}/>
                </button>
              </div>
            </div>
          ))}
        </div>

        <div className="flex gap-3 flex-shrink-0">
          <button onClick={onClose} className="flex-1 py-3 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition">Batal</button>
          <button onClick={handleSave} disabled={saving}
            className="flex-1 py-3 bg-purple-600 text-white rounded-xl font-black hover:bg-purple-700 transition disabled:opacity-40 active:scale-95">
            {saving?'Menyimpan...':'Simpan'}
          </button>
        </div>
      </div>
    </div>
  );
};

            {rpt.subject  && <span className="px-2 py-0.5 bg-blue-100 text-blue-700 rounded-full font-black">{rpt.subject}</span>}
            {rpt.panitia  && <span className="px-2 py-0.5 bg-teal-100 text-teal-700 rounded-full font-black">{rpt.panitia}</span>}
            {rpt.darjah   && <span className="px-2 py-0.5 bg-green-100 text-green-700 rounded-full font-black">{rpt.darjah}</span>}

              return (
                <button key={s} onClick={()=>setStatus(s)}
                  className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-black border-2 transition active:scale-95 ${active ? `${cfg.bg} ${cfg.text} border-current` : 'bg-white text-slate-500 border-slate-200 hover:border-slate-300'}`}>

};

const ModulSemakanRPT = ({ user, showToast }) => {
  const currentYear = new Date().getFullYear();
  const [rptList,    setRptList]    = useState([]);
  const [userList,   setUserList]   = useState([]);
  const [settings,   setSettings]   = useState({ categories:[], subjects:[], panitia:[] });
  const [loading,    setLoading]    = useState(true);
  const [semakRpt,   setSemakRpt]   = useState(null);

  // Filters
  const [fGuru,    setFGuru]    = useState('');
  const [fStatus,  setFStatus]  = useState('');
  const [fSubj,    setFSubj]    = useState('');
  const [fPanitia, setFPanitia] = useState('');
  const [fTahun,   setFTahun]   = useState(String(currentYear));
  const [fSearch,  setFSearch]  = useState('');

  const load = async () => {
    setLoading(true);
    try {
      const [r, u, s] = await Promise.all([
        apiCall('getRptListForSemakan', user.uid, user.role),
        apiCall('getUserListForRpt'),
        apiCall('getRptSettings'),
      ]);
      setRptList(Array.isArray(r) ? r : []);
      setUserList(Array.isArray(u) ? u : []);
      setSettings(s && typeof s === 'object' ? {
        categories: Array.isArray(s.categories) ? s.categories : [],
        subjects:   Array.isArray(s.subjects)   ? s.subjects   : [],
        panitia:    Array.isArray(s.panitia)    ? s.panitia    : [],
      } : { categories:[], subjects:[], panitia:[] });
    } catch(e) { showToast(String(e), 'error'); }
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  // Semua guru aktif dari userList
  const guruOptions = useMemo(() => userList.map(u => ({ value: u.uid, label: u.fullName })), [userList]);

  // Stats ringkasan
  const stats = useMemo(() => {
    const byStatus = {};
    Object.keys(STATUS_SEMAK).forEach(s => { byStatus[s] = 0; });
    rptList.forEach(r => {
      const s = r.semakanStatus || 'Belum Disemak';
      byStatus[s] = (byStatus[s] || 0) + 1;
    });
    return byStatus;
  }, [rptList]);

  const filtered = useMemo(() => {
    const q = fSearch.toLowerCase();
    return rptList.filter(r =>
      (!fGuru    || r.ownerUserId === fGuru) &&
      (!fStatus  || (r.semakanStatus || 'Menunggu Semakan') === fStatus) &&
      (!fSubj    || r.subject  === fSubj) &&
      (!fPanitia || r.panitia  === fPanitia) &&
      (!fTahun   || String(r.tahun) === String(fTahun)) &&
      (!fSearch  || (r.filename||'').toLowerCase().includes(q) ||
                    (r.ownerName||'').toLowerCase().includes(q) ||
                    (r.subject||'').toLowerCase().includes(q))
    );
  }, [rptList, fGuru, fStatus, fSubj, fPanitia, fTahun, fSearch]);

  const activeFilters = [fGuru,fStatus,fSubj,fPanitia,fSearch].filter(Boolean).length;
  const clearFilters  = () => { setFGuru(''); setFStatus(''); setFSubj(''); setFPanitia(''); setFSearch(''); };

  const statCards = [
    { label:'Jumlah RPT',        value: rptList.length,                     color:'purple', icon:'FolderOpen' },
    { label:'Menunggu Semakan',  value: stats['Menunggu Semakan']||0,        color:'slate',  icon:'Clock' },
    { label:'Perlu Pindaan',     value: stats['Perlu Pindaan']||0,          color:'amber',  icon:'AlertTriangle' },
    { label:'Lulus',             value: stats['Lulus']||0,                  color:'green',  icon:'CheckCircle' },
  ];

  // Jana QR sheet untuk cikgu tertentu (dari panel semakan)
  const [qrBusy, setQrBusy] = useState('');
  const handleGuruQr = async (ownerUid, ownerName) => {
    setQrBusy(ownerUid);
    try {
      const result = await apiCall('generateRptQrSheet', ownerUid);
      if (result && result.printUrl) {
        window.open(result.printUrl, '_blank');
        showToast(`Helaian QR ${ownerName} berjaya dijana! ${result.count} RPT Lulus.`, 'success');
      }
    } catch(e) { showToast(String(e), 'error'); }
    setQrBusy('');
  };

  return (
    <div className="space-y-4 fade-in">
      {/* Header */}
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div>
          <h2 className="text-lg font-black text-slate-800">Semakan RPT</h2>
          <p className="text-xs text-slate-400 mt-0.5">Semak dan beri status bagi RPT cikgu di bawah anda · {currentYear}</p>
        </div>
        <button onClick={load} className="flex items-center gap-1.5 px-3 py-2 bg-slate-100 border border-slate-200 text-slate-600 rounded-xl text-xs font-black hover:bg-slate-200 transition active:scale-90">
          <Icon name="RefreshCw" size={13}/> Muat Semula
        </button>
      </div>

      {/* Stats cards */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        {statCards.map(({ label, value, color, icon }) => (
          <div key={label} className={`bg-white rounded-2xl border border-slate-200 shadow-sm p-4 flex items-center gap-3`}>
            <div className={`w-10 h-10 rounded-xl bg-${color}-100 flex items-center justify-center flex-shrink-0`}>
              <Icon name={icon} size={18} className={`text-${color}-600`}/>
            </div>
            <div>
              <p className="text-2xl font-black text-slate-800">{value}</p>
              <p className="text-[10px] font-bold text-slate-400 leading-tight">{label}</p>
            </div>
          </div>
        ))}
      </div>

      {/* Progress bar Lulus */}
      {rptList.length > 0 && (
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
          <div className="flex items-center justify-between mb-2">
            <p className="text-xs font-black text-slate-600">Kemajuan Semakan</p>
            <p className="text-xs font-black text-green-600">{Math.round(((stats['Lulus']||0)/rptList.length)*100)}% Lulus</p>
          </div>
          <div className="h-2.5 bg-slate-100 rounded-full overflow-hidden flex">
            {['Lulus','Sedang Disemak','Perlu Pindaan','Ditolak','Belum Disemak'].map(s => {
              const pct = ((stats[s]||0)/rptList.length)*100;
              const colors = { 'Lulus':'bg-green-500','Sedang Disemak':'bg-blue-400','Perlu Pindaan':'bg-amber-400','Ditolak':'bg-red-400','Belum Disemak':'bg-slate-200' };
              return pct > 0 ? <div key={s} style={{width:pct+'%'}} className={`${colors[s]} transition-all`} title={`${s}: ${stats[s]||0}`}/> : null;
            })}
          </div>
          <div className="flex flex-wrap gap-x-4 gap-y-1 mt-2">
            {Object.entries(STATUS_SEMAK).map(([s, cfg]) => (
              stats[s] > 0 && (
                <span key={s} className={`text-[10px] font-black ${cfg.text} flex items-center gap-1`}>
                  <span className={`w-2 h-2 rounded-full ${cfg.bg.replace('bg-','bg-').replace('-100','-400')}`}/>
                  {s}: {stats[s]}
                </span>
              )
            ))}
          </div>
        </div>
      )}

      {/* Filter */}
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 space-y-3">
        <div className="relative">
          <Icon name="Search" size={14} className="absolute left-3 top-3.5 text-slate-400"/>
          <input value={fSearch} onChange={e=>setFSearch(e.target.value)}
            placeholder="Cari nama fail, guru, subjek..."
            className="w-full pl-8 pr-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-purple-400 text-sm bg-purple-50/30 focus:bg-white"/>

        <div className="grid grid-cols-2 gap-2 md:grid-cols-3">

          <div>
            <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Status</label>
            <select value={fStatus} onChange={e=>setFStatus(e.target.value)} className="mt-1.5 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-purple-400 bg-slate-50">
              <option value="">Semua Status</option>
              {Object.keys(STATUS_SEMAK).map(s=><option key={s}>{s}</option>)}
            </select>
          </div>
          <div>
            <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Subjek</label>
            <select value={fSubj} onChange={e=>setFSubj(e.target.value)} className="mt-1.5 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-purple-400 bg-slate-50">
              <option value="">Semua</option>{(settings.subjects||[]).map(s=><option key={s}>{s}</option>)}

              <Icon name="RotateCcw" size={11}/> Padam {activeFilters} filter
            </button>
          )}
        </div>
      </div>

      {/* Table */}
      {loading ? (
        <div className="flex justify-center py-10"><Icon name="Loader2" size={32} className="animate-spin text-purple-500"/></div>
      ) : filtered.length === 0 ? (
        <div className="text-center py-12 text-slate-400 bg-white rounded-2xl border border-slate-200">
          <Icon name="ClipboardCheck" size={36} className="mx-auto mb-2 opacity-30"/>
          <p className="font-bold">Tiada RPT ditemui</p>
          <p className="text-xs mt-1">{activeFilters > 0 ? 'Cuba ubah atau padam filter.' : 'Tiada RPT diupload lagi.'}</p>
        </div>
      ) : (
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">

                <tr className="bg-gradient-to-r from-slate-700 to-slate-800 text-white">

                  <th className="text-left px-4 py-3 text-xs font-black tracking-wider">NAMA FAIL</th>

                          {r.semakanStatus === 'Lulus' && (
                            <button onClick={()=>handleGuruQr(r.ownerUserId, r.ownerName)} disabled={qrBusy===r.ownerUserId}
                              className="flex items-center gap-1 px-2.5 py-1.5 bg-green-600 text-white rounded-lg text-[10px] font-black hover:bg-green-700 transition active:scale-90 shadow-sm disabled:opacity-60">
                              {qrBusy===r.ownerUserId ? <Icon name="Loader2" size={10} className="animate-spin"/> : <Icon name="QrCode" size={10}/>} QR
                            </button>
                          )}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {/* Mobile cards */}
          <div className="md:hidden divide-y divide-slate-100">
            {filtered.map(r => {
              const status = r.semakanStatus || 'Belum Disemak';
              return (
                <div key={r.rptId} className="p-4 space-y-2">
                  <div className="flex items-start justify-between gap-2">
                    <div className="flex-1 min-w-0">
                      <p className="font-black text-slate-800 text-sm truncate">{r.filename}</p>
                      <div className="flex flex-wrap gap-1 mt-1">
                        {r.ownerName && <span className="text-[10px] font-black px-2 py-0.5 bg-purple-100 text-purple-700 rounded-full">{r.ownerName.split(' ')[0]}</span>}
                        {r.subject   && <span className="text-[10px] font-black px-2 py-0.5 bg-blue-100 text-blue-700 rounded-full">{r.subject}</span>}
                        {r.darjah    && <span className="text-[10px] font-black px-2 py-0.5 bg-green-100 text-green-700 rounded-full">{r.darjah}</span>}
                      </div>
                    </div>
                    <SemakanBadge status={status}/>
                  </div>
                  {r.semakanKomen && (
                    <p className="text-[10px] text-slate-500 italic bg-slate-50 rounded-lg px-2 py-1.5 line-clamp-2">"{r.semakanKomen}"</p>
                  )}
                  <div className="flex gap-2">
                    <a href={r.driveLink} target="_blank" rel="noopener"
                      className="flex-1 flex items-center justify-center gap-1 py-2 bg-blue-500 text-white rounded-xl text-xs font-black hover:bg-blue-600 transition">
                      <Icon name="ExternalLink" size={12}/> Buka
                    </a>
                    <button onClick={()=>setSemakRpt(r)}
                      className="flex-1 flex items-center justify-center gap-1 py-2 bg-purple-600 text-white rounded-xl text-xs font-black hover:bg-purple-700 transition">
                      <Icon name="ClipboardCheck" size={12}/> Semak
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Modal semakan */}
      {semakRpt && (
        <SemakanModal rpt={semakRpt} user={user} showToast={showToast}
          onClose={()=>setSemakRpt(null)}
          onDone={()=>{ setSemakRpt(null); load(); }}/>
      )}
    </div>
  );
};

// ==========================================
// APP COMPONENT
// ==========================================
const App = () => {
  const [user, setUser] = useState(() => {
    try { const s = localStorage.getItem('ecentral_session'); return s ? JSON.parse(s) : null; } catch(e) { return null; }
  });
  const [view, setView] = useState(() => {
    try { const s = localStorage.getItem('ecentral_session'); return s ? 'dashboard' : 'landing'; } catch(e) { return 'landing'; }
  });
  const [toast, setToast] = useState(null);
  const [unreadCount, setUnreadCount] = useState(0);
  const [loading, setLoading] = useState(false);
  const showToast = useCallback((msg,type)=>setToast({message:msg,type}),[]);

  // ── Sembunyikan splash screen bila App berjaya render ──
  useEffect(() => {
    if (window._hideSplash) window._hideSplash();
  }, []);

  // ── setUserWithStorage: update state + localStorage
  const setUserWithStorage = useCallback((u) => {
    setUser(u);
    if (u) {
      try { localStorage.setItem('ecentral_session', JSON.stringify(u)); } catch(e){}
      try { window.parent.postMessage({ type: 'PUSH_INIT', userId: u.uid }, '*'); } catch(e){}
    } else {
      try { localStorage.removeItem('ecentral_session'); } catch(e){}
      try { window.parent.postMessage({ type: 'PUSH_DISABLE', userId: '' }, '*'); } catch(e){}
    }
  }, []);

  useEffect(() => {
    if (user) {
      try { localStorage.setItem('ecentral_session', JSON.stringify(user)); } catch(e){}
      try { window.parent.postMessage({ type: 'PUSH_INIT', userId: user.uid }, '*'); } catch(e){}
    }
  }, [user]);

  // ── Lazy load webAppUrl — hanya bila user sudah login (bukan semasa load awal) ──
  useEffect(() => {
    if (!user) return;
    apiCall('getWebAppUrl').then(r => { if (r?.url) window._webAppUrl = r.url; }).catch(()=>{});
  }, [user]);

  if (!user && view==='landing') return <Landing setView={setView}/>;
  if (!user && view==='login') return <AuthForm type="login" setView={setView} setUser={setUserWithStorage} showToast={showToast} setLoading={setLoading} loading={loading}/>;
  if (!user && view==='signup') return <AuthForm type="signup" setView={setView} setUser={setUserWithStorage} showToast={showToast} setLoading={setLoading} loading={loading}/>;

  return (
    <Layout user={user} setView={setView} currentView={view} setUser={setUserWithStorage} unreadCount={unreadCount}>
      {toast && <Toast message={toast.message} type={toast.type} onClose={()=>setToast(null)}/>}
      {(user.status==='Pending'||user.status==='Suspended') && (
        <div className="bg-amber-50 border border-amber-200 text-amber-800 px-4 py-3 rounded-2xl mb-5 flex items-center gap-3 shadow-sm">
          <Icon name="TriangleAlert" size={18} className="text-amber-500"/>
          <span className="text-sm">Akaun anda berstatus <b>{user.status}</b>. Hubungi Admin.</span>
        </div>
      )}
      {user.status==='PendingDelete' && (
        <PendingDeleteBanner user={user} setUser={setUserWithStorage} showToast={showToast}/>
      )}
      <div className="fade-in">
        {view==='dashboard' && <Dashboard user={user} setView={setView} showToast={showToast}/>}
        {view==='jadual'    && <ModulJadual user={user} showToast={showToast}/>}
        {view==='rph'       && <ModulRPH user={user} showToast={showToast}/>}
        {view==='rpt'       && <ModulRPT user={user} showToast={showToast}/>}
        {view==='semakan'   && (user.role==='Admin'||user.role==='Pentadbir') && <ModulSemakanRPT user={user} showToast={showToast}/>}
        {view==='profile'   && <ProfilePage user={user} setUser={setUserWithStorage} showToast={showToast}/>}
        {view==='akaun'     && user.role==='Admin' && <PengurusanAkaun user={user} showToast={showToast}/>}
        {view==='dokumen'   && <ModulDokumen user={user} showToast={showToast}/>}
        {view==='papan'     && <PapanPengumuman user={user} showToast={showToast} setUnreadCount={setUnreadCount}/>}
      </div>
    </Layout>
  );
};

// ── Render ──
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
