<script>
  // Sembunyikan splash selepas React render atau max 15s
  var _splashTimer = setTimeout(function(){ var s=document.getElementById('splash'); if(s) s.style.display='none'; }, 15000);
  window._hideSplash = function(){
    clearTimeout(_splashTimer);
    var s = document.getElementById('splash');
    if (!s) return;
    s.style.transition = 'opacity 0.3s';
    s.style.opacity = '0';
    setTimeout(function(){ s.style.display='none'; }, 300);
  };
  // Update status text
  window._splashStatus = function(msg){ var el=document.getElementById('splash-status'); if(el) el.textContent=msg; };
</script>
<script type="text/babel">

const _SC = "mt-1.5 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-purple-400 bg-slate-50";

const { useState, useEffect, useMemo, useRef, useCallback, Component } = React;

const useDevice = () => {
  const [isMobile, setIsMobile] = useState(() => window.innerWidth < 768);
  const [isIOS] = useState(() => /iPad|iPhone|iPod/.test(navigator.userAgent));
  const [isAndroid] = useState(() => /Android/.test(navigator.userAgent));
  useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);
  return { isMobile, isIOS, isAndroid, isPhone: isMobile };
};

class ErrorBoundary extends Component {
  constructor(props) { super(props); this.state = { hasError:false, error:null }; }
  static getDerivedStateFromError(error) { return { hasError:true, error }; }
  componentDidCatch(e,i) { console.error(e,i); }
  render() {
    if (this.state.hasError) return (
      <div className="min-h-screen flex items-center justify-center p-4">
        <div className="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full border-2 border-red-200">
          <h1 className="text-xl font-bold text-red-600 mb-4">⚠️ Ralat Teknikal</h1>
          <pre className="text-xs bg-slate-100 p-4 rounded-xl overflow-x-auto mb-4">{this.state.error?.toString()}</pre>
          <button onClick={()=>window.location.reload()} className="w-full py-3 bg-purple-600 text-white rounded-xl font-bold">Muat Semula</button>
        </div>
      </div>
    );
    return this.props.children;
  }
}

const apiCall = (fn, ...args) => new Promise((resolve, reject) => {
  if (!window.google?.script?.run) { reject("Google Apps Script tidak ditemui."); return; }
  google.script.run
    .withSuccessHandler(r => { try { resolve(typeof r==='string' ? JSON.parse(r) : r); } catch(e){ resolve(r); } })
    .withFailureHandler(e => { reject(e.message||e); })
    [fn](...args);
});

// ── Upload via fetch ke doPost (bypass ~6MB limit google.script.run) ──
// webAppUrl diset oleh App component masa load
window._webAppUrl = '';
const uploadViaFetch = async (payload) => {
  const url = window._webAppUrl;
  if (!url) throw new Error('Web App URL belum dimuatkan. Cuba muat semula halaman.');
  const resp = await fetch(url, {
    method: 'POST',
    body: JSON.stringify({ action: 'uploadDokumen', ...payload }),
  });
  const text = await resp.text();
  try {
    const json = JSON.parse(text);
    if (json.error) throw new Error(json.error);
    return json;
  } catch(e) { throw new Error('Response tidak sah: ' + text.slice(0,100)); }
};

const Icon = ({ name, size=20, className="" }) => {
  const d = ICON_PATHS[name];
  if (!d) return <span style={{width:size,height:size,display:'inline-flex'}} className={className}/>;
  const spin = name === 'Loader2' || name === 'Loader';
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"
      className={`inline-block${spin ? ' animate-spin' : ''}${className ? ' '+className : ''}`}
      dangerouslySetInnerHTML={{__html: d}}
    />
  );
};

const Toast = ({ message, type='info', onClose }) => {
  const cfg = { error:{bg:'bg-red-500',icon:'CircleAlert'}, success:{bg:'bg-purple-500',icon:'CircleCheck'}, info:{bg:'bg-purple-500',icon:'Info'}, warning:{bg:'bg-amber-500',icon:'TriangleAlert'} };
  const {bg,icon} = cfg[type]||cfg.info;
  useEffect(()=>{ const t=setTimeout(onClose,4500); return ()=>clearTimeout(t); },[]);
  return (
    <div className={`fixed top-0 left-0 right-0 z-[200] mx-4 mt-4 md:left-auto md:right-5 md:top-5 md:mx-0 px-4 py-3 rounded-2xl text-white shadow-2xl slide-up ${bg} flex items-center gap-3 md:max-w-sm border border-white/20`}
      style={{marginTop:'calc(env(safe-area-inset-top, 0px) + 16px)'}}>
      <Icon name={icon} size={18}/><span className="font-semibold text-sm flex-1">{message}</span>
      <button onClick={onClose} className="opacity-70 hover:opacity-100"><Icon name="X" size={16}/></button>
    </div>
  );
};

const StatusBadge = ({ status }) => {
  const map = {
    'Draft':'bg-slate-100 text-slate-600 border-slate-200',
    'Submitted':'bg-orange-100 text-orange-700 border-orange-200',
    'Dihantar':'bg-orange-100 text-orange-700 border-orange-200',
    'Reviewed':'bg-purple-100 text-purple-700 border-purple-200',
    'Disahkan':'bg-purple-100 text-purple-700 border-purple-200',
    'Dikembalikan':'bg-red-100 text-red-700 border-red-200',
    'Belum Cipta':'bg-red-50 text-red-600 border-red-200',
    'Active':'bg-purple-100 text-purple-700 border-purple-200',
    'Pending':'bg-amber-100 text-amber-700 border-amber-200',
    'Suspended':'bg-red-100 text-red-700 border-red-200',
    'PendingDelete':'bg-rose-100 text-rose-700 border-rose-200',
  };
  const label = {'PendingDelete':'⏳ Minta Padam'};
  return <span className={`px-2.5 py-1 text-xs font-bold rounded-full border ${map[status]||'bg-gray-100 text-gray-600 border-gray-200'}`}>{label[status]||status}</span>;

// ==========================================
// IMAGE CROP MODAL — drag to pan, slider to zoom
// ==========================================

const ImageCropModal = ({ imageSrc, onConfirm, onCancel }) => {
  const CANVAS_SIZE = 320;
  const CIRCLE_R = 140;

  const [imgNaturalSize, setImgNaturalSize] = useState({ w: 1, h: 1 });
  const [scale, setScale] = useState(1);
  const [offset, setOffset] = useState({ x: 0, y: 0 });
  const [isDragging, setIsDragging] = useState(false);
  const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
  const [offsetStart, setOffsetStart] = useState({ x: 0, y: 0 });
  const imgRef = useRef(null);
  const containerRef = useRef(null);

  // Compute base scale so image fills the circle at scale=1
  const baseScale = useMemo(() => {
    const minDim = Math.min(imgNaturalSize.w, imgNaturalSize.h);
    return (CIRCLE_R * 2) / minDim;
  }, [imgNaturalSize]);

  const effectiveScale = baseScale * scale;

  const clampOffset = useCallback((ox, oy, s) => {
    const bs = baseScale * s;
    const iw = imgNaturalSize.w * bs;
    const ih = imgNaturalSize.h * bs;
    const cx = CANVAS_SIZE / 2;
    const cy = CANVAS_SIZE / 2;
    const minX = cx - iw + CIRCLE_R;
    const maxX = cx - CIRCLE_R;
    const minY = cy - ih + CIRCLE_R;
    const maxY = cy - CIRCLE_R;
    return {
      x: Math.min(maxX, Math.max(minX, ox)),
      y: Math.min(maxY, Math.max(minY, oy)),
    };
  }, [imgNaturalSize, baseScale]);

  // Centre image initially when loaded
  const handleImgLoad = (e) => {
    const { naturalWidth, naturalHeight } = e.target;
    setImgNaturalSize({ w: naturalWidth, h: naturalHeight });
    const bs = (CIRCLE_R * 2) / Math.min(naturalWidth, naturalHeight);
    const iw = naturalWidth * bs;
    const ih = naturalHeight * bs;
    setOffset({ x: (CANVAS_SIZE - iw) / 2, y: (CANVAS_SIZE - ih) / 2 });
  };

  const getEventPos = (e) => {
    if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  };

  const onPointerDown = (e) => {
    e.preventDefault();
    setIsDragging(true);
    const pos = getEventPos(e);
    setDragStart(pos);
    setOffsetStart({ ...offset });
  };

  const onPointerMove = useCallback((e) => {
    if (!isDragging) return;
    e.preventDefault();
    const pos = getEventPos(e);
    const dx = pos.x - dragStart.x;
    const dy = pos.y - dragStart.y;
    setOffset(clampOffset(offsetStart.x + dx, offsetStart.y + dy, scale));
  }, [isDragging, dragStart, offsetStart, scale, clampOffset]);

  const onPointerUp = useCallback(() => { setIsDragging(false); }, []);

  useEffect(() => {
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);
    return () => {
      window.removeEventListener('mousemove', onPointerMove);
      window.removeEventListener('mouseup', onPointerUp);
      window.removeEventListener('touchmove', onPointerMove);
      window.removeEventListener('touchend', onPointerUp);
    };
  }, [onPointerMove, onPointerUp]);

  const handleZoomChange = (newScale) => {
    const ns = parseFloat(newScale);
    const newOff = clampOffset(offset.x, offset.y, ns);
    setScale(ns);
    setOffset(newOff);
  };

  const handleConfirm = () => {
    const canvas = document.createElement('canvas');
    const OUTPUT = 300;
    canvas.width = OUTPUT;
    canvas.height = OUTPUT;
    const ctx = canvas.getContext('2d');

    // Clip to circle
    ctx.beginPath();
    ctx.arc(OUTPUT/2, OUTPUT/2, OUTPUT/2, 0, Math.PI*2);
    ctx.clip();

    // Ratio: output/canvas_size
    const ratio = OUTPUT / CANVAS_SIZE;
    const es = baseScale * scale;
    ctx.drawImage(
      imgRef.current,
      0, 0,
      imgNaturalSize.w, imgNaturalSize.h,
      offset.x * ratio, offset.y * ratio,
      imgNaturalSize.w * es * ratio, imgNaturalSize.h * es * ratio
    );

    const result = canvas.toDataURL('image/jpeg', 0.85);
    onConfirm(result);
  };

  const iw = imgNaturalSize.w * effectiveScale;
  const ih = imgNaturalSize.h * effectiveScale;

  return (
    <div className="crop-modal-overlay fade-in">
      <div className="bg-white/5 backdrop-blur-md rounded-3xl border border-white/10 p-5 mx-4 w-full max-w-sm shadow-2xl slide-up">
        {/* Header */}
        <div className="text-center mb-4">
          <p className="text-white font-black text-base">Laras Gambar Profil</p>
          <p className="text-white/50 text-xs mt-1">Seret untuk pindah • Zur untuk zum</p>
        </div>

        {/* Crop area */}
        <div className="flex justify-center mb-4">
          <div
            ref={containerRef}
            className="crop-container"
            style={{ width: CANVAS_SIZE, height: CANVAS_SIZE, maxWidth: '100%' }}
            onMouseDown={onPointerDown}
            onTouchStart={onPointerDown}
          >
            {/* Dark overlay with circle cutout using SVG */}
            <div style={{position:'absolute',inset:0,zIndex:2,pointerEvents:'none'}}>
              <svg width={CANVAS_SIZE} height={CANVAS_SIZE} style={{display:'block'}}>
                <defs>
                  <mask id="circleMask">
                    <rect width={CANVAS_SIZE} height={CANVAS_SIZE} fill="white"/>
                    <circle cx={CANVAS_SIZE/2} cy={CANVAS_SIZE/2} r={CIRCLE_R} fill="black"/>
                  </mask>
                </defs>
                <rect width={CANVAS_SIZE} height={CANVAS_SIZE} fill="rgba(0,0,0,0.6)" mask="url(#circleMask)"/>
                <circle cx={CANVAS_SIZE/2} cy={CANVAS_SIZE/2} r={CIRCLE_R} fill="none" stroke="rgba(79,70,229,0.8)" strokeWidth="2.5"/>
                {/* Guide lines */}
                <line x1={CANVAS_SIZE/2 - CIRCLE_R} y1={CANVAS_SIZE/2} x2={CANVAS_SIZE/2 + CIRCLE_R} y2={CANVAS_SIZE/2} stroke="rgba(255,255,255,0.15)" strokeWidth="1"/>
                <line x1={CANVAS_SIZE/2} y1={CANVAS_SIZE/2 - CIRCLE_R} x2={CANVAS_SIZE/2} y2={CANVAS_SIZE/2 + CIRCLE_R} stroke="rgba(255,255,255,0.15)" strokeWidth="1"/>
              </svg>
            </div>

            {/* Image */}
            <img
              ref={imgRef}
              src={imageSrc}
              alt="crop"
              className="crop-img"
              style={{ width: iw, height: ih, left: offset.x, top: offset.y }}
              onLoad={handleImgLoad}
              draggable={false}
            />
          </div>
        </div>

        {/* Zoom slider */}
        <div className="flex items-center gap-3 mb-5 px-1">
          <Icon name="ZoomOut" size={16} className="text-white/50 flex-shrink-0"/>
          <input
            type="range" min="1" max="4" step="0.01"
            value={scale}
            onChange={e => handleZoomChange(e.target.value)}
            className="crop-zoom-bar flex-1"
          />
          <Icon name="ZoomIn" size={16} className="text-white/50 flex-shrink-0"/>
        </div>

        {/* Actions */}
        <div className="flex gap-3">
          <button onClick={onCancel}
            className="flex-1 py-3 rounded-2xl bg-white/10 text-white font-bold text-sm hover:bg-white/20 active:scale-95 transition border border-white/10">
            Batal
          </button>
          <button onClick={handleConfirm}
            className="flex-1 py-3 rounded-2xl bg-purple-500 text-white font-black text-sm hover:bg-purple-600 active:scale-95 transition shadow-lg shadow-purple-900/50 flex items-center justify-center gap-2">
            <Icon name="Check" size={16}/>
            Guna Gambar
          </button>
        </div>
      </div>
    </div>
  );
};

const TutorialModal = ({ onClose, setView }) => {
  const [step, setStep] = React.useState(0);
  const total = TUTORIAL_STEPS.length;
  const current = TUTORIAL_STEPS[step];
  const isFirst = step === 0;
  const isLast = step === total - 1;
  const progressPct = Math.round((step / (total - 1)) * 100);

  React.useEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, [onClose]);

  return (
    <div
      onClick={onClose}
      style={{
        position:'fixed', inset:0, zIndex:9999,
        background:'rgba(30,10,60,0.72)',
        backdropFilter:'blur(6px)',
        display:'flex', alignItems:'center', justifyContent:'center',
        padding:'16px',
      }}
    >
      <div
        onClick={e=>e.stopPropagation()}
        style={{
          background:'white', borderRadius:'28px', width:'100%', maxWidth:'480px',
          maxHeight:'90vh', display:'flex', flexDirection:'column',
          boxShadow:'0 32px 80px rgba(0,0,0,0.35)',
          overflow:'hidden', animation:'popIn 0.28s cubic-bezier(0.34,1.56,0.64,1)',
        }}
      >
        {/* Header strip */}
        <div style={{background:`linear-gradient(135deg, ${current.color}dd, ${current.color})`, padding:'20px 24px 16px', position:'relative', flexShrink:0}}>
          <button onClick={onClose} style={{position:'absolute',top:'14px',right:'16px',background:'rgba(255,255,255,0.2)',border:'none',borderRadius:'50%',width:'32px',height:'32px',cursor:'pointer',color:'white',fontSize:'16px',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'900'}}>✕</button>
          <div style={{fontSize:'36px',marginBottom:'6px',lineHeight:1}}>{current.icon}</div>
          <div style={{color:'rgba(255,255,255,0.7)',fontSize:'11px',fontWeight:'800',textTransform:'uppercase',letterSpacing:'0.12em',marginBottom:'2px'}}>{current.subtitle}</div>
          <div style={{color:'white',fontSize:'17px',fontWeight:'900',lineHeight:'1.3'}}>{current.title}</div>
          {/* Progress bar */}
          <div style={{marginTop:'14px',background:'rgba(255,255,255,0.25)',borderRadius:'999px',height:'5px'}}>
            <div style={{height:'100%',background:'white',borderRadius:'999px',width:`${progressPct}%`,transition:'width 0.35s ease'}}/>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:'4px'}}>
            <span style={{color:'rgba(255,255,255,0.6)',fontSize:'10px',fontWeight:'700'}}>{step + 1} / {total}</span>
            <span style={{color:'rgba(255,255,255,0.6)',fontSize:'10px',fontWeight:'700'}}>{progressPct}%</span>
          </div>
        </div>

        {/* Body */}
        <div style={{flex:1, overflowY:'auto', padding:'20px 24px'}}>
          {current.isIntro && (
            <div style={{textAlign:'center',padding:'8px 0'}}>
              <div style={{fontSize:'56px',marginBottom:'12px'}}>👋</div>
              <p style={{color:'#475569',fontSize:'14px',lineHeight:'1.7',marginBottom:'16px'}}>{current.desc}</p>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',marginTop:'8px'}}>
                {(current.modules||[{e:'📝',t:'Daftar & Login'},{e:'📖',t:'RPH'},{e:'📚',t:'Bank SK/SP'},{e:'✨',t:'Auto Jana'},{e:'🗃️',t:'Arkib RPH'},{e:'📁',t:'RPT'},{e:'🗓️',t:'Jadual'},{e:'🗂️',t:'Dokumen'},{e:'👤',t:'Profil & API'}]).map((m,i)=>(
                  <div key={i} style={{background:'#f8fafc',borderRadius:'12px',padding:'10px 6px',textAlign:'center'}}>
                    <div style={{fontSize:'20px'}}>{m.e}</div>
                    <div style={{fontSize:'10px',fontWeight:'800',color:'#64748b',marginTop:'3px'}}>{m.t}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
          {current.isDone && (
            <div style={{textAlign:'center',padding:'8px 0'}}>
              <div style={{fontSize:'56px',marginBottom:'12px'}}>🎉</div>
              <p style={{color:'#475569',fontSize:'14px',lineHeight:'1.7',marginBottom:'20px'}}>{current.desc}</p>
              <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
                <button
                  onClick={()=>{ onClose(); setView('signup'); }}
                  style={{padding:'14px',background:'linear-gradient(135deg,#7c3aed,#9333ea)',color:'white',border:'none',borderRadius:'14px',fontWeight:'900',fontSize:'14px',cursor:'pointer',boxShadow:'0 4px 14px rgba(124,58,237,0.35)'}}>
                  ✍️ Daftar Akaun Baru
                </button>
                <button
                  onClick={()=>{ onClose(); setView('login'); }}
                  style={{padding:'14px',background:'#f3e8ff',color:'#7c3aed',border:'2px solid #e9d5ff',borderRadius:'14px',fontWeight:'900',fontSize:'14px',cursor:'pointer'}}>
                  🔐 Sudah ada akaun? Log Masuk
                </button>
              </div>
            </div>
          )}
          {current.steps && (
            <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
              {current.steps.map((s, i) => (
                <div key={i} style={{background:'#f8fafc',borderRadius:'14px',padding:'13px 14px',display:'flex',gap:'11px',alignItems:'flex-start'}}>
                  <span style={{fontSize:'18px',flexShrink:0,marginTop:'1px'}}>{s.icon}</span>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:'800',fontSize:'13px',color:'#1e293b',marginBottom:'3px'}}>{s.title}</div>
                    {s.desc && <div style={{fontSize:'12px',color:'#64748b',lineHeight:'1.55'}}>{s.desc}</div>}
                    {s.list && (
                      <ul style={{margin:'5px 0 0',paddingLeft:'14px',listStyle:'disc'}}>
                        {s.list.map((li,j)=>(
                          <li key={j} style={{fontSize:'12px',color:'#475569',lineHeight:'1.6',fontWeight:'600'}}>{li}</li>
                        ))}
                      </ul>
                    )}
                  </div>
                </div>
              ))}
              {current.tip && (
                <div style={{background:'#fffbeb',border:'1.5px solid #fde68a',borderRadius:'12px',padding:'10px 13px',fontSize:'12px',color:'#92400e',fontWeight:'700',lineHeight:'1.5'}}>
                  {current.tip}
                </div>
              )}
            </div>
          )}
        </div>

        {/* Footer nav */}
        <div style={{padding:'14px 24px 20px',borderTop:'1px solid #f1f5f9',display:'flex',gap:'10px',flexShrink:0}}>
          <button
            onClick={()=>setStep(s=>Math.max(0,s-1))}
            disabled={isFirst}
            style={{flex:1,padding:'12px',background:isFirst?'#f1f5f9':'#f3e8ff',color:isFirst?'#cbd5e1':'#7c3aed',border:'none',borderRadius:'14px',fontWeight:'800',fontSize:'13px',cursor:isFirst?'default':'pointer',transition:'all 0.15s'}}>
            ← Sebelum
          </button>
          <button
            onClick={()=>{ if(isLast) onClose(); else setStep(s=>s+1); }}
            style={{flex:2,padding:'12px',background:`linear-gradient(135deg,${current.color}dd,${current.color})`,color:'white',border:'none',borderRadius:'14px',fontWeight:'900',fontSize:'13px',cursor:'pointer',boxShadow:`0 4px 12px ${current.color}55`,transition:'all 0.15s'}}>
            {isLast ? '✕ Tutup Tutorial' : isFirst ? 'Mula Tutorial →' : step === total-2 ? '🎉 Selesai!' : 'Seterusnya →'}
          </button>
        </div>
      </div>
    </div>
  );
};

const APP_LAUNCHER_COLORS = [
  '#7c3aed','#1d4ed8','#0f766e','#166534','#b45309','#be185d','#9f1239','#374151'
];

const AppFormModal = ({ app, onSave, onClose }) => {
  const [name, setName]       = useState(app?.name || '');
  const [url, setUrl]         = useState(app?.url || '');
  const [initial, setInitial] = useState(app?.initial || '');
  const [color, setColor]     = useState(app?.color || '#7c3aed');
  const [logo, setLogo]       = useState(app?.logo || '');
  const [saving, setSaving]   = useState(false);
  const fileRef = useRef(null);

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 96; canvas.height = 96;
        const ctx = canvas.getContext('2d');
        const sz = Math.min(img.width, img.height);
        const sx = (img.width - sz) / 2;
        const sy = (img.height - sz) / 2;
        ctx.drawImage(img, sx, sy, sz, sz, 0, 0, 96, 96);
        setLogo(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  const handleSave = async () => {
    if (!name.trim() || !url.trim()) return;
    setSaving(true);
    try {
      let finalUrl = url.trim();
      if (!finalUrl.toLowerCase().startsWith('http')) finalUrl = `https://${finalUrl}`;
      const entry = {
        id:      app?.id || Date.now().toString(),
        name:    name.trim(),
        url:     finalUrl,
        initial: initial.trim().slice(0,2).toUpperCase() || name.trim()[0].toUpperCase(),
        color,
        logo
      };
      await onSave(entry);
    } finally { setSaving(false); }
  };

  const previewInitial = initial || name[0] || '?';

  return (
    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] flex items-end md:items-center justify-center fade-in" onClick={onClose}>
      <div className="bg-white rounded-t-3xl md:rounded-2xl shadow-2xl w-full md:max-w-sm p-6 slide-up border border-slate-200 space-y-4" onClick={e=>e.stopPropagation()}>
        <div className="w-10 h-1 bg-slate-300 rounded-full mx-auto md:hidden"/>
        <h3 className="text-base font-black text-slate-800">{app ? '✏️ Edit App' : '➕ Tambah App'}</h3>

        {/* Preview */}
        <div className="flex justify-center">
          <div className="w-16 h-16 rounded-2xl overflow-hidden flex items-center justify-center shadow-md border border-slate-100"
            style={{background: logo ? 'white' : color}}>
            {logo
              ? <img src={logo} className="w-full h-full object-cover" alt="logo"/>
              : <span className="text-white font-black text-xl">{previewInitial}</span>
            }
          </div>
        </div>

        {/* Upload logo */}
        <div>
          <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Logo (optional)</label>
          <div className="mt-1.5 flex gap-2">
            <button onClick={()=>fileRef.current?.click()}
              className="flex-1 py-2 border border-dashed border-slate-300 rounded-xl text-xs font-bold text-slate-500 hover:border-purple-400 hover:text-purple-600 transition active:scale-95">
              📷 Upload Gambar
            </button>
            {logo && <button onClick={()=>setLogo('')} className="px-3 py-2 bg-red-50 text-red-500 rounded-xl text-xs font-bold hover:bg-red-100 transition active:scale-90">Buang</button>}
          </div>
          <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleFile}/>
        </div>

        {/* Warna + inisial (hanya jika tiada logo) */}
        {!logo && (
          <div className="space-y-3">
            <div>
              <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Warna Latar</label>
              <div className="mt-1.5 flex gap-2 flex-wrap">
                {APP_LAUNCHER_COLORS.map(c => (
                  <button key={c} onClick={()=>setColor(c)}
                    className={`w-8 h-8 rounded-xl border-2 transition active:scale-90 ${color===c?'border-slate-700 scale-110':'border-transparent hover:border-slate-300'}`}
                    style={{background:c}}/>
                ))}
              </div>
            </div>
            <div>
              <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Inisial (1-2 huruf)</label>
              <input value={initial} onChange={e=>setInitial(e.target.value.toUpperCase().slice(0,2))}
                maxLength={2} placeholder="cth: K"
                className="mt-1.5 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-black focus:outline-none focus:ring-2 focus:ring-purple-400 uppercase tracking-widest text-center"/>
            </div>
          </div>
        )}

        {/* Nama App */}
        <div>
          <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Nama App</label>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="cth: eCentral"
            className="mt-1.5 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-purple-400"/>
        </div>

        {/* URL */}
        <div>
          <label className="text-xs font-black text-slate-500 uppercase tracking-wider">URL</label>
          <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://contoh.github.io"
            className="mt-1.5 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-purple-400"/>
        </div>

        <div className="flex gap-3 pt-1">
          <button onClick={onClose} className="flex-1 py-3 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition active:scale-95">Batal</button>
          <button onClick={handleSave} disabled={saving || !name.trim() || !url.trim()}
            className="flex-1 py-3 bg-purple-600 text-white rounded-xl font-black hover:bg-purple-700 transition disabled:opacity-50 shadow-lg shadow-purple-100 active:scale-95">
            {saving ? 'Menyimpan...' : 'Simpan'}
          </button>
        </div>
      </div>
    </div>
  );
};

const AppLauncher = ({ user }) => {
  const isAdmin = user?.role === 'Admin';
  const [apps, setApps]       = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal]     = useState(null); // null | 'add' | appObj
  const [hovered, setHovered] = useState(null);
  const [confirm, setConfirm] = useState(null);

  useEffect(() => {
    apiCall('getAppLauncher')
      .then(data => { setApps(Array.isArray(data) ? data : []); setLoading(false); })
      .catch(() => setLoading(false));
  }, []);

  const persist = async (newApps) => {
    await apiCall('saveAppLauncher', JSON.stringify(newApps));
    setApps(newApps);
  };

  const handleSave = async (entry) => {
    const idx = apps.findIndex(a => a.id === entry.id);
    const next = idx >= 0
      ? apps.map(a => a.id === entry.id ? entry : a)
      : [...apps, entry];
    await persist(next);
    setModal(null);
  };

  const handleDelete = async (id) => {
    await persist(apps.filter(a => a.id !== id));
    setConfirm(null);
  };

  if (loading) return null;
  if (apps.length === 0 && !isAdmin) return null;

  return (
    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
      <div className="flex items-center justify-between mb-3">
        <p className="text-xs font-black text-slate-500 uppercase tracking-wider">App Launcher</p>
        {isAdmin && (
          <button onClick={()=>setModal('add')}
            className="w-7 h-7 rounded-xl bg-purple-50 border border-purple-200 text-purple-600 flex items-center justify-center hover:bg-purple-100 transition active:scale-90">
            <Icon name="Plus" size={14}/>
          </button>
        )}
      </div>

      {apps.length === 0 ? (
        <p className="text-xs text-slate-400 text-center py-2">Tiada app. Klik + untuk tambah.</p>
      ) : (
        <div className="flex flex-wrap gap-3">
          {apps.map(app => (
            <div key={app.id} className="relative flex flex-col items-center gap-1"
              style={{width:72}}
              onMouseEnter={()=>setHovered(app.id)}
              onMouseLeave={()=>setHovered(null)}>

              <button
                onClick={()=>window.open(app.url,'_blank','noopener')}
                className="w-14 h-14 rounded-2xl overflow-hidden flex items-center justify-center shadow-sm border border-slate-100 active:scale-95 transition hover:shadow-md hover:-translate-y-0.5"
                style={{background: app.logo ? 'white' : app.color}}
                title={app.name}>
                {app.logo
                  ? <img src={app.logo} className="w-full h-full object-cover" alt={app.name}/>
                  : <span className="text-white font-black text-lg leading-none">{app.initial || app.name[0]}</span>
                }
              </button>

              <span className="text-[10px] font-bold text-slate-600 leading-tight truncate w-full text-center">{app.name}</span>

              {/* Admin hover actions */}
              {isAdmin && hovered === app.id && (
                <div className="absolute -top-1.5 -right-1 flex gap-1 pop-in z-10">
                  <button onClick={e=>{e.stopPropagation();setModal(app);}}
                    className="w-5 h-5 bg-purple-500 text-white rounded-md flex items-center justify-center shadow-md hover:bg-purple-600 transition active:scale-90">
                    <Icon name="Pencil" size={9}/>
                  </button>
                  <button onClick={e=>{e.stopPropagation();setConfirm(app.id);}}
                    className="w-5 h-5 bg-red-500 text-white rounded-md flex items-center justify-center shadow-md hover:bg-red-600 transition active:scale-90">
                    <Icon name="Trash2" size={9}/>
                  </button>
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      {(modal === 'add' || (modal && modal.id)) && (
        <AppFormModal app={modal === 'add' ? null : modal} onSave={handleSave} onClose={()=>setModal(null)}/>
      )}
      {confirm && (
        <ConfirmModal
          title="Padam App?"
          message="App ini akan dipadamkan daripada launcher."
          danger={true}
          onConfirm={()=>handleDelete(confirm)}
          onCancel={()=>setConfirm(null)}/>
      )}
    </div>
  );
};

// ==========================================
// DASHBOARD
// ==========================================
const DashboardPersonal = ({ user, showToast, setView }) => {
  const currentYear = new Date().getFullYear();
  const DAY_MS = ['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
  const todayName = DAY_MS[new Date().getDay()];
  const [tab, setTab] = useState('hari'); // 'hari' | 'minggu'
  const [slots, setSlots] = useState([]);
  const [jadualLoading, setJadualLoading] = useState(true);
  const [ascMapping, setAscMapping] = useState(null);
  const [rptList, setRptList] = useState([]);
  const [rptLoading, setRptLoading] = useState(true);
  const [qrLoading, setQrLoading] = useState(false);
  const [replaceRpt, setReplaceRpt] = useState(null);
  const [settings, setSettings] = useState({ categories:[], subjects:[], panitia:[] });
  const [userList, setUserList] = useState([]);
  const [ascTeachers, setAscTeachers] = useState([]);

  const [ascTeachersList, setAscTeachersList] = useState([]);
  const [settingAsc, setSettingAsc] = useState(false);
  const [selAscId, setSelAscId] = useState('');
  const [savingAsc, setSavingAsc] = useState(false);

  useEffect(() => {
    // Load jadual
    apiCall('getTeacherList').then(t => { if (Array.isArray(t)) setAscTeachersList(t); }).catch(()=>{});
    apiCall('getTeacherAscMapping', user.uid).then(m => {
      setAscMapping(m);
      if (m?.ascTeacherId) {
        apiCall('getScheduleByTeacher', m.ascTeacherId)
          .then(s => { setSlots(Array.isArray(s)?s:[]); setJadualLoading(false); })
          .catch(() => setJadualLoading(false));
      } else { setJadualLoading(false); }
    }).catch(() => setJadualLoading(false));

    // Load RPT tahun semasa
    Promise.allSettled([
      apiCall('getRptList'),
      apiCall('getRptSettings'),
      apiCall('getUserListForRpt'),
      apiCall('getTeacherList'),
    ]).then(([rR, sR, uR, tR]) => {
      const allRpt = rR.status==='fulfilled' && Array.isArray(rR.value) ? rR.value : [];
      setRptList(allRpt.filter(r => r.ownerUserId===user.uid && String(r.tahun)===String(currentYear)));
      if (sR.status==='fulfilled' && sR.value) setSettings({ categories: Array.isArray(sR.value.categories)?sR.value.categories:[], subjects: Array.isArray(sR.value.subjects)?sR.value.subjects:[], panitia: Array.isArray(sR.value.panitia)?sR.value.panitia:[] });
      if (uR.status==='fulfilled' && Array.isArray(uR.value)) setUserList(uR.value);
      if (tR.status==='fulfilled' && Array.isArray(tR.value)) setAscTeachers(tR.value);
      setRptLoading(false);
    });
  }, []);

  const saveAscMapping = async () => {
    if (!selAscId) return;
    setSavingAsc(true);
    try {
      const selName = ascTeachersList.find(t=>t.id===selAscId)?.name || '';
      await apiCall('saveTeacherAscMapping', user.uid, selAscId, selName);
      setAscMapping({ ascTeacherId: selAscId, ascTeacherName: selName });
      setSettingAsc(false);
      // Load jadual baru
      setJadualLoading(true);
      const s = await apiCall('getScheduleByTeacher', selAscId);
      setSlots(Array.isArray(s)?s:[]);
      setJadualLoading(false);
      showToast('Nama jadual berjaya ditetapkan!', 'success');
    } catch(e) { showToast(String(e),'error'); }
    setSavingAsc(false);
  };

  const DAYS = ['Isnin','Selasa','Rabu','Khamis','Jumaat'];
  const todaySlots = slots.filter(s => s.day === todayName).sort((a,b) => a.period - b.period);
  const hasLulus = rptList.some(r => r.semakanStatus === 'Lulus');
  const pindaan  = rptList.filter(r => r.semakanStatus === 'Perlu Pindaan' || r.semakanStatus === 'Ditolak');

  const handlePrintQr = async () => {
    setQrLoading(true);
    try {
      const result = await apiCall('generateRptQrSheet', user.uid);
      if (result?.printUrl) { window.open(result.printUrl,'_blank'); showToast(`${result.count} RPT Lulus — helaian QR dijana!`,'success'); }
    } catch(e) { showToast(String(e),'error'); }
    setQrLoading(false);
  };

  const statusCfg = { 'Lulus':{bg:'bg-green-100',text:'text-green-700',icon:'CheckCircle'}, 'Perlu Pindaan':{bg:'bg-amber-100',text:'text-amber-700',icon:'AlertTriangle'}, 'Ditolak':{bg:'bg-red-100',text:'text-red-700',icon:'XCircle'}, 'Sedang Disemak':{bg:'bg-blue-100',text:'text-blue-700',icon:'Eye'}, 'Menunggu Semakan':{bg:'bg-slate-100',text:'text-slate-600',icon:'Clock'} };

  return (
    <div className="space-y-4 mt-1">
      <div className="flex items-center justify-between">
        <p className="text-sm font-black text-slate-700">Paparan Peribadi</p>
        <span className="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">{currentYear}</span>
      </div>

      {/* Notifikasi pindaan */}
      {pindaan.length > 0 && (
        <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 space-y-2">
          <div className="flex items-center gap-2">
            <Icon name="AlertTriangle" size={14} className="text-amber-600 flex-shrink-0"/>
            <p className="text-xs font-black text-amber-800">{pindaan.length} RPT memerlukan tindakan</p>
          </div>
          {pindaan.map(r => (
            <div key={r.rptId} className="bg-white border border-amber-100 rounded-xl p-3 space-y-1.5">
              <div className="flex items-start justify-between gap-2">
                <div className="flex-1 min-w-0">
                  <p className="text-xs font-black text-slate-800 truncate">{r.filename}</p>
                  <div className="flex flex-wrap gap-1 mt-1">
                    {r.subject && <span className="text-[10px] font-black px-1.5 py-0.5 bg-blue-100 text-blue-700 rounded">{r.subject}</span>}
                    {r.darjah  && <span className="text-[10px] font-black px-1.5 py-0.5 bg-green-100 text-green-700 rounded">{r.darjah}</span>}
                  </div>
                </div>
                <div className="flex gap-1.5 flex-shrink-0">
                  <a href={r.driveLink} target="_blank" rel="noopener" className="p-1.5 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition"><Icon name="ExternalLink" size={12}/></a>
                  <button onClick={()=>setReplaceRpt(r)} className="p-1.5 bg-amber-50 text-amber-700 rounded-lg hover:bg-amber-100 transition"><Icon name="RefreshCw" size={12}/></button>
                </div>
              </div>
              {r.semakanKomen && <p className="text-[10px] text-amber-700 italic bg-amber-50 rounded-lg px-2 py-1.5">💬 "{r.semakanKomen}"</p>}
            </div>
          ))}
        </div>
      )}

      {/* Jadual */}
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        {/* Tab header */}
        <div className="flex items-center border-b border-slate-100">
          <button onClick={()=>setTab('hari')}
            className={`flex-1 py-3 text-xs font-black transition ${tab==='hari' ? 'bg-purple-50 text-purple-700 border-b-2 border-purple-600' : 'text-slate-500 hover:text-slate-700'}`}>
            📅 Hari Ini
            {tab==='hari' && todayName !== 'Ahad' && todayName !== 'Sabtu' && <span className="ml-1 text-[10px] font-bold text-purple-400">({todayName})</span>}
          </button>
          <button onClick={()=>setTab('minggu')}
            className={`flex-1 py-3 text-xs font-black transition ${tab==='minggu' ? 'bg-purple-50 text-purple-700 border-b-2 border-purple-600' : 'text-slate-500 hover:text-slate-700'}`}>
            🗓️ Minggu
          </button>
          {ascMapping && !settingAsc && (
            <button onClick={()=>{ setSettingAsc(true); setSelAscId(ascMapping.ascTeacherId||''); setTab('hari'); }}
              className="px-3 py-3 text-[10px] font-black text-slate-400 hover:text-purple-600 transition border-l border-slate-100 flex-shrink-0"
              title={`Nama: ${ascMapping.ascTeacherName}`}>
              <Icon name="Settings" size={13}/>
            </button>
          )}
        </div>

        {jadualLoading ? (
          <div className="flex justify-center py-8"><Icon name="Loader2" size={22} className="animate-spin text-purple-400"/></div>
        ) : !ascMapping || settingAsc ? (
          <div className="p-4 space-y-3">
            <div className="flex items-start gap-2">
              <Icon name="Info" size={14} className="text-blue-500 flex-shrink-0 mt-0.5"/>
              <p className="text-xs text-slate-600">
                {settingAsc ? 'Pilih nama lain dalam senarai guru jadual ASC:' : 'Pilih nama anda dalam jadual ASC untuk papar jadual waktu:'}
              </p>
            </div>
            {ascTeachersList.length === 0 ? (
              <p className="text-xs text-amber-600 font-bold">⚠ Tiada data guru ASC. Admin perlu upload jadual XML dahulu.</p>
            ) : (
              <div className="space-y-2">
                <select value={selAscId} onChange={e=>setSelAscId(e.target.value)}
                  className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-purple-400 bg-slate-50">
                  <option value="">-- Pilih nama anda --</option>
                  {ascTeachersList.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
                </select>
                <div className="flex gap-2">
                  {settingAsc && (
                    <button onClick={()=>setSettingAsc(false)} className="flex-1 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-bold hover:bg-slate-200 transition">Batal</button>
                  )}
                  <button onClick={saveAscMapping} disabled={savingAsc||!selAscId}
                    className="flex-1 py-2 bg-purple-600 text-white rounded-xl text-xs font-black hover:bg-purple-700 transition disabled:opacity-40 active:scale-95">
                    {savingAsc ? <span className="flex items-center justify-center gap-1"><Icon name="Loader2" size={11} className="animate-spin"/>Menyimpan...</span> : '✓ Tetapkan Nama'}
                  </button>
                </div>
              </div>
            )}
          </div>
        ) : tab === 'hari' ? (
          <div className="p-3 space-y-2">
            {todayName === 'Ahad' || todayName === 'Sabtu' ? (
              <p className="text-center text-xs text-slate-400 py-4">🎉 Hari cuti — tiada kelas hari ini</p>
            ) : todaySlots.length === 0 ? (
              <p className="text-center text-xs text-slate-400 py-4">Tiada kelas hari ini</p>
            ) : todaySlots.map((s, i) => {
              const SUBJ_COLORS = [
                ['bg-blue-500','border-blue-400'],
                ['bg-purple-500','border-purple-400'],
                ['bg-teal-500','border-teal-400'],
                ['bg-rose-500','border-rose-400'],
                ['bg-amber-500','border-amber-400'],
                ['bg-indigo-500','border-indigo-400'],
                ['bg-green-500','border-green-400'],
                ['bg-orange-500','border-orange-400'],
                ['bg-cyan-500','border-cyan-400'],
                ['bg-pink-500','border-pink-400'],
              ];
              // Warna konsisten berdasarkan nama subjek
              const colorIdx = (s.subjectShort||s.subjectName||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0) % SUBJ_COLORS.length;
              const [bgCol, bdCol] = SUBJ_COLORS[colorIdx];
              return (
                <div key={i} className={`flex items-stretch rounded-xl overflow-hidden border ${bdCol} shadow-sm`}>
                  {/* Jalur warna kiri */}
                  <div className={`${bgCol} w-2 flex-shrink-0`}/>
                  {/* Masa */}
                  <div className="bg-slate-50 px-2 py-2.5 flex flex-col items-center justify-center flex-shrink-0 w-16 border-r border-slate-100">
                    <p className="text-[10px] font-black text-slate-700 leading-tight">{s.startTime}</p>
                    <p className="text-[9px] text-slate-400 leading-tight my-0.5">↕</p>
                    <p className="text-[10px] font-black text-slate-700 leading-tight">{s.endTime}</p>
                  </div>
                  {/* Subjek & kelas */}
                  <div className="flex-1 px-3 py-2.5 bg-white">
                    <p className="text-xs font-black text-slate-800 leading-tight">{s.subjectName}</p>
                    <p className="text-[10px] text-slate-500 mt-0.5">{s.className}</p>
                  </div>
                  {/* Short code */}
                  <div className={`${bgCol} flex items-center justify-center px-2.5 flex-shrink-0`}>
                    <p className="text-[10px] font-black text-white writing-mode-vertical">{s.subjectShort}</p>
                  </div>
                </div>
              );
            })}
          </div>
        ) : (
          /* Tab jadual minggu penuh */
          <div className="overflow-x-auto">
            <table className="w-full text-xs min-w-[520px]">
              <thead>
                <tr className="bg-gradient-to-r from-slate-700 to-slate-800 text-white">
                  <th className="py-2.5 px-3 text-left font-black text-[10px] tracking-wider w-20">WAKTU</th>
                  {DAYS.map(d => (
                    <th key={d} className={`py-2.5 px-2 font-black text-center text-[10px] tracking-wider ${d===todayName?'bg-purple-600':''}`}>
                      {d}{d===todayName && <span className="block text-[8px] font-bold text-purple-200 normal-case tracking-normal">Hari ini</span>}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {(() => {
                  const SUBJ_COLORS_WEEK = {
                    0:['bg-blue-100 text-blue-800','border-blue-200'],
                    1:['bg-purple-100 text-purple-800','border-purple-200'],
                    2:['bg-teal-100 text-teal-800','border-teal-200'],
                    3:['bg-rose-100 text-rose-800','border-rose-200'],
                    4:['bg-amber-100 text-amber-800','border-amber-200'],
                    5:['bg-indigo-100 text-indigo-800','border-indigo-200'],
                    6:['bg-green-100 text-green-800','border-green-200'],
                    7:['bg-orange-100 text-orange-800','border-orange-200'],
                    8:['bg-cyan-100 text-cyan-800','border-cyan-200'],
                    9:['bg-pink-100 text-pink-800','border-pink-200'],
                  };
                  // Map setiap subjek unik kepada warna
                  const subjNames = [...new Set(slots.map(s=>s.subjectShort||s.subjectName).filter(Boolean))];
                  const subjColorMap = {};
                  subjNames.forEach((n,i) => { subjColorMap[n] = SUBJ_COLORS_WEEK[i % 10]; });

                  const periods = [...new Set(slots.map(s=>s.period))].sort((a,b)=>a-b);
                  return periods.map((per, pi) => {
                    const perSlot = slots.find(s=>s.period===per);
                    return (
                      <tr key={per} className={`border-b border-slate-100 ${pi%2===0?'bg-white':'bg-slate-50/40'}`}>
                        {/* Kolum waktu */}
                        <td className="py-2 px-3 border-r border-slate-100 flex-shrink-0">
                          <p className="font-black text-slate-700 text-[11px]">{per}</p>
                          <p className="text-[9px] text-slate-500 font-bold mt-0.5">{perSlot?.startTime}–{perSlot?.endTime}</p>
                        </td>
                        {DAYS.map(day => {
                          const s = slots.find(sl=>sl.period===per && sl.day===day);
                          const key = s?.subjectShort||s?.subjectName||'';
                          const [cellCls, bdCls] = subjColorMap[key] || ['bg-white text-slate-300','border-transparent'];
                          return (
                            <td key={day} className={`py-1.5 px-1.5 text-center ${day===todayName?'bg-purple-50/60':''}`}>
                              {s ? (
                                <div className={`rounded-lg px-1.5 py-1.5 border ${cellCls} ${bdCls}`}>
                                  <p className="font-black text-[10px] leading-tight">{s.subjectShort||s.subjectName}</p>
                                  <p className="text-[9px] opacity-70 leading-tight mt-0.5">{s.className}</p>
                                </div>
                              ) : <span className="text-slate-200 text-[10px]">—</span>}
                            </td>
                          );
                        })}
                      </tr>
                    );
                  });
                })()}
                {slots.length === 0 && (
                  <tr><td colSpan={6} className="py-6 text-center text-slate-400 text-xs">Tiada data jadual</td></tr>
                )}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {/* RPT tahun semasa */}
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div className="flex items-center justify-between px-4 py-3 border-b border-slate-100">
          <p className="text-xs font-black text-slate-700">RPT Saya — {currentYear}</p>
          <div className="flex gap-2">
            {hasLulus && (
              <button onClick={handlePrintQr} disabled={qrLoading}
                className="flex items-center gap-1 px-2.5 py-1.5 bg-green-600 text-white rounded-xl text-[10px] font-black hover:bg-green-700 transition disabled:opacity-60 active:scale-95">
                {qrLoading ? <Icon name="Loader2" size={11} className="animate-spin"/> : <Icon name="QrCode" size={11}/>}
                Cetak QR
              </button>
            )}
            <button onClick={()=>setView('rpt')}
              className="flex items-center gap-1 px-2.5 py-1.5 bg-purple-50 text-purple-700 border border-purple-200 rounded-xl text-[10px] font-black hover:bg-purple-100 transition active:scale-95">
              <Icon name="FolderOpen" size={11}/> Semua RPT
            </button>
          </div>
        </div>

        {rptLoading ? (
          <div className="flex justify-center py-6"><Icon name="Loader2" size={20} className="animate-spin text-purple-400"/></div>
        ) : rptList.length === 0 ? (
          <div className="p-5 text-center">
            <Icon name="FileX" size={28} className="mx-auto mb-2 text-slate-300"/>
            <p className="text-xs text-slate-400">Tiada RPT untuk tahun {currentYear}</p>
            <button onClick={()=>setView('rpt')} className="mt-2 text-xs font-black text-purple-600 hover:underline">Upload RPT →</button>
          </div>
        ) : (
          <div className="divide-y divide-slate-50">
            {rptList.map(r => {
              const cfg = statusCfg[r.semakanStatus||'Menunggu Semakan'] || statusCfg['Menunggu Semakan'];
              return (
                <div key={r.rptId} className="flex items-center gap-3 px-4 py-3 hover:bg-slate-50/50 transition">
                  <div className="flex-1 min-w-0">
                    <p className="text-xs font-black text-slate-800 truncate">{r.filename}</p>
                    <div className="flex flex-wrap gap-1 mt-1">
                      {r.subject && <span className="text-[9px] font-black px-1.5 py-0.5 bg-blue-100 text-blue-700 rounded">{r.subject}</span>}
                      {r.darjah  && <span className="text-[9px] font-black px-1.5 py-0.5 bg-green-100 text-green-700 rounded">{r.darjah}</span>}
                      {r.panitia && <span className="text-[9px] font-black px-1.5 py-0.5 bg-teal-100 text-teal-700 rounded">{r.panitia}</span>}
                    </div>
                  </div>
                  <div className="flex items-center gap-1.5 flex-shrink-0">
                    <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9px] font-black ${cfg.bg} ${cfg.text}`}>
                      <Icon name={cfg.icon} size={8}/>{r.semakanStatus||'Menunggu Semakan'}
                    </span>
                    <a href={r.driveLink} target="_blank" rel="noopener" className="p-1.5 text-slate-400 hover:text-blue-600 transition">
                      <Icon name="ExternalLink" size={12}/>
                    </a>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Modal kemaskini RPT */}
      {replaceRpt && (
        <RptUploadModal user={user} settings={settings} userList={userList} ascTeachers={ascTeachers} isPriv={false}
          showToast={showToast} onClose={()=>setReplaceRpt(null)}
          onDone={()=>{ setReplaceRpt(null); window.location.reload(); }}
          replaceRpt={replaceRpt}/>
      )}
    </div>
  );
};

const Dashboard = ({ user, setView, showToast }) => {
  const roleLabel = { Admin:'Admin', Pentadbir:'Pentadbir', Guru:'Guru', GPK:'GPK' }[user.role] || user.role;
  const showPersonal = user.role === 'Guru' || user.role === 'GPK';
  return (
    <div className="space-y-5">
      <div className="bg-gradient-to-r from-purple-600 to-purple-700 rounded-2xl p-4 md:p-5 text-white shadow-lg">
        <div className="flex items-center gap-3">
          <AvatarDisplay src={user.profilePic} name={user.fullName} size="md" className="border-white/30"/>
          <div className="flex-1 min-w-0">
            <p className="text-purple-200 text-xs font-bold">Selamat datang,</p>
            <p className="text-white font-black text-base truncate">{user.fullName}</p>
            <p className="text-purple-300 text-xs">{roleLabel}</p>
          </div>
        </div>
      </div>
      <AppLauncher user={user}/>
      {showPersonal && <DashboardPersonal user={user} showToast={showToast} setView={setView}/>}

};

const StatCard = ({ title, value, icon, color, compact }) => {
  const cfg = {
    indigo:{wrap:'bg-purple-50 border-purple-100 text-purple-600', num:'text-purple-700'},

const PendingDeleteBanner = ({ user, setUser, showToast }) => {
  const [cancelling, setCancelling] = useState(false);
  const reqDate = user.deleteRequestedAt ? new Date(user.deleteRequestedAt) : null;
  const daysLeft = reqDate ? Math.max(0, 30 - Math.floor((Date.now() - reqDate.getTime()) / (1000*60*60*24))) : 30;

  const handleCancel = async () => {
    setCancelling(true);
    try {
      await apiCall('cancelDeleteRequest', user.uid);
      setUser({ ...user, status: 'Active', deleteRequestedAt: null });
      showToast('Permintaan padam akaun telah dibatalkan!', 'success');
    } catch(err) { showToast(err.toString(), 'error'); }
    finally { setCancelling(false); }
  };

  return (
    <div className="bg-rose-50 border border-rose-200 rounded-2xl p-4 mb-5 flex flex-col sm:flex-row items-start sm:items-center gap-3">
      <div className="w-10 h-10 bg-rose-100 rounded-xl flex items-center justify-center flex-shrink-0 border border-rose-200">
        <Icon name="Trash2" size={18} className="text-rose-600"/>
      </div>
      <div className="flex-1">
        <p className="font-black text-rose-800 text-sm">Permintaan Padam Akaun Aktif</p>
        <p className="text-xs text-rose-600 mt-0.5">
          Akaun anda akan dipadam secara kekal dalam <b>{daysLeft} hari</b> lagi. Batal sekarang jika berubah fikiran.
        </p>
      </div>
      <button onClick={handleCancel} disabled={cancelling}
        className="flex-shrink-0 flex items-center gap-2 px-4 py-2.5 bg-white border border-rose-300 text-rose-700 rounded-xl font-black text-xs hover:bg-rose-100 active:scale-95 transition disabled:opacity-50">
        {cancelling ? <Icon name="Loader2" size={13} className="animate-spin"/> : <Icon name="Undo2" size={13}/>}
        Batal Request
      </button>
    </div>
  );
};

const AutoRphTab = ({ user, showToast }) => {
  const [enabled,    setEnabled]    = useState(false);
  const [masa,       setMasa]       = useState('06:00');
  const [jarak,      setJarak]      = useState(60);
  const [spMode,     setSpMode]     = useState('daily');
  const [spRepeat,   setSpRepeat]   = useState(2);
  const [perSubjek,  setPerSubjek]  = useState({});
  const [lastRun,    setLastRun]    = useState('');
  const [lastLog,    setLastLog]    = useState([]);
  const [slotQueue,  setSlotQueue]  = useState([]);
  const [retryQueue, setRetryQueue] = useState([]);
  const [nextSlot,   setNextSlot]   = useState('');
  const [spProgress, setSpProgress] = useState([]);
  const [loading,    setLoading]    = useState(true);
  const [saving,     setSaving]     = useState(false);
  const [running,    setRunning]    = useState(false);
  const [dirty,      setDirty]      = useState(false);
  const [activeTab,  setActiveTab]  = useState('setting');

  useEffect(() => {
    Promise.all([
      apiCall('getAutoJanaSetting', user.uid),
      apiCall('getSpProgressAll',   user.uid),
    ])
      .then(([s, prog]) => {
        if (s) {
          setEnabled(!!s.enabled);
          if (s.masa)      setMasa(s.masa);
          if (s.jarak)     setJarak(parseInt(s.jarak) || 60);
          if (s.spMode)    setSpMode(s.spMode);
          if (s.spRepeat)  setSpRepeat(parseInt(s.spRepeat) || 2);
          if (s.perSubjek) setPerSubjek(s.perSubjek || {});
          if (s.lastRun)   setLastRun(s.lastRun);
          if (Array.isArray(s.lastLog))    setLastLog(s.lastLog);
          if (Array.isArray(s.slotQueue))  setSlotQueue(s.slotQueue);
          if (Array.isArray(s.retryQueue)) setRetryQueue(s.retryQueue);
          if (s.nextSlotTime) setNextSlot(s.nextSlotTime);
        }
        if (Array.isArray(prog)) setSpProgress(prog);
      })
      .catch(() => {})
      .finally(() => setLoading(false));
  }, []);

  const handleSave = async () => {
    setSaving(true);
    try {
      await apiCall('saveAutoJanaSetting', user.uid, JSON.stringify({
        enabled, masa, jarak, spMode, spRepeat, perSubjek,
      }));
      showToast(enabled
        ? `Auto Jana aktif — mula ${masa}, jarak ${jarak} minit setiap slot.`
        : 'Auto Jana RPH dimatikan.', 'success');
      setDirty(false);
    } catch(e) { showToast(String(e), 'error'); }
    setSaving(false);
  };

  const handleManualRun = async () => {
    setRunning(true);
    try {
      const r = await apiCall('autoJanaRphManual', user.uid);
      if (r?.results) {
        setLastLog(r.results);
        setLastRun(new Date().toISOString().slice(0,10));
        const ok   = r.results.filter(x => x.status === 'ok').length;
        const skip = r.results.filter(x => x.status === 'skip').length;
        const err  = r.results.filter(x => x.status === 'error').length;
        showToast(`Jana selesai — ${ok} berjaya, ${skip} dilangkau, ${err} gagal.`, ok > 0 ? 'success' : 'warning');
        setActiveTab('log');
        apiCall('getSpProgressAll', user.uid).then(prog => { if (Array.isArray(prog)) setSpProgress(prog); }).catch(()=>{});
      }
    } catch(e) { showToast(String(e), 'error'); }
    setRunning(false);
  };

  const setPerSubjekField = (key, field, val) => {
    setPerSubjek(prev => {
      const updated = { ...prev };
      if (!updated[key]) updated[key] = { spMode:'ikut_lalai', spRepeat:2 };
      updated[key] = { ...updated[key], [field]: val };
      return updated;
    });
    setDirty(true);
  };

  const formatDate = iso => {
    if (!iso) return 'Belum pernah';
    try { return new Date(iso).toLocaleString('ms-MY',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
    catch(e) { return iso; }
  };

  const statusIcon  = s => ({ok:'✅',skip:'⏭️',error:'❌'})[s]||'•';
  const statusClr   = s => ({ok:'text-green-700',skip:'text-slate-500',error:'text-red-600'})[s]||'text-slate-500';

  const SP_MODES = [
    { val:'daily',  label:'Setiap sesi',  desc:'SP baru setiap sesi' },
    { val:'repeat', label:'Ulang N sesi', desc:'SP sama untuk N sesi' },
    { val:'weekly', label:'Tapak minggu', desc:'SP sama sepanjang minggu' },
    { val:'manual', label:'Manual',       desc:'Guru pilih SP sendiri' },
  ];

  const JARAK_OPTS = [
    { val:30,  label:'30 minit' },
    { val:60,  label:'1 jam' },
    { val:90,  label:'1.5 jam' },
    { val:120, label:'2 jam' },
  ];

  if (loading) return (
    <div className="flex justify-center py-10">
      <Icon name="Loader2" size={24} className="animate-spin text-purple-400"/>
    </div>
  );

  const queueActive = slotQueue.length > 0;

  return (
    <div className="space-y-4">

      {/* Banner */}
      <div className="bg-purple-50 border border-purple-200 rounded-2xl p-4 flex gap-3">
        <div className="w-9 h-9 bg-purple-100 rounded-xl flex items-center justify-center flex-shrink-0">
          <Icon name="Sparkles" size={18} className="text-purple-600"/>
        </div>
        <div className="flex-1 min-w-0">
          <p className="font-black text-purple-800 text-sm">Auto Jana RPH</p>
          <p className="text-xs text-purple-600 mt-0.5">Jana RPH slot demi slot dengan jarak masa — jimat kredit AI dan elak rate limit.</p>
        </div>
        {queueActive && (
          <div className="flex-shrink-0 text-right">
            <div className="text-xs font-black text-purple-700 bg-purple-200 px-2 py-1 rounded-lg">{slotQueue.length} slot dalam queue</div>
            {nextSlot && <div className="text-[10px] text-purple-500 mt-0.5">Seterusnya: {nextSlot}</div>}
          </div>
        )}
      </div>

      {/* Tab nav */}
      <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
        {[
          { id:'setting',  icon:'Settings',   label:'Setting'    },
          { id:'progress', icon:'TrendingUp', label:'Progress SP' },
          { id:'log',      icon:'History',    label:'Log Jana'   },
        ].map(t => (
          <button key={t.id} onClick={() => setActiveTab(t.id)}
            className={`flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-black transition-all
              ${activeTab===t.id ? 'bg-white text-purple-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
            <Icon name={t.icon} size={12}/>{t.label}
          </button>
        ))}
      </div>

      {/* ═══ TAB SETTING ═══ */}
      {activeTab === 'setting' && (
        <div className="space-y-4">

          {/* Asas */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between">
              <h3 className="font-black text-slate-800 text-sm">Tetapan Asas</h3>
              {dirty && <span className="text-xs text-orange-600 font-bold bg-orange-50 px-2 py-0.5 rounded-full border border-orange-200 animate-pulse flex items-center gap-1">
                <div className="w-1.5 h-1.5 bg-orange-400 rounded-full"/>Belum simpan</span>}

                  <label className="block text-xs font-black text-slate-500 uppercase tracking-wider mb-3">Ulangan per SP</label>
                  <div className="flex items-center gap-4">
                    <button onClick={() => { setSpRepeat(v => Math.max(1,v-1)); setDirty(true); }}
                      className="w-9 h-9 rounded-xl border border-purple-300 bg-white flex items-center justify-center text-purple-700 font-black text-lg hover:bg-purple-100">−</button>
                    <div className="flex-1 text-center">
                      <span className="text-3xl font-black text-purple-700">{spRepeat}</span>
                      <p className="text-xs text-slate-400 mt-1">sesi per SP</p>
                    </div>
                    <button onClick={() => { setSpRepeat(v => Math.min(5,v+1)); setDirty(true); }}
                      className="w-9 h-9 rounded-xl border border-purple-300 bg-white flex items-center justify-center text-purple-700 font-black text-lg hover:bg-purple-100">+</button>
                  </div>
                  <p className="text-xs text-slate-500 mt-3 text-center bg-white rounded-lg p-2 border border-purple-100">
                    SP 1.1 → {Array.from({length:spRepeat},(_,i)=>`sesi ${i+1}`).join(', ')} → SP 1.2 → ...
                  </p>
                </div>
              )}

              {spMode === 'weekly' && (
                <div className="bg-teal-50 border border-teal-200 rounded-xl p-3 text-xs text-teal-700">
                  <p className="font-black mb-1">Cara tapak minggu:</p>
                  <p>Semua sesi dalam seminggu guna SP yang sama. SP maju ke seterusnya pada Isnin minggu berikutnya.</p>
                </div>
              )}

              {spMode === 'manual' && (
                <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-700">
                  <p className="font-black mb-1">Mod manual:</p>
                  <p>Sistem tidak akan auto-pilih SP. Edit setiap RPH dan pilih SP sendiri selepas dijana.</p>
                </div>
              )}
            </div>
          </div>

          {/* Override per subjek */}
          {spProgress.length > 0 && (
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
              <div className="px-5 py-3.5 border-b border-slate-100">
                <h3 className="font-black text-slate-800 text-sm">Override Per Subjek / Kelas</h3>
                <p className="text-xs text-slate-400 mt-0.5">Tetapkan mod berbeza untuk subjek tertentu</p>
              </div>
              <div className="divide-y divide-slate-100">
                {spProgress.map(item => {
                  const key = item.subjectName + '||' + item.className;
                  const override = perSubjek[key] || { spMode:'ikut_lalai', spRepeat:2 };
                  const pct = item.spTotal > 0 ? Math.round((item.spIndex / item.spTotal) * 100) : 0;
                  const barColor = pct >= 80 ? 'bg-red-400' : pct >= 50 ? 'bg-amber-400' : 'bg-green-500';
                  return (
                    <div key={key} className="px-5 py-3">
                      <div className="flex items-center gap-3 mb-2 flex-wrap">
                        <div className="bg-purple-100 text-purple-800 text-xs font-black px-2.5 py-1 rounded-lg min-w-[80px] text-center">
                          {item.subjectName.length > 8 ? item.subjectName.slice(0,8)+'…' : item.subjectName} {item.className}

                        <select value={override.spMode || 'ikut_lalai'}
                          onChange={e => setPerSubjekField(key, 'spMode', e.target.value)}
                          className="flex-1 text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 focus:border-purple-400 outline-none min-w-[120px]">
                          <option value="ikut_lalai">Ikut lalai ({SP_MODES.find(m=>m.val===spMode)?.label})</option>

                        {override.spMode === 'repeat' && (
                          <div className="flex items-center gap-1 flex-shrink-0">
                            <button onClick={() => setPerSubjekField(key,'spRepeat',Math.max(1,(parseInt(override.spRepeat)||2)-1))}

                            <span className="text-xs font-black w-5 text-center">{override.spRepeat||2}</span>

                          </div>

                      <div className="flex items-center gap-2">
                        <div className="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden">

                        <span className="text-[10px] text-slate-400 flex-shrink-0">SP {item.spIndex}/{item.spTotal} ({pct}%)</span>

          <button onClick={handleManualRun} disabled={running}
            className="w-full flex items-center justify-center gap-2 py-3.5 bg-green-600 text-white rounded-xl font-black hover:bg-green-700 active:scale-95 transition shadow-lg shadow-green-200 disabled:opacity-50 text-sm">

};

const ProfileAvatar = ({ user, setUser, showToast, editable=false }) => {
  const [uploading, setUploading] = useState(false);
  const [cropSrc, setCropSrc] = useState(null);  // raw image for crop modal
  const fileRef = useRef(null);

  // Step 1: user picks file → show crop modal
  const handleFileChange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) return showToast('Sila pilih fail imej.','error');
    if (file.size > 10 * 1024 * 1024) return showToast('Gambar terlalu besar. Maks 10MB.','error');
    // Reset input so same file can be re-selected
    e.target.value = '';
    const reader = new FileReader();
    reader.onload = (ev) => setCropSrc(ev.target.result);
    reader.readAsDataURL(file);
  };

  // Step 2: user confirms crop → upload
  const handleCropConfirm = async (croppedBase64) => {
    setCropSrc(null);
    if (croppedBase64.length > 45000) {
      return showToast('Gambar masih terlalu besar. Cuba gambar lebih kecil.','error');
    }
    setUploading(true);
    try {
      const result = await apiCall('updateProfilePic', user.uid, croppedBase64);
      // ── FIX: setUser merujuk kepada setUserWithStorage dari App ──
      // Ini akan update state App + localStorage + semua UI
      setUser(prev => ({ ...prev, profilePic: result.profilePic }));

const SecurityTab = ({ user, showToast }) => {
  const [form, setForm] = useState({ oldPin:'', newPin:'', confirmPin:'' });
  const [show, setShow] = useState({ old:false, new:false, confirm:false });
  const [saving, setSaving] = useState(false);
  const getStr = (pin) => {
    if (!pin) return null;
    if (pin.length<4) return { label:`${pin.length}/4 digit`, color:'text-slate-400', bar:'bg-slate-300', w:`${(pin.length/4)*60}%` };
    if (pin===form.oldPin) return { label:'PIN sama dengan PIN lama!', color:'text-orange-500', bar:'bg-orange-400', w:'50%' };
    if (new Set(pin).size===1) return { label:'PIN terlalu mudah', color:'text-red-500', bar:'bg-red-400', w:'25%' };
    return { label:'PIN selamat ✓', color:'text-purple-600', bar:'bg-purple-400', w:'100%' };
  };
  const str = getStr(form.newPin);
  const match = form.confirmPin && form.newPin===form.confirmPin;
  const noMatch = form.confirmPin && form.newPin!==form.confirmPin;
  const handleChange = async () => {
    if(!form.oldPin||!form.newPin||!form.confirmPin) return showToast('Sila isi semua medan.','error');
    if(form.newPin!==form.confirmPin) return showToast('PIN tidak sepadan.','error');
    if(!/^\d{4}$/.test(form.newPin)) return showToast('PIN mesti tepat 4 digit.','error');
    setSaving(true);
    try { await apiCall('changePin',user.uid,form.oldPin,form.newPin); showToast('PIN berjaya ditukar!','success'); setForm({oldPin:'',newPin:'',confirmPin:''}); }
    catch(err){ showToast(err.toString(),'error'); } finally { setSaving(false); }
  };
  const PinField = ({ field, label, showKey }) => (
    <div><label className="block text-xs font-black text-slate-400 uppercase tracking-wider mb-1.5">{label}</label>
      <div className="relative">
        <input type={show[showKey]?'text':'password'} inputMode="numeric" maxLength={4} value={form[field]} onChange={e=>setForm({...form,[field]:e.target.value.replace(/\D/g,'').slice(0,4)})}
          className="w-full px-4 py-4 rounded-xl border border-slate-200 focus:border-purple-400 focus:ring-2 focus:ring-purple-100 outline-none tracking-[0.6em] font-mono text-2xl text-center bg-purple-50/30 focus:bg-white pr-12" placeholder="••••"/>
        <button type="button" onClick={()=>setShow(s=>({...s,[showKey]:!s[showKey]}))} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"><Icon name={show[showKey]?'EyeOff':'Eye'} size={18}/></button>
      </div>
    </div>
  );
  return (
    <div className="space-y-4">
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div className="px-5 py-4 border-b border-slate-100"><h3 className="font-black text-slate-800 text-sm">Tukar PIN</h3><p className="text-xs text-slate-400 mt-0.5">PIN mesti tepat 4 digit nombor.</p></div>
        <div className="p-5"><div className="max-w-sm mx-auto space-y-4">
          <PinField field="oldPin" label="PIN Semasa" showKey="old"/>
          <div className="border-t border-dashed border-slate-200 pt-4">
            <PinField field="newPin" label="PIN Baru" showKey="new"/>
            {str && <div className="mt-2.5 space-y-1.5"><div className="h-1.5 bg-slate-100 rounded-full overflow-hidden"><div className={`h-full rounded-full transition-all duration-500 ${str.bar}`} style={{width:str.w}}/></div><p className={`text-xs font-bold ${str.color}`}>{str.label}</p></div>}
          </div>
          <PinField field="confirmPin" label="Sahkan PIN Baru" showKey="confirm"/>
          {(match||noMatch) && <div className={`flex items-center gap-2 py-2.5 px-3 rounded-xl text-xs font-bold ${match?'bg-purple-50 text-purple-700 border border-purple-200':'bg-red-50 text-red-600 border border-red-200'}`}><Icon name={match?'CircleCheck':'CircleAlert'} size={14}/>{match?'PIN sepadan ✓':'PIN tidak sepadan'}</div>}
          <button onClick={handleChange} disabled={saving} className="w-full py-4 bg-purple-600 text-white rounded-xl font-black hover:bg-purple-700 active:scale-95 transition shadow-lg disabled:opacity-50 flex items-center justify-center gap-2 text-sm ripple">
            {saving?<><Icon name="Loader2" size={15} className="animate-spin"/>Memproses...</>:<><Icon name="KeyRound" size={15}/>Tukar PIN</>}
          </button>
        </div></div>
      </div>
      <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 flex gap-3">
        <div className="w-9 h-9 bg-amber-100 rounded-xl flex items-center justify-center flex-shrink-0"><Icon name="ShieldAlert" size={18} className="text-amber-600"/></div>
        <div className="text-sm text-amber-800"><p className="font-black mb-1 text-sm">Panduan Keselamatan</p>
          <p className="text-xs text-amber-700 leading-relaxed">Jangan guna PIN mudah (1234, 0000). Tukar PIN secara berkala dan jangan kongsi PIN dengan sesiapa.</p>
        </div>
      </div>

    </div>
  );
};
