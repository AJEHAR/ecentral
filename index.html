// BULK REFLEKSI MODAL
// ==========================================
const REFLEKSI_SHORTCUTS = [
  { label:'PDPC Ditangguhkan — Majlis/Aktiviti Sekolah', val:'PDPC ditangguhkan kerana guru terlibat dengan aktiviti/majlis sekolah.' },
  { label:'Guru Terlibat Program Luar', val:'PDPC ditangguhkan kerana guru terlibat dengan program luar.' },
  { label:'Murid Ujian / Peperiksaan', val:'PDPC ditangguhkan kerana murid menjalani ujian / peperiksaan.' },
  { label:'Cuti Peristiwa / Cuti Ganti', val:'PDPC ditangguhkan kerana cuti peristiwa / cuti ganti.' },
  { label:'Kokurikulum / Sukan', val:'PDPC ditangguhkan kerana aktiviti kokurikulum / sukan.' },
  { label:'Lain-lain (taip sendiri)', val:'' },
];

const BulkRefleksiModal = ({ rphList, userId, folderNama, showToast, onClose, onDone }) => {
  const [mode,       setMode]       = useState('manual'); // 'manual' | 'ai'
  const [shortcut,   setShortcut]   = useState(0);
  const [refleksi,   setRefleksi]   = useState(REFLEKSI_SHORTCUTS[0].val);
  const [selected,   setSelected]   = useState(() => new Set(rphList.map(r=>r.rphId)));
  const [saving,     setSaving]     = useState(false);

  // ── State khusus mod AI ──
  const [aiRunning,  setAiRunning]  = useState(false);
  const [aiProgress, setAiProgress] = useState(0);      // berapa slot dah diproses
  const [aiResults,  setAiResults]  = useState(null);   // senarai hasil {rphId, status, subjectName, className, message}
  const [aiCurrent,  setAiCurrent]  = useState('');     // label slot semasa diproses

  // Kumpulkan RPH ikut hari
  const DAYS = ['Isnin','Selasa','Rabu','Khamis','Jumaat'];
  const byDay = useMemo(() => {
    const m = {};
    DAYS.forEach(d => m[d]=[]);
    rphList.forEach(r => { if (m[r.day]) m[r.day].push(r); });
    return m;
  }, [rphList]);

  const hasExisting = rphList.some(r => selected.has(r.rphId) && r.hasRefleksi);

  const toggleAll = (val) => {
    if (val) setSelected(new Set(rphList.map(r=>r.rphId)));
    else     setSelected(new Set());
  };

  const toggleOne = (rphId) => {
    const s = new Set(selected);
    s.has(rphId) ? s.delete(rphId) : s.add(rphId);
    setSelected(s);
  };

  const handleShortcut = (i) => {
    setShortcut(i);
    if (REFLEKSI_SHORTCUTS[i].val) setRefleksi(REFLEKSI_SHORTCUTS[i].val);
  };

  const switchMode = (m) => {
    if (aiRunning) return; // elak tukar mod semasa proses AI berjalan
    setMode(m);
    setAiResults(null);
    setAiProgress(0);
  };

  // ── Mod Manual — simpan teks sama untuk semua slot dipilih ──
  const handleSaveManual = async () => {
    if (!refleksi.trim()) { showToast('Sila isi teks refleksi.', 'warning'); return; }
    if (selected.size === 0) { showToast('Sila pilih sekurang-kurangnya satu slot.', 'warning'); return; }
    if (hasExisting && !window.confirm(`${[...selected].filter(id=>rphList.find(r=>r.rphId===id)?.hasRefleksi).length} slot sudah ada refleksi. Gantikan semua?`)) return;
    setSaving(true);
    try {
      const result = await apiCall('bulkUpdateRefleksi', JSON.stringify({
        userId, rphIds: [...selected], refleksi: refleksi.trim()
      }));
      showToast(`✅ ${result.updated} refleksi berjaya dikemaskini!`, 'success');
      onDone();
    } catch(e) { showToast(String(e), 'error'); }
    setSaving(false);
  };

  // ── Mod AI — jana refleksi berasingan untuk setiap slot, satu-satu ──
  const handleGenerateAI = async () => {
    if (selected.size === 0) { showToast('Sila pilih sekurang-kurangnya satu slot.', 'warning'); return; }
    if (hasExisting && !window.confirm(`${[...selected].filter(id=>rphList.find(r=>r.rphId===id)?.hasRefleksi).length} slot sudah ada refleksi. AI akan gantikan semua yang dipilih. Teruskan?`)) return;

    const ids = [...selected];
    setAiRunning(true);
    setAiProgress(0);
    setAiResults([]);

    const results = [];
    for (let i = 0; i < ids.length; i++) {
      const rphId = ids[i];
      const rphInfo = rphList.find(r => r.rphId === rphId);
      setAiCurrent(rphInfo ? `${rphInfo.subjectName} — ${rphInfo.className}` : rphId);
      try {
        const r = await apiCall('generateRefleksiAI', rphId, userId);
        results.push(r);
      } catch(e) {
        results.push({ status:'error', rphId, subjectName: rphInfo?.subjectName||'', className: rphInfo?.className||'', message: String(e) });
      }
      setAiProgress(i + 1);
      setAiResults([...results]);
    }

    setAiRunning(false);
    setAiCurrent('');

    const ok    = results.filter(r => r.status === 'ok').length;
    const skip  = results.filter(r => r.status === 'skip').length;
    const gagal = results.filter(r => r.status === 'error').length;
    showToast(`✅ ${ok} berjaya · ⏭️ ${skip} dilangkau · ❌ ${gagal} gagal`, gagal > 0 ? 'warning' : 'success');
    onDone();
  };

  return (
    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-end md:items-center justify-center fade-in" onClick={aiRunning ? undefined : onClose}>
      <div className="bg-white rounded-t-3xl md:rounded-2xl shadow-2xl w-full md:max-w-lg slide-up overflow-hidden flex flex-col" style={{maxHeight:'92dvh'}} onClick={e=>e.stopPropagation()}>

        {/* Header */}
        <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between flex-shrink-0">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 bg-amber-100 rounded-xl flex items-center justify-center">
              <Icon name="ClipboardList" size={16} className="text-amber-600"/>
            </div>
            <div>
              <p className="font-black text-slate-800">Bulk Refleksi</p>
              <p className="text-[11px] text-slate-400">{folderNama}</p>
            </div>
          </div>
          <button onClick={onClose} disabled={aiRunning} className="p-2 bg-slate-100 rounded-xl hover:bg-slate-200 disabled:opacity-30"><Icon name="X" size={15}/></button>
        </div>

        <div className="overflow-y-auto flex-1 p-5 space-y-4">

          {/* Toggle Mod */}
          <div className="flex gap-2 p-1 bg-slate-100 rounded-xl">
            <button onClick={()=>switchMode('manual')} disabled={aiRunning}
              className={`flex-1 py-2 rounded-lg text-xs font-black transition flex items-center justify-center gap-1.5 ${mode==='manual' ? 'bg-white text-slate-800 shadow' : 'text-slate-400'}`}>
              <Icon name="Pencil" size={13}/> Manual
            </button>
            <button onClick={()=>switchMode('ai')} disabled={aiRunning}
              className={`flex-1 py-2 rounded-lg text-xs font-black transition flex items-center justify-center gap-1.5 ${mode==='ai' ? 'bg-violet-600 text-white shadow' : 'text-slate-400'}`}>
              <Icon name="Sparkles" size={13}/> Jana AI
            </button>
          </div>

          {mode === 'manual' && (
            <>
              {/* Shortcut sebab */}
              <div>
                <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Sebab / Shortcut</label>
                <div className="mt-2 flex flex-wrap gap-1.5">
                  {REFLEKSI_SHORTCUTS.map((s,i) => (
                    <button key={i} onClick={()=>handleShortcut(i)}
                      className={`px-2.5 py-1.5 rounded-xl text-[10px] font-black border transition ${shortcut===i ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-slate-600 border-slate-200 hover:border-amber-300 hover:text-amber-700'}`}>
                      {s.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Teks refleksi */}
              <div>
                <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Teks Refleksi</label>
                <textarea value={refleksi} onChange={e=>setRefleksi(e.target.value)} rows={3}
                  placeholder="Taip refleksi di sini..."
                  className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 bg-slate-50 resize-none"/>
              </div>
            </>
          )}

          {mode === 'ai' && (
            <div className="bg-violet-50 border border-violet-200 rounded-xl px-3.5 py-3">
              <p className="text-xs font-bold text-violet-700 flex items-start gap-2">
                <Icon name="Sparkles" size={14} className="flex-shrink-0 mt-0.5"/>
                <span>AI akan jana refleksi <b>berasingan untuk setiap slot</b> berdasarkan objektif &amp; aktiviti sebenar RPH tersebut. Slot yang tiada objektif/aktiviti (cth: cuti) akan dilangkau.</span>
              </p>
            </div>
          )}

          {/* Progress bar mod AI */}
          {mode === 'ai' && aiRunning && (
            <div className="bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-3 space-y-2">
              <div className="flex items-center justify-between text-[11px] font-black text-slate-500">
                <span className="flex items-center gap-1.5"><Icon name="Loader2" size={12} className="animate-spin"/> Menjana {aiProgress}/{selected.size}...</span>
                <span>{Math.round(aiProgress/selected.size*100)}%</span>
              </div>
              <div className="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
                <div className="h-full bg-violet-500 rounded-full transition-all" style={{width:`${aiProgress/selected.size*100}%`}}/>
              </div>
              {aiCurrent && <p className="text-[10px] text-slate-400 truncate">Sedang proses: {aiCurrent}</p>}
            </div>
          )}

          {/* Ringkasan hasil AI (selepas siap) */}
          {mode === 'ai' && aiResults && !aiRunning && (
            <div className="space-y-1.5">
              <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Keputusan</label>
              {aiResults.map((r,i) => (
                <div key={i} className={`flex items-center gap-2 px-3 py-2 rounded-lg text-[11px] font-bold ${
                  r.status==='ok' ? 'bg-green-50 text-green-700' : r.status==='skip' ? 'bg-slate-100 text-slate-500' : 'bg-red-50 text-red-600'
                }`}>
                  <Icon name={r.status==='ok' ? 'Check' : r.status==='skip' ? 'ArrowRight' : 'X'} size={12} className="flex-shrink-0"/>
                  <span className="flex-1 truncate">{r.subjectName || ''} {r.className ? '— '+r.className : ''}</span>
                  {r.message && r.status!=='ok' && <span className="text-[10px] opacity-70 truncate">{r.message}</span>}
                </div>
              ))}
            </div>
          )}

          {/* Senarai slot */}
          <div>
            <div className="flex items-center justify-between mb-2">
              <label className="text-xs font-black text-slate-500 uppercase tracking-wider">
                Pilih Slot ({selected.size}/{rphList.length})
              </label>
              <div className="flex gap-2">
                <button onClick={()=>toggleAll(true)}  disabled={aiRunning} className="text-[10px] font-black text-amber-600 hover:underline disabled:opacity-30">Semua</button>
                <span className="text-slate-300">|</span>
                <button onClick={()=>toggleAll(false)} disabled={aiRunning} className="text-[10px] font-black text-slate-400 hover:underline disabled:opacity-30">Batal</button>
              </div>
            </div>
            <div className="space-y-1">
              {rphList.length === 0 ? (
                <p className="text-center py-4 text-slate-400 text-xs">Tiada RPH dalam folder ini.</p>
              ) : DAYS.filter(d=>byDay[d]?.length>0).map(day => (
                <div key={day}>
                  <p className="text-[10px] font-black text-slate-400 uppercase tracking-wider px-1 mb-1 mt-2">{day}</p>
                  {byDay[day].map(rph => {
                    const checked = selected.has(rph.rphId);
                    const hasRef  = !!rph.hasRefleksi;
                    return (
                      <button key={rph.rphId} onClick={()=>!aiRunning && toggleOne(rph.rphId)} disabled={aiRunning}
                        className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl border transition mb-1 text-left disabled:opacity-60 ${checked ? 'border-amber-400 bg-amber-50' : 'border-slate-200 bg-white hover:border-slate-300'}`}>
                        <div className={`w-4 h-4 rounded flex items-center justify-center flex-shrink-0 border-2 transition ${checked ? 'bg-amber-500 border-amber-500' : 'border-slate-300'}`}>
                          {checked && <Icon name="Check" size={10} className="text-white"/>}
                        </div>
                        <div className="flex-1 min-w-0">
                          <p className="text-xs font-black text-slate-800 truncate">{rph.subjectName} — {rph.className}</p>
                          <p className="text-[10px] text-slate-400">{rph.date} · {rph.startTime}{rph.endTime?'–'+rph.endTime:''}</p>
                        </div>
                        {hasRef && (
                          <span className="text-[9px] font-black px-1.5 py-0.5 bg-green-100 text-green-600 rounded-full flex-shrink-0">Ada refleksi</span>
                        )}
                      </button>
                    );
                  })}
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Footer */}
        <div className="p-5 border-t border-slate-100 flex-shrink-0">
          {hasExisting && !aiRunning && (
            <p className="text-[10px] text-amber-600 font-black mb-2 flex items-center gap-1">
              <Icon name="TriangleAlert" size={11}/> Beberapa slot sudah ada refleksi — akan digantikan.
            </p>
          )}

          {mode === 'manual' ? (
            <button onClick={handleSaveManual} disabled={saving||selected.size===0||!refleksi.trim()}
              className="w-full py-3.5 bg-amber-500 text-white rounded-xl font-black hover:bg-amber-600 active:scale-95 transition disabled:opacity-40 flex items-center justify-center gap-2">
              {saving
                ? <><Icon name="Loader2" size={15} className="animate-spin"/>Menyimpan...</>
                : <><Icon name="ClipboardList" size={15}/>Kemaskini {selected.size} Refleksi</>}
            </button>
          ) : (
            <button onClick={handleGenerateAI} disabled={aiRunning||selected.size===0}
              className="w-full py-3.5 bg-violet-600 text-white rounded-xl font-black hover:bg-violet-700 active:scale-95 transition disabled:opacity-40 flex items-center justify-center gap-2">
              {aiRunning
                ? <><Icon name="Loader2" size={15} className="animate-spin"/>Menjana {aiProgress}/{selected.size}...</>
                : <><Icon name="Sparkles" size={15}/>Jana Refleksi AI ({selected.size} slot)</>}
            </button>
          )}
        </div>
      </div>
    </div>
  );
};

const CutiRphModal = ({ tarikh, hari, cutiSedia, userId, folderId, showToast, onClose, onDone }) => {
  const [jenisCuti, setJenisCuti] = useState(cutiSedia?.jenisCuti || 'sekolah');
  const [nota,      setNota]      = useState(cutiSedia?.nota      || '');
  const [imageFile, setImageFile] = useState(null);
  const [imagePreview, setImagePreview] = useState(cutiSedia?.imageUrl || null);
  const [imageName, setImageName] = useState(cutiSedia?.imageName || '');
  const [uploading, setUploading] = useState(false);
  const [saving,    setSaving]    = useState(false);
  const [deleting,  setDeleting]  = useState(false);
  const fileRef = React.useRef();

  const handleFileChange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) { showToast('Gambar terlalu besar. Maks 4MB.', 'warning'); return; }
    setImageFile(file);
    setImageName(file.name);
    const reader = new FileReader();
    reader.onload = ev => setImagePreview(ev.target.result);
    reader.readAsDataURL(file);
  };

  const handleSave = async () => {
    setSaving(true);
    try {
      let imageUrl = cutiSedia?.imageUrl || '';
      let finalImageName = cutiSedia?.imageName || '';

      // Upload gambar baru jika ada
      if (imageFile) {
        setUploading(true);
        const reader = new FileReader();
        const base64 = await new Promise((res, rej) => {
          reader.onload = e => res(e.target.result.split(',')[1]);
          reader.onerror = rej;
          reader.readAsDataURL(imageFile);
        });
        const result = await apiCall('uploadCutiImage', base64, imageFile.name, imageFile.type);
        imageUrl = result.imageUrl || '';
        finalImageName = imageFile.name;
        setUploading(false);
      }

      await apiCall('saveCutiRph', JSON.stringify({
        userId, folderId, tarikh, hari,
        jenisCuti, nota: nota.trim(),
        imageUrl, imageName: finalImageName
      }));
      showToast('Cuti berjaya disimpan!', 'success');
      onDone();
    } catch(e) { showToast(String(e), 'error'); setUploading(false); }
    setSaving(false);
  };

  const handleDelete = async () => {
    if (!cutiSedia?.rphId) return;
    setDeleting(true);
    try {
      await apiCall('deleteCutiRph', cutiSedia.rphId, userId);
      showToast('Cuti dipadam.', 'success');
      onDone();
    } catch(e) { showToast(String(e), 'error'); }
    setDeleting(false);
  };

  const dateLabel = new Date(tarikh+'T00:00:00').toLocaleDateString('ms-MY',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  return (
    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-end md:items-center justify-center fade-in" onClick={onClose}>
      <div className="bg-white rounded-t-3xl md:rounded-2xl shadow-2xl w-full md:max-w-md slide-up" onClick={e=>e.stopPropagation()}>

        {/* Header */}
        <div className="p-5 border-b border-slate-100 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 bg-slate-100 rounded-xl flex items-center justify-center text-xl">🏖️</div>
            <div>
              <p className="font-black text-slate-800">{cutiSedia ? 'Edit Cuti' : 'Tandakan Cuti'}</p>
              <p className="text-[11px] text-slate-400">{dateLabel}</p>
            </div>
          </div>
          <button onClick={onClose} className="p-2 bg-slate-100 rounded-xl hover:bg-slate-200"><Icon name="X" size={15}/></button>
        </div>

        <div className="p-5 space-y-4 max-h-[75dvh] overflow-y-auto">

          {/* Jenis cuti */}
          <div>
            <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Jenis Cuti</label>
            <div className="grid grid-cols-2 gap-2 mt-2">
              {[
                {val:'sekolah',  label:'🏫 Cuti Sekolah',  sub:'Semua guru'},
                {val:'peribadi', label:'👤 Cuti Peribadi', sub:'Saya sahaja'},
              ].map(({val,label,sub}) => (
                <button key={val} onClick={()=>setJenisCuti(val)}
                  className={`p-3 rounded-xl border-2 text-left transition ${jenisCuti===val ? 'border-purple-500 bg-purple-50' : 'border-slate-200 bg-white hover:border-slate-300'}`}>
                  <p className={`text-xs font-black ${jenisCuti===val?'text-purple-800':'text-slate-700'}`}>{label}</p>
                  <p className={`text-[10px] mt-0.5 ${jenisCuti===val?'text-purple-500':'text-slate-400'}`}>{sub}</p>
                </button>
              ))}
            </div>
          </div>

          {/* Nota */}
          <div>
            <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Nota / Sebab Cuti</label>
            <input value={nota} onChange={e=>setNota(e.target.value)}
              placeholder="cth: Hari Keputeraan Sultan, Cuti Peristiwa, Cuti Ganti..."
              className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 bg-slate-50"/>
          </div>

          {/* Upload gambar RPH cuti */}
          <div>
            <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Gambar RPH Cuti <span className="font-normal text-slate-400">(pilihan)</span></label>
            <p className="text-[10px] text-slate-400 mt-0.5">Foto borang RPH bertulis "CUTI" atau surat pekeliling</p>

            {imagePreview ? (
              <div className="mt-2 relative">
                <img src={imagePreview} alt="preview"
                  className="w-full max-h-40 object-contain rounded-xl border border-slate-200 bg-slate-50"/>
                <button onClick={()=>{ setImageFile(null); setImagePreview(cutiSedia?.imageUrl||null); setImageName(cutiSedia?.imageName||''); fileRef.current.value=''; }}
                  className="absolute top-2 right-2 p-1 bg-white/90 rounded-lg shadow text-slate-500 hover:text-red-500 transition">
                  <Icon name="X" size={14}/>
                </button>
                {imageName && <p className="text-[10px] text-slate-400 mt-1 text-center truncate">{imageName}</p>}
              </div>
            ) : (
              <button onClick={()=>fileRef.current.click()}
                className="mt-2 w-full py-5 border-2 border-dashed border-slate-200 rounded-xl text-slate-400 text-xs font-bold hover:border-purple-300 hover:text-purple-400 transition flex flex-col items-center gap-1.5">
                <Icon name="Image" size={20}/>
                <span>Klik untuk pilih gambar</span>
                <span className="text-[10px] font-normal">JPG, PNG, WEBP · Maks 4MB</span>
              </button>
            )}
            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleFileChange}/>
          </div>

        </div>

        {/* Footer */}
        <div className="p-5 border-t border-slate-100 space-y-2">
          <button onClick={handleSave} disabled={saving||uploading}
            className="w-full py-3.5 bg-purple-600 text-white rounded-xl font-black hover:bg-purple-700 active:scale-95 transition disabled:opacity-40 flex items-center justify-center gap-2">
            {uploading
              ? <><Icon name="Loader2" size={15} className="animate-spin"/>Mengupload gambar...</>
              : saving
              ? <><Icon name="Loader2" size={15} className="animate-spin"/>Menyimpan...</>
              : <><Icon name="CalendarX" size={15}/>{cutiSedia ? 'Simpan Perubahan' : 'Tandakan Cuti'}</>}
          </button>
          {cutiSedia && (
            <button onClick={handleDelete} disabled={deleting}
              className="w-full py-2.5 text-red-500 text-sm font-black hover:bg-red-50 rounded-xl transition disabled:opacity-40 flex items-center justify-center gap-2">
              {deleting ? <><Icon name="Loader2" size={13} className="animate-spin"/>Memadam...</> : <><Icon name="Trash2" size={13}/>Buang Tanda Cuti</>}
            </button>
          )}
        </div>
      </div>
    </div>
  );
};

// ==========================================
// COPY RPH — satu slot ke folder/hari/slot lain
// ==========================================
// ==========================================
// COPY RPH — tampal dari arkib KE slot kosong (destinasi-first)
// ==========================================
const CopyRphModal = ({ destSlot, rphList, folders, userId, showToast, onClose, onDone }) => {
  const [q,          setQ]          = useState('');
  const [selectedRph,setSelectedRph]= useState(null);
  const [fullRph,    setFullRph]    = useState(null);
  const [loadingFull,setLoadingFull]= useState(false);
  const [saving,     setSaving]     = useState(false);

  // Ekstrak tahun dari className (contoh "4 RAUB" → "4", "5 LIPIS" → "5")
  const destTahun = (destSlot.className||'').match(/^(\d+)/)?.[1]||'';

  const folderMap = useMemo(()=>{ const m={}; folders.forEach(f=>{m[f.folderId]=f;}); return m; }, [folders]);

  // Filter WAJIB: sama subjek + sama tahun. Carian optional.
  const filtered = useMemo(() => rphList.filter(r => {
    if (r.subjectName !== destSlot.subjectName) return false;
    const rTahun = (r.className||'').match(/^(\d+)/)?.[1]||'';
    if (destTahun && rTahun !== destTahun) return false;
    if (q) { const qq=q.toLowerCase(); return (r.tajuk||'').toLowerCase().includes(qq)||(r.className||'').toLowerCase().includes(qq)||(r.date||'').includes(qq); }
    return true;
  }).sort((a,b)=>(b.date||'').localeCompare(a.date||'')), [rphList,q,destSlot.subjectName,destTahun]);

  const handleSelect = async (rph) => {
    setSelectedRph(rph); setFullRph(null); setLoadingFull(true);
    try { const full=await apiCall('getRphById',rph.rphId); setFullRph(full); }
    catch(e){ showToast(String(e),'error'); }
    setLoadingFull(false);
  };

  const handleSave = async () => {
    if (!fullRph) return;
    setSaving(true);
    try {
      // Semak sama ada slot destinasi dah ada RPH — kalau ada, update (replace) bukan append baru
      const existDest = rphList.find(r =>
        r.date === destSlot.date &&
        r.subjectName === destSlot.subjectName &&
        r.className === destSlot.className
      );
      await apiCall('saveRphV2', JSON.stringify({
        rphId: existDest?.rphId || '', userId, folderId:destSlot.folderId,
        teacherName:fullRph.teacherName||'', subjectName:destSlot.subjectName,
        subjectShort:destSlot.subjectShort||'', className:destSlot.className,
        date:destSlot.date, day:destSlot.day,
        startTime:destSlot.startTime||'', endTime:destSlot.endTime||'',
        minggu:fullRph.minggu||'', unitTema:fullRph.unitTema||'',
        tajuk:fullRph.tajuk||'', sk:fullRph.sk||'', sp:fullRph.sp||'',
        kemahiran:fullRph.kemahiran||'', objektif:fullRph.objektif||'',
        kriteria:fullRph.kriteria||'', aktiviti:fullRph.aktiviti||'',
        bbm:fullRph.bbm||'', pentaksiran:fullRph.pentaksiran||'', refleksi:fullRph.refleksi||''
      }));
      onDone();
    } catch(e) { showToast(String(e),'error'); }
    setSaving(false);
  };

  const SCOLS = ['bg-blue-500','bg-purple-500','bg-teal-500','bg-rose-500','bg-amber-500','bg-indigo-500','bg-green-500','bg-orange-500'];
  const getCol = n => SCOLS[(n||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0)%SCOLS.length];

  return (
    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-end md:items-center justify-center fade-in" onClick={onClose}>
      <div className="bg-white rounded-t-3xl md:rounded-2xl shadow-2xl w-full md:max-w-2xl flex flex-col" style={{maxHeight:'92dvh'}} onClick={e=>e.stopPropagation()}>
        <div className="p-5 border-b border-slate-100 flex items-center justify-between flex-shrink-0">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 bg-amber-100 rounded-xl flex items-center justify-center"><Icon name="Copy" size={16} className="text-amber-600"/></div>
            <div>
              <p className="font-black text-slate-800">Tampal RPH dari Arkib</p>
              <p className="text-[11px] text-purple-600 font-bold">→ {destSlot.subjectName} · {destSlot.className} · {destSlot.date}</p>
            </div>
          </div>
          <button onClick={onClose} className="p-2 bg-slate-100 rounded-xl hover:bg-slate-200"><Icon name="X" size={15}/></button>
        </div>
        <div className="flex flex-1 min-h-0 overflow-hidden">
          <div className="flex flex-col border-r border-slate-100" style={{width:fullRph?'45%':'100%',flexShrink:0}}>
            <div className="p-3 space-y-2 border-b border-slate-100 flex-shrink-0">
              <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 Cari tajuk, kelas, tarikh..."
                className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-amber-400 bg-slate-50"/>
              <div className="flex items-center justify-between">
                <span className="text-[10px] font-black text-amber-600 bg-amber-50 px-2 py-1 rounded-lg">{destSlot.subjectName} · Tahun {destTahun}</span>
                <span className="text-[10px] text-slate-400">{filtered.length} RPH</span>
              </div>
            </div>
            <div className="flex-1 overflow-y-auto divide-y divide-slate-50">
              {filtered.length===0
                ? <div className="text-center py-8 text-slate-400 text-xs">Tiada RPH</div>
                : filtered.map(rph => {
                  const folder=folderMap[rph.folderId];
                  const active=selectedRph?.rphId===rph.rphId;
                  return (
                    <button key={rph.rphId} onClick={()=>handleSelect(rph)}
                      className={"w-full text-left px-3 py-2.5 hover:bg-amber-50 transition flex items-start gap-2.5 "+(active?'bg-amber-50 border-l-2 border-amber-500':'')}>
                      <div className={"w-1.5 h-9 rounded-full flex-shrink-0 mt-0.5 "+getCol(rph.subjectName)}/>
                      <div className="flex-1 min-w-0">
                        <p className="text-xs font-black text-slate-800 truncate">{rph.tajuk||<span className="italic text-slate-400">Tiada tajuk</span>}</p>
                        <p className="text-[10px] text-slate-500 truncate">{rph.subjectName} · {rph.className}</p>
                        <div className="flex gap-1.5 mt-0.5 flex-wrap">
                          <span className="text-[9px] font-black px-1.5 py-0.5 bg-slate-100 text-slate-500 rounded-full">{rph.date}</span>
                          {folder&&<span className="text-[9px] text-slate-400 truncate">{folder.nama}</span>}
                        </div>
                      </div>
                    </button>
                  );
                })
              }
            </div>
          </div>
          {loadingFull && <div className="flex-1 flex items-center justify-center"><Icon name="Loader2" size={22} className="animate-spin text-amber-400"/></div>}
          {fullRph && (
            <div className="flex-1 flex flex-col min-w-0 min-h-0 overflow-hidden">
              <div className="px-4 py-2 bg-amber-50 border-b border-amber-100 flex-shrink-0">
                <p className="text-xs font-black text-slate-800 truncate">{fullRph.tajuk}</p>
                <p className="text-[10px] text-slate-500">{fullRph.subjectName} · {fullRph.date}</p>
              </div>
              <div className="flex-1 overflow-y-auto p-3 space-y-2 text-xs">
                {[['Tajuk',fullRph.tajuk],['SK',fullRph.sk],['SP',fullRph.sp],['Objektif',fullRph.objektif],['Kriteria',fullRph.kriteria],['Aktiviti',fullRph.aktiviti],['BBM',fullRph.bbm],['Pentaksiran',fullRph.pentaksiran]].map(([l,v])=>v?(
                  <div key={l}><p className="text-[9px] font-black text-slate-400 uppercase tracking-wider">{l}</p>
                  <p className="text-[11px] text-slate-700 whitespace-pre-wrap bg-slate-50 rounded-lg px-2 py-1.5 mt-0.5 leading-relaxed line-clamp-4">{v}</p></div>
                ):null)}
              </div>
              <div className="p-3 border-t border-slate-100 flex-shrink-0">
                <button onClick={handleSave} disabled={saving}
                  className="w-full py-3 bg-amber-500 text-white rounded-xl font-black text-sm hover:bg-amber-600 active:scale-95 transition disabled:opacity-50 flex items-center justify-center gap-2">
                  {saving?<><Icon name="Loader2" size={14} className="animate-spin"/>Menampal...</>:<><Icon name="Copy" size={14}/>Tampal ke Slot Ini</>}
                </button>
                <p className="text-[10px] text-slate-400 text-center mt-1.5">Refleksi turut disalin</p>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

// ==========================================
// COPY MINGGU — tampal RPH dari minggu lain KE folder semasa (destinasi-first)
// ==========================================
const CopyMingguModal = ({ destFolder, folders, userId, rphList, showToast, onClose, onDone }) => {
  const DAYS_MS = ['Isnin','Selasa','Rabu','Khamis','Jumaat'];
  const [srcFolderId,  setSrcFolderId]  = useState('');
  const [saving,       setSaving]       = useState(false);
  const [preview,      setPreview]      = useState(null);
  const [tickedDays,   setTickedDays]   = useState({});   // {Isnin:true, Selasa:false, ...}
  const [expandedDays, setExpandedDays] = useState({});   // {Isnin:true, ...}

  const srcRphList = rphList.filter(r=>r.folderId===srcFolderId);

  const destDateByDay = useMemo(() => {
    if (!destFolder?.startDate) return {};
    const fmtD = s => { if(!s)return null; const ss=String(s); if(/^\d{4}-\d{2}-\d{2}$/.test(ss))return ss.slice(0,10); const d=new Date(ss); return isNaN(d)?ss:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
    const s=fmtD(destFolder.startDate), e=fmtD(destFolder.endDate||destFolder.startDate);
    if(!s) return {};
    const byDay={}, cur=new Date(s+'T00:00:00'), end=new Date(e+'T00:00:00');
    while(cur<=end){ const dow=cur.getDay(); if(dow>=1&&dow<=5){ const day=DAYS_MS[dow-1]; if(!byDay[day])byDay[day]=`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`; } cur.setDate(cur.getDate()+1); }
    return byDay;
  }, [destFolder]);

  useEffect(() => {
    if (!srcFolderId) { setPreview(null); setTickedDays({}); setExpandedDays({}); return; }
    const matchedByDay = {}, unmatched = [];
    srcRphList.forEach(rph => {
      const destDate = destDateByDay[rph.day];
      if (destDate) {
        if (!matchedByDay[rph.day]) matchedByDay[rph.day] = [];
        matchedByDay[rph.day].push({...rph, destDate, destDay:rph.day});
      } else {
        unmatched.push(rph);
      }
    });
    // Default: semua hari yang ada RPH ditick
    const initTick = {};
    Object.keys(matchedByDay).forEach(d => { initTick[d] = true; });
    setTickedDays(initTick);
    setExpandedDays({});
    setPreview({ matchedByDay, unmatched });
  }, [srcFolderId, srcRphList.length, destDateByDay]);

  // Kira jumlah RPH yang akan ditampal (ikut hari yang ditick)
  const selectedRphList = useMemo(() => {
    if (!preview) return [];
    return Object.entries(preview.matchedByDay)
      .filter(([day]) => tickedDays[day])
      .flatMap(([, rphs]) => rphs);
  }, [preview, tickedDays]);

  const toggleDay = day => setTickedDays(p => ({...p, [day]: !p[day]}));
  const toggleExpand = day => setExpandedDays(p => ({...p, [day]: !p[day]}));
  const tickAll   = () => { const t={}; Object.keys(preview.matchedByDay).forEach(d=>t[d]=true);  setTickedDays(t); };
  const untickAll = () => { const t={}; Object.keys(preview.matchedByDay).forEach(d=>t[d]=false); setTickedDays(t); };

  const handleCopy = async () => {
    if (!selectedRphList.length) return;
    setSaving(true); let done=0, fail=0;
    try {
      for (const rph of selectedRphList) {
        try {
          const full = await apiCall('getRphById', rph.rphId);
          // Semak sama ada slot destinasi dah ada RPH — kalau ada, update bukan append
          const existDest = rphList.find(r =>
            r.folderId === destFolder.folderId &&
            r.date === rph.destDate &&
            r.subjectName === full.subjectName &&
            r.className === full.className
          );
          await apiCall('saveRphV2', JSON.stringify({
            rphId: existDest?.rphId || '', userId, folderId:destFolder.folderId,
            teacherName:full.teacherName||'', subjectName:full.subjectName||'',
            subjectShort:full.subjectShort||'', className:full.className||'',
            date:rph.destDate, day:rph.destDay,
            startTime:full.startTime||'', endTime:full.endTime||'',
            minggu:destFolder?.minggu||'', unitTema:full.unitTema||'',
            tajuk:full.tajuk||'', sk:full.sk||'', sp:full.sp||'',
            kemahiran:full.kemahiran||'', objektif:full.objektif||'',
            kriteria:full.kriteria||'', aktiviti:full.aktiviti||'',
            bbm:full.bbm||'', pentaksiran:full.pentaksiran||'', refleksi:full.refleksi||''
          }));
          done++;
        } catch(e){ fail++; }
      }
      showToast(`${done} RPH berjaya ditampal${fail>0?`, ${fail} gagal`:''}!`, done>0?'success':'error');
      onDone();
    } catch(e){ showToast(String(e),'error'); }
    setSaving(false);
  };

  const otherFolders = folders.filter(f=>f.folderId!==destFolder.folderId && rphList.some(r=>r.folderId===f.folderId));
  const DAY_COLOR = { Isnin:'bg-blue-500', Selasa:'bg-purple-500', Rabu:'bg-teal-500', Khamis:'bg-orange-500', Jumaat:'bg-rose-500' };

  return (
    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-end md:items-center justify-center fade-in" onClick={onClose}>
      <div className="bg-white rounded-t-3xl md:rounded-2xl shadow-2xl w-full md:max-w-lg flex flex-col" style={{maxHeight:'92dvh'}} onClick={e=>e.stopPropagation()}>
        <div className="p-5 border-b border-slate-100 flex items-center justify-between flex-shrink-0">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 bg-amber-100 rounded-xl flex items-center justify-center"><Icon name="Copy" size={16} className="text-amber-600"/></div>
            <div>
              <p className="font-black text-slate-800">Tampal RPH dari Minggu Lain</p>
              <p className="text-[11px] text-slate-400">Destinasi: <span className="font-black text-purple-600">{destFolder.nama}</span></p>
            </div>
          </div>
          <button onClick={onClose} className="p-2 bg-slate-100 rounded-xl hover:bg-slate-200"><Icon name="X" size={15}/></button>
        </div>

        <div className="flex-1 overflow-y-auto p-4 space-y-4">
          {/* Info destinasi */}
          <div className="bg-purple-50 border border-purple-200 rounded-xl p-3 text-xs">
            <p className="font-black text-purple-800">📥 Tampal ke: {destFolder.nama}</p>
            <p className="text-purple-500 text-[10px] mt-0.5">Padanan ikut hari (Isnin→Isnin). Refleksi turut disalin.</p>
          </div>

          {/* Pilih minggu sumber */}
          <div>
            <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Salin dari Minggu Mana?</label>
            {otherFolders.length===0
              ? <p className="mt-2 text-xs text-slate-400">Tiada tapak minggu lain yang ada RPH.</p>
              : <select value={srcFolderId} onChange={e=>setSrcFolderId(e.target.value)}
                  className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 bg-slate-50">
                  <option value="">-- Pilih minggu sumber --</option>
                  {otherFolders.map(f=>{
                    const cnt = rphList.filter(r=>r.folderId===f.folderId).length;
                    return <option key={f.folderId} value={f.folderId}>{f.nama} ({cnt} RPH)</option>;
                  })}
                </select>
            }
          </div>

          {/* Pilihan hari */}
          {preview && Object.keys(preview.matchedByDay).length > 0 && (
            <div className="space-y-2">
              {/* Header pilih semua / nyah pilih */}
              <div className="flex items-center justify-between">
                <p className="text-xs font-black text-slate-600">Pilih hari untuk disalin:</p>
                <div className="flex gap-2">
                  <button onClick={tickAll}   className="text-[10px] font-black text-amber-600 hover:text-amber-700 px-2 py-1 bg-amber-50 rounded-lg transition">Pilih Semua</button>
                  <button onClick={untickAll} className="text-[10px] font-black text-slate-500 hover:text-slate-700 px-2 py-1 bg-slate-100 rounded-lg transition">Nyah Pilih</button>
                </div>
              </div>

              {/* Senarai hari */}
              {DAYS_MS.filter(d => preview.matchedByDay[d]).map(day => {
                const rphs    = preview.matchedByDay[day];
                const ticked  = !!tickedDays[day];
                const expanded= !!expandedDays[day];
                const dotCol  = DAY_COLOR[day] || 'bg-slate-400';
                return (
                  <div key={day} className={`rounded-xl border transition ${ticked ? 'border-amber-300 bg-amber-50' : 'border-slate-200 bg-slate-50 opacity-60'}`}>
                    {/* Row hari */}
                    <div className="flex items-center gap-3 px-3 py-2.5">
                      {/* Checkbox */}
                      <button onClick={()=>toggleDay(day)}
                        className={`w-5 h-5 rounded-md border-2 flex items-center justify-center flex-shrink-0 transition ${ticked ? 'bg-amber-500 border-amber-500' : 'bg-white border-slate-300'}`}>
                        {ticked && <Icon name="Check" size={11} className="text-white"/>}
                      </button>
                      {/* Dot warna hari */}
                      <div className={`w-2 h-7 rounded-full flex-shrink-0 ${dotCol}`}/>
                      {/* Info hari */}
                      <div className="flex-1 min-w-0">
                        <p className="text-xs font-black text-slate-800">{day}</p>
                        <p className="text-[10px] text-slate-500">
                          {rphs[0]?.date} → <span className="font-black text-amber-600">{rphs[0]?.destDate}</span>
                          <span className="ml-1.5 text-slate-400">· {rphs.length} RPH</span>
                        </p>
                      </div>
                      {/* Toggle expand */}
                      <button onClick={()=>toggleExpand(day)}
                        className="p-1.5 rounded-lg hover:bg-amber-100 transition text-slate-400">
                        <Icon name={expanded ? 'ChevronUp' : 'ChevronDown'} size={13}/>
                      </button>
                    </div>
                    {/* Detail RPH dalam hari (expand) */}
                    {expanded && (
                      <div className="border-t border-amber-200 divide-y divide-amber-100">
                        {rphs.map(r => (
                          <div key={r.rphId} className="px-4 py-2 flex items-center gap-2">
                            <div className="flex-1 min-w-0">
                              <p className="text-[11px] font-black text-slate-700 truncate">{r.tajuk||'(Tiada tajuk)'}</p>
                              <p className="text-[10px] text-slate-400">{r.subjectName} · {r.className}</p>
                            </div>
                            <p className="text-[9px] text-slate-400 flex-shrink-0">{r.startTime}{r.endTime?'–'+r.endTime:''}</p>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}

              {/* Tidak dapat dipadankan */}
              {preview.unmatched.length > 0 && (
                <div className="bg-orange-50 border border-orange-200 rounded-xl p-3">
                  <p className="text-[10px] font-black text-orange-700">⚠️ {preview.unmatched.length} RPH tidak dapat dipadankan (hari tiada dalam destinasi)</p>
                </div>
              )}
            </div>
          )}
          {preview && Object.keys(preview.matchedByDay).length===0 && (
            <p className="text-center py-4 text-slate-400 text-sm">Tiada hari yang sepadan antara dua minggu ini.</p>
          )}
        </div>

        {/* Footer butang */}
        {preview && selectedRphList.length > 0 && (
          <div className="p-4 border-t border-slate-100 flex-shrink-0 space-y-1.5">
            <button onClick={handleCopy} disabled={saving}
              className="w-full py-3.5 bg-amber-500 text-white rounded-xl font-black hover:bg-amber-600 active:scale-95 transition disabled:opacity-40 flex items-center justify-center gap-2">
              {saving
                ? <><Icon name="Loader2" size={15} className="animate-spin"/>Menampal {selectedRphList.length} RPH...</>
                : <><Icon name="Copy" size={15}/>Tampal {selectedRphList.length} RPH ke {destFolder.nama}</>}
            </button>
            <p className="text-[10px] text-center text-slate-400">
              {Object.values(tickedDays).filter(Boolean).length} hari dipilih · {selectedRphList.length} RPH
            </p>
          </div>
        )}
      </div>
    </div>
  );
};

const ArkibRphModal = ({ userId, folders, rphList, showToast, onClose, onCopy }) => {
  const [q,         setQ]         = useState('');
  const [filterSubj,setFilterSubj]= useState('');
  const [filterMgu, setFilterMgu] = useState('');
  const [filterRef, setFilterRef] = useState(''); // '' | 'ada' | 'belum'
  const [sortBy,    setSortBy]    = useState('date_desc'); // date_desc | date_asc | subj | kelas
  const [previewRph,setPreviewRph]= useState(null); // RPH yang sedang preview
  const [loadingFull, setLoadingFull] = useState(false);
  const [fullRph,   setFullRph]   = useState(null);
  const [copying,   setCopying]   = useState(false);

  // Gabungkan rphList dengan maklumat folder
  const folderMap = useMemo(() => {
    const m = {};
    folders.forEach(f => { m[f.folderId] = f; });
    return m;
  }, [folders]);

  // Senarai subjek unik untuk filter
  const subjekList = useMemo(() =>
    [...new Set(rphList.map(r => r.subjectName).filter(Boolean))].sort(),
  [rphList]);

  // Senarai minggu unik untuk filter
  const mingguList = useMemo(() =>
    [...new Set(rphList.map(r => r.minggu).filter(Boolean))].sort((a,b) => Number(a)-Number(b)),
  [rphList]);

  // Filter subjek + minggu + carian SAHAJA (tanpa filter refleksi) — asas untuk statistik
  const baseFiltered = useMemo(() => {
    return rphList.filter(r => {
      if (filterSubj && r.subjectName !== filterSubj) return false;
      if (filterMgu  && r.minggu !== filterMgu)        return false;
      if (q) {
        const qq = q.toLowerCase();
        return (r.tajuk||'').toLowerCase().includes(qq) ||
               (r.subjectName||'').toLowerCase().includes(qq) ||
               (r.className||'').toLowerCase().includes(qq) ||
               (r.date||'').includes(qq) ||
               (r.minggu||'').includes(qq);
      }
      return true;
    });
  }, [rphList, q, filterSubj, filterMgu]);

  // Statistik refleksi (ikut filter subjek/minggu/carian semasa, tapi tidak ikut filter refleksi itu sendiri)
  const refleksiStats = useMemo(() => {
    const ada = baseFiltered.filter(r => r.hasRefleksi).length;
    return { total: baseFiltered.length, ada, belum: baseFiltered.length - ada };
  }, [baseFiltered]);

  // Filter refleksi + sort (untuk paparan akhir)
  const filtered = useMemo(() => {
    let list = baseFiltered.filter(r => {
      const hasRef = !!r.hasRefleksi;
      if (filterRef === 'ada'   && !hasRef) return false;
      if (filterRef === 'belum' &&  hasRef) return false;
      return true;
    });
    list = [...list].sort((a,b) => {
      if (sortBy==='date_asc')  return (a.date||'').localeCompare(b.date||'');
      if (sortBy==='date_desc') return (b.date||'').localeCompare(a.date||'');
      if (sortBy==='subj')      return (a.subjectName||'').localeCompare(b.subjectName||'');
      if (sortBy==='kelas')     return (a.className||'').localeCompare(b.className||'');
      return 0;
    });
    return list;
  }, [baseFiltered, filterRef, sortBy]);

  // Load full RPH untuk preview
  const handlePreview = async (rph) => {
    setPreviewRph(rph);
    setFullRph(null);
    setLoadingFull(true);
    try {
      const full = await apiCall('getRphById', rph.rphId);
      setFullRph(full);
    } catch(e) { showToast(String(e),'error'); }
    setLoadingFull(false);
  };

  const handleCopy = async () => {
    if (!fullRph) return;
    setCopying(true);
    await new Promise(r=>setTimeout(r,300));
    onCopy(fullRph);
    setCopying(false);
  };

  const SUBJ_COLORS = ['bg-blue-500','bg-purple-500','bg-teal-500','bg-rose-500','bg-amber-500','bg-indigo-500','bg-green-500','bg-orange-500'];
  const getSubjColor = name => SUBJ_COLORS[(name||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0)%SUBJ_COLORS.length];

  return (
    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-end md:items-center justify-center fade-in" onClick={onClose}>

        style={{maxHeight:'92dvh'}} onClick={e=>e.stopPropagation()}>

        {/* Header */}
        <div className="flex items-center justify-between p-5 border-b border-slate-100 flex-shrink-0">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 bg-amber-100 rounded-xl flex items-center justify-center">
              <Icon name="Archive" size={18} className="text-amber-600"/>
            </div>
            <div>
              <p className="font-black text-slate-800">Arkib RPH</p>
              <p className="text-xs text-slate-400">{rphList.length} RPH tersimpan · klik untuk preview & salin</p>
            </div>
          </div>
          <button onClick={onClose} className="p-2 bg-slate-100 rounded-xl hover:bg-slate-200 transition">
            <Icon name="X" size={16}/>
          </button>
        </div>

        <div className="flex flex-1 min-h-0 overflow-hidden">
          {/* ── Kiri: Senarai ── */}
          <div className="flex flex-col border-r border-slate-100" style={{width: previewRph ? '45%' : '100%', flexShrink:0}}>

            {/* Cari + Filter */}
            <div className="p-3 space-y-2 border-b border-slate-100 flex-shrink-0">
              <input value={q} onChange={e=>setQ(e.target.value)}
                placeholder="🔍 Cari tajuk, subjek, kelas, tarikh..."
                className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-amber-400 bg-slate-50"/>
              <div className="flex gap-2 flex-wrap">
                <select value={filterSubj} onChange={e=>setFilterSubj(e.target.value)}
                  className="flex-1 min-w-[120px] border border-slate-200 rounded-xl px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-amber-400 bg-slate-50">
                  <option value="">Semua Subjek</option>
                  {subjekList.map(s=><option key={s} value={s}>{s}</option>)}
                </select>
                <select value={filterMgu} onChange={e=>setFilterMgu(e.target.value)}
                  className="flex-1 min-w-[120px] border border-slate-200 rounded-xl px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-amber-400 bg-slate-50">
                  <option value="">Semua Minggu</option>
                  {mingguList.map(m=><option key={m} value={m}>Minggu {m}</option>)}
                </select>
                <select value={sortBy} onChange={e=>setSortBy(e.target.value)}
                  className="flex-1 min-w-[100px] border border-slate-200 rounded-xl px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-amber-400 bg-slate-50">
                  <option value="date_desc">Terbaru</option>
                  <option value="date_asc">Terlama</option>
                  <option value="subj">Subjek</option>
                  <option value="kelas">Kelas</option>
                </select>
              </div>

              {/* Filter status refleksi */}
              <div className="flex gap-1.5">
                <button onClick={()=>setFilterRef('')}
                  className={`flex-1 py-1.5 rounded-lg text-[10px] font-black border transition ${filterRef===''      ? 'bg-slate-700 text-white border-slate-700' : 'bg-white text-slate-500 border-slate-200 hover:border-slate-300'}`}>
                  Semua ({refleksiStats.total})
                </button>
                <button onClick={()=>setFilterRef('ada')}
                  className={`flex-1 py-1.5 rounded-lg text-[10px] font-black border transition ${filterRef==='ada'   ? 'bg-green-600 text-white border-green-600' : 'bg-white text-green-600 border-green-200 hover:border-green-400'}`}>
                  ✅ Ada Refleksi ({refleksiStats.ada})
                </button>
                <button onClick={()=>setFilterRef('belum')}
                  className={`flex-1 py-1.5 rounded-lg text-[10px] font-black border transition ${filterRef==='belum' ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-amber-600 border-amber-200 hover:border-amber-400'}`}>
                  ⭕ Belum ({refleksiStats.belum})
                </button>
              </div>

              <p className="text-[10px] text-slate-400">{filtered.length} RPH dijumpai</p>
            </div>

            {/* Senarai RPH */}
            <div className="flex-1 overflow-y-auto divide-y divide-slate-50">
              {filtered.length === 0 ? (
                <div className="text-center py-10 text-slate-400">
                  <Icon name="Archive" size={28} className="mx-auto mb-2 opacity-30"/>
                  <p className="text-sm">Tiada RPH ditemui</p>
                </div>
              ) : filtered.map(rph => {
                const folder = folderMap[rph.folderId];
                const isActive = previewRph?.rphId === rph.rphId;
                const dot = getSubjColor(rph.subjectName);
                const hasRef = !!rph.hasRefleksi;
                return (
                  <button key={rph.rphId} onClick={()=>handlePreview(rph)}
                    className={"w-full text-left px-4 py-3 hover:bg-amber-50 transition flex items-start gap-3 " + (isActive?'bg-amber-50 border-l-2 border-amber-500':'')}>
                    <div className={"w-1.5 h-10 rounded-full flex-shrink-0 mt-0.5 " + dot}/>
                    <div className="flex-1 min-w-0">
                      <p className="text-xs font-black text-slate-800 truncate">{rph.tajuk || <span className="italic text-slate-400">Tiada tajuk</span>}</p>
                      <p className="text-[10px] text-slate-500 mt-0.5 truncate">{rph.subjectName} · {rph.className}</p>
                      <div className="flex items-center gap-1.5 mt-1 flex-wrap">
                        <span className="text-[9px] font-black px-1.5 py-0.5 bg-slate-100 text-slate-500 rounded-full">{rph.date}</span>
                        {rph.minggu && <span className="text-[9px] font-black px-1.5 py-0.5 bg-purple-100 text-purple-600 rounded-full">Mgu {rph.minggu}</span>}
                        {hasRef
                          ? <span className="text-[9px] font-black px-1.5 py-0.5 bg-green-100 text-green-600 rounded-full">✅ Ada Refleksi</span>
                          : <span className="text-[9px] font-black px-1.5 py-0.5 bg-slate-100 text-slate-400 rounded-full">⭕ Belum</span>}
                        {folder && <span className="text-[9px] text-slate-400 truncate">{folder.nama}</span>}
                      </div>
                    </div>
                    <Icon name="ChevronRight" size={12} className="text-slate-300 flex-shrink-0 mt-1"/>
                  </button>
                );
              })}
            </div>
          </div>

          {/* ── Kanan: Preview ── */}
          {previewRph && (
            <div className="flex-1 flex flex-col min-w-0 min-h-0 overflow-hidden">
              {/* Preview header */}
              <div className="px-4 py-3 border-b border-slate-100 bg-amber-50 flex-shrink-0">
                <p className="text-xs font-black text-slate-800 truncate">{previewRph.subjectName} · {previewRph.className}</p>
                <p className="text-[10px] text-slate-500">{previewRph.date} · Minggu {previewRph.minggu||'-'}</p>
              </div>

              {loadingFull ? (
                <div className="flex-1 flex items-center justify-center">
                  <Icon name="Loader2" size={24} className="animate-spin text-amber-400"/>
                </div>
              ) : fullRph ? (
                <div className="flex-1 overflow-y-auto p-4 space-y-3 text-xs">
                  {!((fullRph.refleksi||'').trim()) && (
                    <div className="bg-amber-50 border border-amber-200 rounded-lg px-2.5 py-2 flex items-center gap-2">
                      <Icon name="TriangleAlert" size={12} className="text-amber-600 flex-shrink-0"/>
                      <p className="text-[10px] font-bold text-amber-700">RPH ini belum ada refleksi.</p>
                    </div>
                  )}
                  {[
                    {label:'Tajuk', val: fullRph.tajuk},
                    {label:'Unit / Tema', val: fullRph.unitTema},
                    {label:'Standard Kandungan', val: fullRph.sk},
                    {label:'Standard Pembelajaran', val: fullRph.sp},
                    {label:'Kemahiran', val: fullRph.kemahiran},
                    {label:'Objektif Pembelajaran', val: fullRph.objektif},
                    {label:'Kriteria Kejayaan', val: fullRph.kriteria},
                    {label:'Aktiviti P&P', val: fullRph.aktiviti},
                    {label:'BBB / BBM', val: fullRph.bbm},
                    {label:'Pentaksiran', val: fullRph.pentaksiran},
                    {label:'Refleksi Guru', val: fullRph.refleksi},
                  ].map(({label,val}) => val ? (
                    <div key={label}>
                      <p className="text-[9px] font-black text-slate-400 uppercase tracking-wider mb-0.5">{label}</p>
                      <p className="text-xs text-slate-700 whitespace-pre-wrap leading-relaxed bg-slate-50 rounded-lg px-2.5 py-2">{val}</p>
                    </div>
                  ) : null)}
                </div>
              ) : null}

              {/* Butang salin */}
              {fullRph && (
                <div className="p-3 border-t border-slate-100 flex-shrink-0">
                  <button onClick={handleCopy} disabled={copying}
                    className="w-full py-3 bg-amber-500 text-white rounded-xl font-black text-sm hover:bg-amber-600 active:scale-95 transition disabled:opacity-50 flex items-center justify-center gap-2">
                    {copying
                      ? <><Icon name="Loader2" size={14} className="animate-spin"/>Menyalin...</>
                      : <><Icon name="Copy" size={14}/>Salin Kandungan ke Borang</>}
                  </button>
                  <p className="text-[10px] text-slate-400 text-center mt-1.5">
                    Kandungan akan disalin ke borang RPH semasa anda
                  </p>
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

// ── Folder List Component ──
const RphFolderList = ({ folders, loading, userId, ascMapping, rphList, onSelect, onRefresh, onCopyMingu, onExport, exporting, showToast }) => {
  const currentYear = new Date().getFullYear();
  const DAYS_MS = ['Isnin','Selasa','Rabu','Khamis','Jumaat'];
  const [showNew,   setShowNew]   = useState(false);
  const [editFolder,setEditFolder]= useState(null); // folder yang sedang diedit
  const [form,      setForm]      = useState({ guruNama: ascMapping?.ascTeacherName||'', minggu: '', tahun: String(currentYear) });
  const [dateRange, setDateRange] = useState({ start: null, end: null });
  const [calMonth,  setCalMonth]  = useState(new Date().getMonth());
  const [calYear,   setCalYear]   = useState(new Date().getFullYear());
  const [saving,    setSaving]    = useState(false);
  const [deleting,  setDeleting]  = useState('');
  const [search,    setSearch]    = useState(''); // search/filter

  useEffect(() => {
    if (ascMapping?.ascTeacherName) setForm(p=>({...p, guruNama: ascMapping.ascTeacherName}));
  }, [ascMapping?.ascTeacherName]);

  const isComplete = form.guruNama.trim() && form.minggu.trim() && form.tahun.trim() && dateRange.start;

  // Filter senarai folder
  const filteredFolders = folders.filter(f => {
    if (!search) return true;
    const q = search.toLowerCase();
    return (f.nama||'').toLowerCase().includes(q) ||
           (f.minggu||'').includes(q) ||
           (f.tahun||'').includes(q) ||
           (f.startDate||'').includes(q) ||
           (f.guruNama||'').toLowerCase().includes(q);
  }).sort((a,b) => {
    const yd = Number(b.tahun||0) - Number(a.tahun||0);
    return yd !== 0 ? yd : Number(b.minggu||0) - Number(a.minggu||0);
  });

  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const firstDow    = new Date(calYear, calMonth, 1).getDay();
  const offset      = firstDow === 0 ? 6 : firstDow - 1;
  const toStr = d => `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const strToDate = s => { if(!s) return null; const [y,m,d]=s.split('-'); return new Date(Number(y),Number(m)-1,Number(d)); };

  const activeDatesCount = (() => {
    if (!dateRange.start) return 0;
    const end = dateRange.end || dateRange.start;
    const s = strToDate(dateRange.start), e = strToDate(end);
    let count = 0, cur = new Date(s);
    while (cur <= e) { const dow = cur.getDay(); if (dow>=1&&dow<=5) count++; cur.setDate(cur.getDate()+1); }
    return count;
  })();

  const handleDayClick = (day) => {
    const dateStr = toStr(day);
    const dow = new Date(calYear,calMonth,day).getDay();
    if (dow===0||dow===6) return;
    if (!dateRange.start || (dateRange.start && dateRange.end)) {
      setDateRange({ start: dateStr, end: null });
    } else {
      if (dateStr < dateRange.start) {
        setDateRange({ start: dateStr, end: dateRange.start });
      } else if (dateStr === dateRange.start) {
        setDateRange({ start: dateStr, end: dateStr });
      } else {
        const startDate = strToDate(dateRange.start);
        const clickDate = new Date(calYear,calMonth,day);
        const startMon = new Date(startDate); startMon.setDate(startDate.getDate()-(startDate.getDay()===0?6:startDate.getDay()-1));
        const clickMon = new Date(clickDate); clickMon.setDate(clickDate.getDate()-(clickDate.getDay()===0?6:clickDate.getDay()-1));
        if (startMon.toDateString()===clickMon.toDateString()) {
          setDateRange({ start: dateRange.start, end: dateStr });
        } else {
          setDateRange({ start: dateStr, end: null });
        }
      }
    }
  };

  const inRange  = day => { const s=toStr(day); if(!dateRange.start) return false; if(!dateRange.end) return s===dateRange.start; return s>=dateRange.start&&s<=dateRange.end; };
  const isStart  = day => toStr(day)===dateRange.start;
  const isEnd    = day => toStr(day)===(dateRange.end||dateRange.start);
  const isWeekend= day => { const d=new Date(calYear,calMonth,day).getDay(); return d===0||d===6; };
  const isToday  = day => { const t=new Date(); return t.getFullYear()===calYear&&t.getMonth()===calMonth&&t.getDate()===day; };
  const WEEK_HEADERS = ['Is','Se','Ra','Kh','Ju','Sa','Ah'];

  const openEdit = (folder, e) => {

          nama, guruNama: form.guruNama.trim(),

        }));
        showToast('Folder berjaya dikemaskini!','success');
      } else {
        // CREATE
        await apiCall('saveRphFolder', JSON.stringify({

          minggu: form.minggu.trim(), tahun: form.tahun.trim(),
          startDate: dateRange.start, endDate: dateRange.end || dateRange.start
        }));
        showToast('Folder berjaya dicipta!','success');
      }
      setForm(p=>({...p, minggu:''}));
      setDateRange({ start: null, end: null });
      setShowNew(false); setEditFolder(null); onRefresh();
    } catch(e) { showToast(String(e),'error'); }

        <div className="flex items-center justify-between gap-2">
          <p className="text-xs font-black text-slate-500 uppercase tracking-wider flex-shrink-0">Folder Minggu RPH</p>
          <button onClick={()=>{ setShowNew(v=>!v); setEditFolder(null); if(showNew){setForm(p=>({...p,minggu:''}));setDateRange({start:null,end:null});} }}
            className="flex items-center gap-1.5 px-3 py-2 bg-purple-600 text-white rounded-xl text-xs font-black hover:bg-purple-700 transition active:scale-90 flex-shrink-0">
            <Icon name={showNew&&!editFolder?'X':'Plus'} size={12}/> {showNew&&!editFolder?'Batal':'+ Folder Baru'}
          </button>
        </div>
        {folders.length > 0 && (
          <input value={search} onChange={e=>setSearch(e.target.value)}
            placeholder="🔍 Cari minggu, tahun, tarikh..."
            className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-purple-400 bg-slate-50"/>
        )}
      </div>

      {showNew && (
        <div className="bg-white border border-purple-200 rounded-2xl p-4 space-y-4 shadow-sm">
          <div className="flex items-center justify-between">
            <p className="text-xs font-black text-slate-500 uppercase tracking-wider">
              {editFolder ? '✏️ Edit Folder' : '📁 Folder Baru'}
            </p>
            {editFolder && (
              <button onClick={()=>{ setEditFolder(null); setShowNew(false); setForm(p=>({...p,minggu:''})); setDateRange({start:null,end:null}); }}
                className="text-[10px] font-black text-red-400 hover:text-red-600">✕ Batal Edit</button>
            )}
          </div>

          {/* Nama Guru */}
          <div>
            <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Nama Guru (ASC)</label>
            <input value={form.guruNama} onChange={e=>setForm(p=>({...p,guruNama:e.target.value}))}
              placeholder="Nama seperti dalam jadual ASC"
              className={_IC}/>
            {ascMapping?.ascTeacherName && form.guruNama !== ascMapping.ascTeacherName && (
              <button onClick={()=>setForm(p=>({...p,guruNama:ascMapping.ascTeacherName}))} className="mt-1 text-[10px] font-black text-purple-600 hover:underline">
                ↺ Guna nama ASC: {ascMapping.ascTeacherName}
              </button>

          </div>

          {/* Minggu + Tahun */}
          <div className="grid grid-cols-2 gap-3">

const RphDatePicker = ({ dateRange, setDateRange, activeDates, onConfirm, loading }) => {
  const today = new Date();
  const [calMonth, setCalMonth] = useState(today.getMonth());
  const [calYear,  setCalYear]  = useState(today.getFullYear());

  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const firstDow    = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
  const offset      = firstDow === 0 ? 6 : firstDow - 1; // Mon=0

  const toStr = d => `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const strToD = s => { if(!s) return null; const [y,m,d]=s.split('-'); return new Date(Number(y),Number(m)-1,Number(d)); };

  const handleDayClick = (day) => {
    const dateStr = toStr(day);
    const dow = new Date(calYear,calMonth,day).getDay();
    if (dow===0||dow===6) return; // Hujung minggu skip
    if (!dateRange.start || (dateRange.start && dateRange.end)) {
      setDateRange({ start: dateStr, end: null });
    } else {
      if (dateStr < dateRange.start) {
        setDateRange({ start: dateStr, end: dateRange.start });
      } else if (dateStr === dateRange.start) {
        setDateRange({ start: dateStr, end: dateStr });
      } else {
        // Limit to same week (Mon-Fri)
        const startDate = strToD(dateRange.start);
        const clickDate = new Date(calYear,calMonth,day);
        // Check same week
        const startMon = new Date(startDate); startMon.setDate(startDate.getDate()-(startDate.getDay()===0?6:startDate.getDay()-1));
        const clickMon = new Date(clickDate); clickMon.setDate(clickDate.getDate()-(clickDate.getDay()===0?6:clickDate.getDay()-1));
        if (startMon.toDateString()===clickMon.toDateString()) {
          setDateRange({ start: dateRange.start, end: dateStr });
        } else {
          // Beza minggu — start semula dari hari yang diklik
          setDateRange({ start: dateStr, end: null });
        }
      }
    }
  };

  const inRange = (day) => {
    const s = toStr(day);
    if (!dateRange.start) return false;
    if (!dateRange.end) return s===dateRange.start;
    return s>=dateRange.start && s<=dateRange.end;
  };

  const isStart = day => toStr(day)===dateRange.start;
  const isEnd   = day => toStr(day)===dateRange.end;
  const isWeekend = day => { const dow=new Date(calYear,calMonth,day).getDay(); return dow===0||dow===6; };
  const isToday   = day => { const t=new Date(); return t.getFullYear()===calYear&&t.getMonth()===calMonth&&t.getDate()===day; };

  const WEEK_HEADERS = ['Is','Se','Ra','Kh','Ju','Sa','Ah'];

  return (
    <div className="space-y-3">
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 space-y-3">
        {/* Nav bulan */}
        <div className="flex items-center justify-between">
          <button onClick={()=>{ if(calMonth===0){setCalMonth(11);setCalYear(y=>y-1);}else setCalMonth(m=>m-1); }} className="p-2 bg-slate-100 rounded-xl hover:bg-slate-200 transition"><Icon name="ChevronLeft" size={16}/></button>
          <p className="font-black text-slate-800">{new Date(calYear,calMonth,1).toLocaleDateString('ms-MY',{month:'long',year:'numeric'})}</p>
          <button onClick={()=>{ if(calMonth===11){setCalMonth(0);setCalYear(y=>y+1);}else setCalMonth(m=>m+1); }} className="p-2 bg-slate-100 rounded-xl hover:bg-slate-200 transition"><Icon name="ChevronRight" size={16}/></button>
        </div>

        {/* Grid kalendar */}
        <div className="grid grid-cols-7 gap-1">
          {WEEK_HEADERS.map(h=><div key={h} className="text-center text-[10px] font-black text-slate-400 py-1">{h}</div>)}
          {Array(offset).fill(null).map((_,i)=><div key={'e'+i}/>)}
          {Array(daysInMonth).fill(null).map((_,i)=>{
            const day = i+1;
            const weekend = isWeekend(day);
            const inR = inRange(day);
            const start = isStart(day);
            const end = isEnd(day);
            const today_ = isToday(day);
            return (
              <button key={day} onClick={()=>handleDayClick(day)} disabled={weekend}
                className={`
                  h-9 w-full rounded-xl text-xs font-black transition
                  ${weekend ? 'text-slate-200 cursor-not-allowed' : ''}
                  ${start||end ? 'bg-purple-600 text-white shadow-md' : ''}
                  ${inR&&!start&&!end ? 'bg-purple-100 text-purple-800' : ''}
                  ${!inR&&!start&&!end&&!weekend ? 'hover:bg-slate-100 text-slate-700' : ''}
                  ${today_&&!inR&&!start&&!end ? 'ring-2 ring-purple-300' : ''}
                `}>
                {day}
              </button>
            );
          })}
        </div>

        {/* Info pilihan */}
        {dateRange.start && (
          <div className="bg-purple-50 border border-purple-100 rounded-xl p-3 text-xs text-purple-800">
            {dateRange.end && dateRange.end !== dateRange.start
              ? <p>📅 <span className="font-black">{dateRange.start}</span> hingga <span className="font-black">{dateRange.end}</span> · {activeDates.length} hari bekerja</p>
              : <p>📅 <span className="font-black">{dateRange.start}</span> {!dateRange.end ? '— Klik tarikh akhir (dalam minggu yang sama)' : ''}</p>
            }
          </div>
        )}
      </div>

      {/* Confirm button */}
      <button onClick={onConfirm} disabled={!dateRange.start||loading}
        className="w-full py-3.5 bg-purple-600 text-white rounded-xl font-black hover:bg-purple-700 active:scale-95 transition disabled:opacity-40 flex items-center justify-center gap-2 shadow-lg shadow-purple-200">
        {loading ? <><Icon name="Loader2" size={16} className="animate-spin"/>Memuatkan jadual...</> : <><Icon name="CalendarDays" size={16}/>Papar Slot Jadual</>}
      </button>
    </div>
  );
};
