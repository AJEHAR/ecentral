const BackupTab = ({ user, showToast }) => {
  const [exporting,  setExporting]  = useState(false);
  const [importing,  setImporting]  = useState(false);
  const [backupData, setBackupData] = useState(null); // preview stats lepas export
  const [restoreMode,setRestoreMode]= useState('merge');
  const [restoreFile,setRestoreFile]= useState(null);
  const [restorePreview, setRestorePreview] = useState(null);
  const [restoring,  setRestoring]  = useState(false);
  const fileRef = React.useRef();

  // ── Export Backup ──
  const handleExport = async () => {
    setExporting(true);
    try {
      const result = await apiCall('exportBackup', user.uid);
      if (!result?.backup) throw new Error('Gagal dapatkan data backup.');

      const backup = result.backup;
      setBackupData(backup.stats);

      // Download sebagai JSON file
      const json = JSON.stringify(backup, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      const date = new Date().toISOString().slice(0,10);
      a.href     = url;
      a.download = `eCentral_backup_${user.username}_${date}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showToast('Backup berjaya dimuat turun!', 'success');
    } catch(e) { showToast(String(e), 'error'); }
    setExporting(false);
  };

  // ── Baca fail restore ──
  const handleFileChange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.name.endsWith('.json')) { showToast('Sila pilih fail .json', 'warning'); return; }
    setRestoreFile(file);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const backup = JSON.parse(ev.target.result);
        if (!backup.version || !backup.data) { showToast('Fail backup tidak sah.', 'error'); setRestoreFile(null); return; }
        setRestorePreview({
          exportedAt: backup.exportedAt,
          stats:      backup.stats,
          userInfo:   backup.userInfo,
          raw:        ev.target.result,
        });
      } catch(e) { showToast('Fail tidak sah atau rosak.', 'error'); setRestoreFile(null); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  // ── Restore ──
  const handleRestore = async () => {
    if (!restorePreview) return;
    const warn = restoreMode === 'replace'
      ? 'AMARAN: Mod "Gantikan" akan PADAM SEMUA data RPH dan Dokumen anda terlebih dahulu, kemudian import dari backup.\n\nTindakan ini tidak boleh dibatalkan. Teruskan?'
      : 'Restore backup dalam mod "Gabung"?\nData yang sudah ada tidak akan terjejas, hanya data baru ditambah.';
    if (!window.confirm(warn)) return;
    setRestoring(true);
    try {
      const result = await apiCall('importBackup', user.uid, restorePreview.raw, restoreMode);
      const r = result.restored;
      showToast(
        `Restore berjaya! RPH Folder: ${r.rphFolders}, RPH: ${r.rph}, Dok Folder: ${r.dokFolders}, Dokumen: ${r.dokumen}` +
        (r.skipped > 0 ? ` (${r.skipped} diabaikan)` : ''),
        'success'
      );
      setRestoreFile(null); setRestorePreview(null);
    } catch(e) { showToast(String(e), 'error'); }
    setRestoring(false);
  };

  const StatRow = ({ label, val }) => (
    <div className="flex items-center justify-between py-1.5 border-b border-slate-100 last:border-0">
      <span className="text-xs text-slate-500">{label}</span>
      <span className="text-xs font-black text-slate-800">{val}</span>
    </div>
  );

  return (
    <div className="space-y-4">

      {/* Info */}
      <div className="bg-blue-50 border border-blue-200 rounded-2xl p-4 flex gap-3">
        <div className="w-9 h-9 bg-blue-100 rounded-xl flex items-center justify-center flex-shrink-0">
          <Icon name="Info" size={18} className="text-blue-600"/>
        </div>
        <div className="text-sm text-blue-800 space-y-1">
          <p className="font-black">Apa yang disimpan dalam backup?</p>
          <ul className="text-xs text-blue-700 space-y-0.5">
            <li>✅ Semua RPH (folder, slot, refleksi)</li>
            <li>✅ Folder Dokumen + metadata (nama, format, saiz)</li>
            <li>✅ Maklumat profil (nama, email, role)</li>
            <li>⚠️ Fail dokumen (PDF, gambar) — link Drive disimpan, fail kekal di Drive</li>
            <li>❌ PIN tidak disimpan</li>
          </ul>
        </div>
      </div>

      {/* Export */}
      <div className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
        <div className="px-5 py-4 border-b border-slate-100">
          <h3 className="font-black text-slate-800 text-sm flex items-center gap-2">
            <Icon name="Download" size={15} className="text-purple-600"/> Export Backup
          </h3>
          <p className="text-xs text-slate-400 mt-0.5">Muat turun semua data anda sebagai fail .json</p>
        </div>
        <div className="p-5">
          {backupData && (
            <div className="bg-green-50 border border-green-200 rounded-xl p-3 mb-4">
              <p className="text-xs font-black text-green-800 mb-2">✅ Backup terakhir:</p>
              <StatRow label="RPH Folder" val={backupData.rphFolders}/>
              <StatRow label="RPH" val={backupData.rph}/>
              <StatRow label="Folder Dokumen" val={backupData.dokFolders}/>
              <StatRow label="Dokumen" val={backupData.dokumen}/>
              {backupData.rpt > 0 && <StatRow label="RPT" val={backupData.rpt}/>}
            </div>
          )}
          <button onClick={handleExport} disabled={exporting}
            className="w-full py-3.5 bg-purple-600 text-white rounded-xl font-black hover:bg-purple-700 active:scale-95 transition disabled:opacity-40 flex items-center justify-center gap-2">
            {exporting
              ? <><Icon name="Loader2" size={15} className="animate-spin"/>Menyediakan backup...</>
              : <><Icon name="Download" size={15}/>Export Backup</>}
          </button>
        </div>
      </div>

      {/* Restore */}
      <div className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
        <div className="px-5 py-4 border-b border-slate-100">
          <h3 className="font-black text-slate-800 text-sm flex items-center gap-2">
            <Icon name="Upload" size={15} className="text-amber-600"/> Restore Backup
          </h3>
          <p className="text-xs text-slate-400 mt-0.5">Import data dari fail backup .json</p>
        </div>
        <div className="p-5 space-y-4">

          {/* Mod restore */}
          <div>
            <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Mod Restore</label>
            <div className="grid grid-cols-2 gap-2 mt-2">
              {[
                { val:'merge',   label:'🔀 Gabung',    sub:'Tambah data baru, kekal data sedia ada' },
                { val:'replace', label:'⚠️ Gantikan', sub:'Padam semua data dulu, kemudian import' },
              ].map(({val,label,sub}) => (
                <button key={val} onClick={()=>setRestoreMode(val)}
                  className={`p-3 rounded-xl border-2 text-left transition ${restoreMode===val ? (val==='replace' ? 'border-red-400 bg-red-50' : 'border-purple-400 bg-purple-50') : 'border-slate-200 bg-white hover:border-slate-300'}`}>
                  <p className={`text-xs font-black ${restoreMode===val ? (val==='replace'?'text-red-700':'text-purple-700') : 'text-slate-700'}`}>{label}</p>
                  <p className={`text-[10px] mt-0.5 ${restoreMode===val ? (val==='replace'?'text-red-500':'text-purple-500') : 'text-slate-400'}`}>{sub}</p>
                </button>
              ))}
            </div>
            {restoreMode==='replace' && (
              <div className="mt-2 bg-red-50 border border-red-200 rounded-xl p-3 flex gap-2">
                <Icon name="TriangleAlert" size={14} className="text-red-500 flex-shrink-0 mt-0.5"/>
                <p className="text-xs text-red-700 font-bold">Mod Gantikan akan padam SEMUA RPH dan Dokumen anda sebelum restore. Pastikan backup adalah betul.</p>
              </div>
            )}
          </div>

          {/* Pilih fail */}
          {!restorePreview ? (
            <button onClick={()=>fileRef.current.click()}
              className="w-full py-6 border-2 border-dashed border-slate-200 rounded-2xl text-slate-400 hover:border-amber-300 hover:text-amber-500 transition flex flex-col items-center gap-2">
              <Icon name="Upload" size={24}/>
              <p className="text-sm font-black">Pilih fail backup .json</p>
            </button>
          ) : (
            <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 space-y-3">
              <div className="flex items-center justify-between">
                <p className="text-xs font-black text-amber-800">📄 {restoreFile?.name || 'backup.json'}</p>
                <button onClick={()=>{ setRestoreFile(null); setRestorePreview(null); }}
                  className="p-1 text-amber-400 hover:text-red-500 transition">
                  <Icon name="X" size={14}/>
                </button>
              </div>
              {restorePreview.exportedAt && (
                <p className="text-[10px] text-amber-600">Diexport: {new Date(restorePreview.exportedAt).toLocaleString('ms-MY')}</p>
              )}
              <div className="bg-white rounded-lg p-3 space-y-0">
                <p className="text-[10px] font-black text-slate-500 mb-1.5 uppercase tracking-wider">Kandungan backup:</p>
                <StatRow label="RPH Folder"     val={restorePreview.stats?.rphFolders || 0}/>
                <StatRow label="RPH"             val={restorePreview.stats?.rph || 0}/>
                <StatRow label="Folder Dokumen" val={restorePreview.stats?.dokFolders || 0}/>
                <StatRow label="Dokumen"        val={restorePreview.stats?.dokumen || 0}/>
                {(restorePreview.stats?.rpt||0) > 0 && <StatRow label="RPT" val={restorePreview.stats.rpt}/>}
              </div>
            </div>
          )}

          <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={handleFileChange}/>

          <button onClick={handleRestore} disabled={restoring || !restorePreview}
            className={`w-full py-3.5 rounded-xl font-black active:scale-95 transition disabled:opacity-40 flex items-center justify-center gap-2 text-white ${restoreMode==='replace' ? 'bg-red-500 hover:bg-red-600' : 'bg-amber-500 hover:bg-amber-600'}`}>
            {restoring
              ? <><Icon name="Loader2" size={15} className="animate-spin"/>Memulihkan data...</>
              : <><Icon name="Upload" size={15}/>{restoreMode==='replace' ? 'Gantikan & Restore' : 'Restore Backup'}</>}
          </button>
        </div>
      </div>
    </div>
  );
};

  const handleCancel = async () => {

                <li>Selepas 30 hari, akaun dipadam secara <b>kekal</b></li>

              <Icon name="Trash2" size={15}/> Minta Padam Akaun Saya
            </button>
          ) : (
            <div className="space-y-3">
              <div className="bg-red-50 border border-red-200 rounded-xl p-4 text-center">
                <p className="font-black text-red-800 text-sm mb-1">Adakah anda pasti?</p>
                <p className="text-xs text-red-600">Tindakan ini akan memulakan proses pemadaman 30 hari.</p>
              </div>
              <div className="flex gap-2">

                  Batal

          )}
        </div>
      </div>
    </div>
  );
};

const SystemToolsPanel = ({ showToast, onBack }) => {
  const [running, setRunning] = useState(false);

    setRunning(true); setResult('');

      <div className="flex items-center gap-3">

        <Icon name="TriangleAlert" size={18} className="text-amber-600 flex-shrink-0 mt-0.5"/>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">

          {fn:'setupDatabase',label:'Kemaskini Schema',icon:'Database',wrap:'bg-purple-50 border-purple-100',txt:'text-purple-600',btn:'bg-purple-600 hover:bg-purple-700',desc:'Tambah column yang hilang'},
        ].map(item=>(
          <div key={item.fn} className="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">

const PengurusanAkaun = ({ user, showToast }) => {
  const [subView, setSubView] = useState('list');
  const [selectedUser, setSelectedUser] = useState(null);
  const [users, setUsers] = useState([]);
  const [stats, setStats] = useState(null);
  const [loading, setLoading] = useState(true);
  const fetchUsers = useCallback(()=>{
    setLoading(true);
    Promise.all([apiCall('getAllUsers'),apiCall('getAdminAccountStats')])
      .then(([u,s])=>{ setUsers(Array.isArray(u)?u:[]); setStats(s||null); setLoading(false); })
      .catch(e=>{ showToast(e.toString(),'error'); setLoading(false); });
  },[]);
  useEffect(()=>{ fetchUsers(); },[]);
  if (loading) return <div className="flex justify-center p-20"><Icon name="Loader2" className="animate-spin text-purple-500" size={40}/></div>;
  if (subView==='tools') return <SystemToolsPanel showToast={showToast} onBack={()=>setSubView('list')}/>;
  if (subView==='edit'&&selectedUser) return <AkaunEditPage targetUser={selectedUser} onBack={()=>{ setSubView('list'); setSelectedUser(null); fetchUsers(); }} showToast={showToast}/>;
  return <AkaunList users={users} stats={stats} onSelectUser={u=>{ setSelectedUser(u); setSubView('edit'); }} showToast={showToast} fetchUsers={fetchUsers} onTools={()=>setSubView('tools')}/>;
};

  const [filterRole, setFilterRole] = useState('');

  const { isMobile } = useDevice();

  const pendingUsers = useMemo(()=>users.filter(u=>u.status==='Pending'),[users]);
  const pendingDeleteUsers = useMemo(()=>users.filter(u=>u.status==='PendingDelete'),[users]);
  const filtered = useMemo(()=>{
    let list = activeTab==='pending' ? pendingUsers : activeTab==='pendingDelete' ? pendingDeleteUsers : users;
    const s=search.toLowerCase();
    return list.filter(u=>(!search||u.fullName?.toLowerCase().includes(s)||u.username?.toLowerCase().includes(s)||u.email?.toLowerCase().includes(s))&&(!filterRole||u.role===filterRole));
  },[users,pendingUsers,pendingDeleteUsers,search,filterRole,activeTab]);

  const handleStatusToggle = async (u,newStatus)=>{ try { await apiCall('updateUserStatus',u.uid,newStatus); showToast(`Status ${u.fullName} → ${newStatus}`,'success'); fetchUsers(); } catch(err){ showToast(err.toString(),'error'); } };
  const handleDelete = async ()=>{ if(!confirmDelete) return; try { await apiCall('deleteUser',confirmDelete.uid); showToast(`Akaun ${confirmDelete.fullName} dipadam.`,'success'); setConfirmDelete(null); fetchUsers(); } catch(err){ showToast(err.toString(),'error'); setConfirmDelete(null); } };
  const handleBulkApprove = async () => {
    if (!selected.length) return;
    setBulkApproving(true);
    try {
      const res = await apiCall('approveBulkUsers', JSON.stringify(selected));
      showToast(`${res.approved} akaun berjaya diaktifkan!`, 'success');
      setSelected([]);
      fetchUsers();

  const toggleSelect = (uid) => setSelected(s => s.includes(uid) ? s.filter(x=>x!==uid) : [...s,uid]);

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">

          {label:'Aktif',val:stats?.active||0,icon:'UserCheck',cls:'bg-purple-50 border-purple-100 text-purple-600'},
          {label:'Menunggu',val:stats?.pending||0,icon:'Clock',cls:'bg-amber-50 border-amber-100 text-amber-600',tab:'pending'},
          {label:'Minta Padam',val:stats?.pendingDelete||0,icon:'Trash2',cls:'bg-rose-50 border-rose-100 text-rose-600',tab:'pendingDelete'}
        ].map(s=>(
          <div key={s.label} onClick={()=>s.tab&&setActiveTab(s.tab)}

            <div className={`w-10 h-10 rounded-xl flex items-center justify-center border flex-shrink-0 ${s.cls}`}><Icon name={s.icon} size={18}/></div>
            <div><p className="text-xl font-black text-slate-800">{s.val}</p><p className="text-xs text-slate-400 font-bold">{s.label}</p></div>
          </div>
        ))}
      </div>
      {/* Tab switcher */}
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-1.5 flex gap-1">
        {[
          {id:'all',label:'Semua',icon:'Users'},
          {id:'pending',label:`Pending${pendingUsers.length?` (${pendingUsers.length})`:''}`,icon:'Clock'},

          <button key={t.id} onClick={()=>{setActiveTab(t.id);setSelected([]);}}

            <Icon name={t.icon} size={13}/><span className="hidden sm:inline">{t.label}</span><span className="sm:hidden">{t.label.split(' (')[0]}</span>
          </button>

      </div>

      {/* Bulk approve bar — only in pending tab */}
      {activeTab==='pending' && pendingUsers.length>0 && (

          <button onClick={onTools} className="flex items-center gap-1.5 px-3 py-2.5 bg-purple-50 border border-purple-200 text-purple-700 rounded-xl text-xs font-black hover:bg-purple-100 active:scale-95 transition">
            <Icon name="Wrench" size={13}/><span className="hidden sm:inline">Alatan</span>

        </div>

      {isMobile ? (
        <div className="space-y-2">

                  <StatusBadge status={u.status}/>

              </div>
              <div className="flex gap-2">

                {u.role!=='Admin' && (u.status==='Active'

                  : <button onClick={()=>handleStatusToggle(u,'Active')} className="flex-1 flex items-center justify-center gap-1.5 px-3 py-2.5 bg-purple-50 text-purple-700 border border-purple-200 rounded-xl font-bold text-xs active:scale-95 transition"><Icon name="CheckCircle" size={13}/> Aktif</button>

                      {u.role!=='Admin'&&<button onClick={()=>setConfirmDelete(u)} className="px-3 py-2 bg-red-50 text-red-600 border border-red-200 rounded-xl hover:bg-red-500 hover:text-white font-bold text-xs active:scale-95 transition"><Icon name="Trash2" size={13}/></button>}
                    </div></td>

              </tbody>
            </table>
          </div>
        </div>

    </div>
  );
};

const AkaunEditPage = ({ targetUser, onBack, showToast }) => {
  const [form, setForm] = useState({ fullName:targetUser.fullName||'', username:targetUser.username||'', email:targetUser.email||'', role:targetUser.role||'Guru', status:targetUser.status||'Active' });
  const [newPin, setNewPin] = useState('');
  const [showPin, setShowPin] = useState(false);
  const [savingInfo, setSavingInfo] = useState(false);
  const [savingPin, setSavingPin] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [dirty, setDirty] = useState(false);
  const set = (f,v)=>{ setForm(p=>({...p,[f]:v})); setDirty(true); };
  const handleSaveInfo = async ()=>{
    if (!form.fullName.trim()) return showToast('Nama penuh tidak boleh kosong.','error');
    setSavingInfo(true);
    try { await apiCall('adminEditUser',targetUser.uid,JSON.stringify(form)); showToast('Maklumat berjaya dikemaskini!','success'); setDirty(false); }
    catch(err){ showToast(err.toString(),'error'); } finally { setSavingInfo(false); }
  };
  const handleResetPin = async ()=>{
    if (!/^\d{4}$/.test(newPin)) return showToast('PIN mesti 4 digit.','error');
    setSavingPin(true);
    try { await apiCall('adminResetPin',targetUser.uid,newPin); showToast(`PIN ${form.fullName} berjaya ditukar!`,'success'); setNewPin(''); }
    catch(err){ showToast(err.toString(),'error'); } finally { setSavingPin(false); }
  };
  const handleDelete = async ()=>{
    try { await apiCall('deleteUser',targetUser.uid); showToast(`Akaun dipadam.`,'success'); setConfirmDelete(false); onBack(); }
    catch(err){ showToast(err.toString(),'error'); setConfirmDelete(false); }
  };
  return (

const timeAgo = (dateStr) => {
  if (!dateStr) return '-';
  const now = new Date();
  const then = new Date(dateStr);
  const diff = Math.floor((now - then) / 1000);
  if (diff < 60) return 'baru sahaja';
  if (diff < 3600) return `${Math.floor(diff/60)} minit lepas`;
  if (diff < 86400) return `${Math.floor(diff/3600)} jam lepas`;
  if (diff < 604800) return `${Math.floor(diff/86400)} hari lepas`;
  return then.toLocaleDateString('ms-MY', { day:'numeric', month:'short', year:'numeric' });
};

const RoleBadge = ({ role }) => {

    Pentadbir: 'bg-indigo-100 text-indigo-700 border-indigo-200',
    Guru:      'bg-amber-100 text-amber-700 border-amber-200',
  };
  const label = { Admin:'Admin', Pentadbir:'Pentadbir', Guru:'Guru' };
  return (
    <span className={`px-2 py-0.5 text-[10px] font-black rounded-full border ${map[role]||map.Guru}`}>
      {label[role] || role}
    </span>
  );
};

const PostCard = ({ post, currentUser, onReply, onDelete, onPin, showToast }) => {

  const [submitting, setSubmitting] = useState(false);
  const isAnnouncement = post.isAnnouncement;
  const isPinned = post.isPinned;
  const isOwner = post.userId === currentUser.uid;
  const isAdmin = currentUser.role === 'Admin' || currentUser.role === 'Pentadbir';
  const canDelete = isOwner || isAdmin;
  const canPin = isAdmin;

  const cardBg = isPinned
    ? 'border-purple-300 bg-purple-50/60'
    : isAnnouncement
      ? 'border-amber-200 bg-amber-50/40'
      : 'border-slate-200 bg-white';

  const handleReply = async () => {
    if (!replyText.trim()) return showToast('Sila taip mesej.', 'error');
    setSubmitting(true);
    try {
      await onReply(post.postId, replyText.trim());
      setReplyText('');
    } finally {
      setSubmitting(false);
    }
  };

  return (
    <div className={`rounded-2xl border-2 shadow-sm overflow-hidden transition-all ${cardBg}`}>
      {/* Header label */}
      {(isPinned || isAnnouncement) && (
        <div className={`px-4 py-1.5 flex items-center gap-2 text-xs font-black border-b ${isPinned ? 'bg-purple-100 border-purple-200 text-purple-700' : 'bg-amber-100 border-amber-200 text-amber-700'}`}>
          <Icon name={isPinned ? 'Pin' : 'Megaphone'} size={12}/>
          {isPinned ? 'DISEMATKAN' : 'PENGUMUMAN'}
        </div>
      )}

      {/* Post utama */}
      <div className="p-4">
        <div className="flex items-start gap-3">
          <AvatarDisplay src={null} name={post.fullName} size="sm" className="flex-shrink-0 mt-0.5"/>
          <div className="flex-1 min-w-0">
            <div className="flex flex-wrap items-center gap-2 mb-1">
              <span className="font-black text-slate-800 text-sm">{post.fullName}</span>
              <RoleBadge role={post.role}/>
              <span className="text-xs text-slate-400">{timeAgo(post.createdAt)}</span>
            </div>
            <p className="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">{post.message}</p>
          </div>
          {/* Actions */}
          <div className="flex items-center gap-1 flex-shrink-0">
            {canPin && (
              <button onClick={()=>onPin(post.postId)}
                className={`p-2 rounded-xl border transition active:scale-90 text-xs ${isPinned ? 'bg-purple-100 text-purple-600 border-purple-200 hover:bg-purple-200' : 'bg-slate-50 text-slate-400 border-slate-200 hover:bg-slate-100'}`}
                title={isPinned ? 'Unpin' : 'Pin'}>
                <Icon name="Pin" size={13}/>
              </button>
            )}
            {canDelete && (
              <button onClick={()=>onDelete(post.postId)}
                className="p-2 rounded-xl border bg-slate-50 text-slate-400 border-slate-200 hover:bg-red-50 hover:text-red-500 hover:border-red-200 transition active:scale-90">
                <Icon name="Trash2" size={13}/>
              </button>
            )}
          </div>
        </div>

        {/* Toggle replies */}
        <div className="mt-3 flex items-center gap-3">
          <button onClick={()=>setExpanded(!expanded)}
            className="flex items-center gap-1.5 text-xs font-bold text-purple-600 hover:text-purple-800 active:scale-95 transition">
            <Icon name={expanded ? 'ChevronUp' : 'ChevronDown'} size={14}/>
            {post.replyCount > 0 ? `${post.replyCount} balasan` : 'Balas'}
          </button>
        </div>
      </div>

      {/* Replies & reply form */}
      {expanded && (
        <div className="border-t border-slate-100 bg-white/80">
          {/* Senarai replies */}
          {post.replies && post.replies.length > 0 && (
            <div className="divide-y divide-slate-50">
              {post.replies.map(reply => {
                const replyIsOwner = reply.userId === currentUser.uid;

                    <div className="w-5 flex-shrink-0 flex justify-center pt-1">
                      <div className="w-0.5 h-full bg-slate-200 rounded-full min-h-4"/>
                    </div>
                    <AvatarDisplay src={null} name={reply.fullName} size="xs" className="flex-shrink-0 mt-0.5"/>
                    <div className="flex-1 min-w-0">
                      <div className="flex flex-wrap items-center gap-1.5 mb-0.5">
                        <span className="font-black text-slate-700 text-xs">{reply.fullName}</span>
                        <RoleBadge role={reply.role}/>

                        <Icon name="Trash2" size={11}/>
                      </button>

              })}

          )}

          {/* Reply form */}
          <div className="px-4 py-3 border-t border-slate-100 flex items-end gap-2">
            <AvatarDisplay src={currentUser.profilePic} name={currentUser.fullName} size="xs" className="flex-shrink-0 mb-1"/>
            <div className="flex-1 relative">
              <textarea
                value={replyText}
                onChange={e=>setReplyText(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); handleReply(); } }}
                placeholder="Tulis balasan... (Enter untuk hantar)"
                className="w-full px-3 py-2.5 border border-slate-200 rounded-xl outline-none text-xs resize-none focus:border-purple-400 focus:ring-2 focus:ring-purple-100 bg-purple-50/30 focus:bg-white min-h-[40px] max-h-[120px]"

              className="p-2.5 bg-purple-600 text-white rounded-xl hover:bg-purple-700 active:scale-90 transition disabled:opacity-40 flex-shrink-0 mb-0.5">
              {submitting
                ? <Icon name="Loader2" size={15} className="animate-spin"/>
                : <Icon name="Send" size={15}/>
              }
            </button>
          </div>
        </div>
      )}
    </div>
  );
};

const PapanPengumuman = ({ user, showToast, setUnreadCount }) => {
  const [posts, setPosts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [newMsg, setNewMsg] = useState('');
  const [isAnnouncement, setIsAnnouncement] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const canAnnounce = user.role === 'Admin' || user.role === 'Pentadbir' || user.role === 'Guru';
  const textareaRef = useRef(null);

const fetchPosts = (markRead = false) => {
  setLoading(true);
  apiCall('getPosts')
    .then(r => {
      const allPosts = Array.isArray(r) ? r : [];
      setPosts(allPosts);
      setLoading(false);

      // Kira post baru — guna localStorage untuk track lastSeen
      try {
        const lastSeen = Number(localStorage.getItem('ecentral_papan_lastseen') || 0);
        const newCount = allPosts.filter(p => new Date(p.createdAt).getTime() > lastSeen).length;
        if (setUnreadCount) setUnreadCount(newCount);
        if (markRead) {
          localStorage.setItem('ecentral_papan_lastseen', Date.now().toString());
          if (setUnreadCount) setUnreadCount(0);
        }
      } catch(e) {}
    })
    .catch(e => { showToast(e.toString(), 'error'); setLoading(false); });
};

  useEffect(() => { fetchPosts(true); }, []);

  const handlePost = async () => {
    if (!newMsg.trim()) return showToast('Sila taip mesej.', 'error');
    setSubmitting(true);
    try {
      await apiCall('createPost', {
        userId: user.uid,
        fullName: user.fullName,
        role: user.role,
        message: newMsg.trim(),
        parentId: '',
        isAnnouncement: canAnnounce && isAnnouncement,
      });
      setNewMsg('');
      setIsAnnouncement(false);
      showToast('Post berjaya dihantar!', 'success');
      fetchPosts();
    } catch(err) {
      showToast(err.toString(), 'error');
    } finally {
      setSubmitting(false);
    }
  };

  const handleReply = async (parentId, message) => {
    try {
      await apiCall('createPost', {
        userId: user.uid,
        fullName: user.fullName,
        role: user.role,
        message,
        parentId,
        isAnnouncement: false,
      });
      showToast('Balasan dihantar!', 'success');
      fetchPosts();
    } catch(err) {
      showToast(err.toString(), 'error');
    }
  };

  const handleDelete = (postId) => {
    setConfirmDelete(postId);
  };

  const confirmDeletePost = async () => {
    if (!confirmDelete) return;
    try {
      await apiCall('deletePost', confirmDelete, user.uid, user.role);
      showToast('Post berjaya dipadam.', 'success');
      setConfirmDelete(null);
      fetchPosts();
    } catch(err) {
      showToast(err.toString(), 'error');
      setConfirmDelete(null);
    }
  };

  const handlePin = async (postId) => {
    try {
      const result = await apiCall('togglePin', postId);
      showToast(result.isPinned ? 'Post disematkan.' : 'Pin dibuang.', 'success');
      fetchPosts();
    } catch(err) {
      showToast(err.toString(), 'error');
    }
  };

  const pinnedPosts = posts.filter(p => p.isPinned);
  const regularPosts = posts.filter(p => !p.isPinned);

  return (
    <div className="space-y-4 fade-in">
      {/* Compose box */}
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div className="px-4 py-3 border-b border-slate-100 flex items-center gap-2">
          <AvatarDisplay src={user.profilePic} name={user.fullName} size="sm"/>
          <div className="flex-1 min-w-0">
            <p className="text-xs font-black text-slate-700">{user.fullName}</p>
            <p className="text-[10px] text-slate-400">{({Admin:'Admin',Pentadbir:'Pentadbir',Guru:'Guru'})[user.role]||user.role}</p>
          </div>
          <button onClick={fetchPosts} className="p-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-500 hover:bg-slate-100 active:scale-90 transition">
            <Icon name="RefreshCcw" size={14}/>
          </button>
        </div>
        <div className="p-4 space-y-3">
          <textarea
            ref={textareaRef}
            value={newMsg}
            onChange={e=>setNewMsg(e.target.value)}
            placeholder={canAnnounce ? "Tulis pengumuman atau mesej..." : "Tulis soalan atau mesej..."}
            className="w-full px-4 py-3 border border-slate-200 rounded-xl outline-none text-sm resize-none focus:border-purple-400 focus:ring-2 focus:ring-purple-100 bg-purple-50/30 focus:bg-white min-h-[80px]"
            rows={3}
          />
          <div className="flex items-center justify-between gap-3">
            {canAnnounce ? (
              <button onClick={()=>setIsAnnouncement(!isAnnouncement)}
                className={`flex items-center gap-2 px-3 py-2 rounded-xl border text-xs font-bold transition active:scale-95 ${isAnnouncement ? 'bg-amber-100 border-amber-300 text-amber-700' : 'bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100'}`}>
                <Icon name="Megaphone" size={13}/>
                {isAnnouncement ? 'Pengumuman ✓' : 'Tandakan sebagai Pengumuman'}
              </button>
            ) : <div/>}
            <button onClick={handlePost} disabled={submitting || !newMsg.trim()}
              className="flex items-center gap-2 px-4 py-2.5 bg-purple-600 text-white rounded-xl font-bold text-sm hover:bg-purple-700 active:scale-95 transition shadow-md disabled:opacity-40 ripple">
              {submitting
                ? <><Icon name="Loader2" size={15} className="animate-spin"/> Menghantar...</>
                : <><Icon name="Send" size={15}/> Hantar</>
              }
            </button>
          </div>
        </div>
      </div>

      {loading ? (
        <div className="flex justify-center p-20">
          <Icon name="Loader2" className="animate-spin text-purple-500" size={40}/>
        </div>
      ) : (
        <>
          {/* Pinned posts */}
          {pinnedPosts.length > 0 && (
            <div className="space-y-3">
              {pinnedPosts.map(post => (
                <PostCard key={post.postId} post={post} currentUser={user}
                  onReply={handleReply} onDelete={handleDelete}
                  onPin={handlePin} showToast={showToast}/>
              ))}
            </div>
          )}

          {/* Regular posts */}
          {regularPosts.length > 0 ? (
            <div className="space-y-3">
              {regularPosts.map(post => (
                <PostCard key={post.postId} post={post} currentUser={user}
                  onReply={handleReply} onDelete={handleDelete}
                  onPin={handlePin} showToast={showToast}/>
              ))}
            </div>
          ) : posts.length === 0 ? (
            <div className="py-16 text-center bg-white rounded-2xl border-2 border-dashed border-slate-200 text-slate-400 flex flex-col items-center">
              <Icon name="MessageSquare" size={44} className="text-slate-300 mb-3"/>
              <p className="font-bold text-sm">Belum ada post</p>
              <p className="text-xs mt-1">Jadilah yang pertama menulis!</p>
            </div>
          ) : null}
        </>
      )}

      {confirmDelete && (
        <ConfirmModal
          title="Padam Post?"
          message="Post ini akan dipadam secara kekal."
          confirmLabel="Ya, Padam"
          confirmClass="bg-red-500 hover:bg-red-600"
          danger
          onConfirm={confirmDeletePost}
          onCancel={()=>setConfirmDelete(null)}
        />
      )}
    </div>
  );
};

const ModulJadual = ({ user, showToast }) => {
  const isAdmin = user.role === 'Admin' || user.role === 'Pentadbir';
  const [subView, setSubView] = useState('guru'); // 'guru' | 'kelas' | 'induk'
  const [meta, setMeta]           = useState(null);
  const [teachers, setTeachers]   = useState([]);
  const [classes, setClasses]     = useState([]);
  const [selTeacher, setSelTeacher] = useState('');
  const [selClass, setSelClass]     = useState('');
  const [slots, setSlots]           = useState([]);
  const [loading, setLoading]       = useState(false);
  const [uploading, setUploading]   = useState(false);
  const [showUpload, setShowUpload] = useState(false);
  const fileRef = useRef(null);

  useEffect(() => {
    apiCall('getTimetableMeta').then(m => setMeta(m)).catch(()=>{});
    apiCall('getTeacherList').then(t => setTeachers(Array.isArray(t)?t:[])).catch(()=>{});
    apiCall('getClassList').then(c => setClasses(Array.isArray(c)?c:[])).catch(()=>{});
  }, []);

  useEffect(() => {
    if (subView === 'guru' && selTeacher) {
      setLoading(true);
      apiCall('getScheduleByTeacher', selTeacher).then(s => { setSlots(Array.isArray(s)?s:[]); setLoading(false); }).catch(e => { showToast(e,'error'); setLoading(false); });
    } else if (subView === 'kelas' && selClass) {
      setLoading(true);
      apiCall('getScheduleByClass', selClass).then(s => { setSlots(Array.isArray(s)?s:[]); setLoading(false); }).catch(e => { showToast(e,'error'); setLoading(false); });
    } else if (subView === 'induk') {
      setLoading(true);
      apiCall('getFullTimetable').then(s => { setSlots(Array.isArray(s)?s:[]); setLoading(false); }).catch(e => { showToast(e,'error'); setLoading(false); });
    } else { setSlots([]); }
  }, [subView, selTeacher, selClass]);

  const handleUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    try {
      const text = await new Promise((res,rej) => {
        const r = new FileReader();
        r.onload = ev => res(ev.target.result);
        r.onerror = () => rej('Gagal baca fail');
        r.readAsText(file, 'windows-1252');
      });
      const result = await apiCall('parseAndSaveASC', text, user.fullName);
      showToast(`Berjaya! ${result.slotCount} slot diimport. ${result.teachers} guru, ${result.classes} kelas.`, 'success');
      setShowUpload(false);
      const [m,t,c] = await Promise.all([apiCall('getTimetableMeta'),apiCall('getTeacherList'),apiCall('getClassList')]);
      setMeta(m); setTeachers(Array.isArray(t)?t:[]); setClasses(Array.isArray(c)?c:[]);
      setSlots([]);
    } catch(err) { showToast(String(err),'error'); }
    setUploading(false);
    e.target.value = '';
  };

  // Group slots by day then period for grid view
  const slotsByDayPeriod = useMemo(() => {
    const map = {};
    slots.forEach(s => {
      if (!map[s.day]) map[s.day] = {};
      if (!map[s.day][s.period]) map[s.day][s.period] = [];
      map[s.day][s.period].push(s);
    });
    return map;
  }, [slots]);

  const allPeriods = useMemo(() => {
    const ps = [...new Set(slots.map(s => s.period))].sort((a,b)=>a-b);
    return ps;
  }, [slots]);

  return (
    <div className="space-y-4 fade-in">
      {/* Header */}
      <div className="flex items-center justify-between">
        <div>
          <h2 className="text-lg font-black text-slate-800">Jadual Waktu</h2>
          {meta && <p className="text-xs text-slate-400 mt-0.5">Dikemaskini: {new Date(meta.uploadedAt).toLocaleDateString('ms-MY', {day:'numeric',month:'long',year:'numeric'})} · {meta.slotCount} slot</p>}
        </div>
        {isAdmin && (
          <button onClick={()=>setShowUpload(true)}
            className="flex items-center gap-2 px-3 py-2 bg-purple-600 text-white rounded-xl text-xs font-black hover:bg-purple-700 active:scale-95 transition shadow-md">
            <Icon name="Upload" size={13}/> Upload XML
          </button>
        )}
      </div>

      {/* No data state */}
      {!meta && (
        <div className="bg-white rounded-2xl border border-dashed border-slate-300 p-12 text-center">
          <Icon name="CalendarDays" size={40} className="text-slate-300 mx-auto mb-3"/>
          <p className="font-black text-slate-500">Belum ada jadual diimport</p>
          <p className="text-xs text-slate-400 mt-1">{isAdmin ? 'Klik "Upload XML" untuk import fail ASC.' : 'Sila hubungi Admin untuk upload jadual.'}</p>
        </div>
      )}

      {meta && (<>
        {/* Sub-view tabs */}
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-1.5 flex gap-1">
          {[{id:'guru',label:'Per Guru',icon:'User'},{id:'kelas',label:'Per Kelas',icon:'Users'},{id:'induk',label:'Jadual Induk',icon:'Grid'}].map(t=>(
            <button key={t.id} onClick={()=>{setSubView(t.id);setSlots([]);}}
              className={`flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-xl text-xs font-black transition ${subView===t.id?'bg-purple-600 text-white shadow-sm':'text-slate-500 hover:bg-slate-50'}`}>
              <Icon name={t.icon} size={13}/><span className="hidden sm:inline">{t.label}</span><span className="sm:hidden">{t.id==='induk'?'Induk':t.label.split(' ')[1]}</span>
            </button>
          ))}
        </div>

        {/* Selector */}
        {subView === 'guru' && (
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
            <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Pilih Guru</label>
            <select value={selTeacher} onChange={e=>setSelTeacher(e.target.value)}
              className={_SC}>
              <option value="">-- Pilih guru --</option>
              {teachers.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
          </div>
        )}
        {subView === 'kelas' && (
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
            <label className="text-xs font-black text-slate-500 uppercase tracking-wider">Pilih Kelas</label>
            <select value={selClass} onChange={e=>setSelClass(e.target.value)}
              className={_SC}>
              <option value="">-- Pilih kelas --</option>
              {classes.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
        )}
        {subView === 'induk' && (
          <div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-2.5 flex items-center gap-2">
            <Icon name="Info" size={14} className="text-amber-600 flex-shrink-0"/>
            <p className="text-xs text-amber-700 font-bold">Jadual induk menunjukkan semua kelas dan semua guru. Scroll kanan untuk lihat semua.</p>
          </div>
        )}

        {/* Loading */}
        {loading && <div className="flex justify-center py-10"><Icon name="Loader2" size={32} className="animate-spin text-purple-500"/></div>}

        {/* Jadual Grid */}
        {!loading && slots.length > 0 && (
          <JadualGrid slots={slots} subView={subView} slotsByDayPeriod={slotsByDayPeriod} allPeriods={allPeriods} teachers={teachers} classes={classes}/>
        )}

        {!loading && slots.length === 0 && (subView==='guru'&&selTeacher || subView==='kelas'&&selClass || subView==='induk') && (
          <div className="text-center py-10 text-slate-400 text-sm">Tiada data jadual ditemui.</div>
        )}
      </>)}

      {/* Upload Modal */}
      {showUpload && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] flex items-center justify-center fade-in" onClick={()=>!uploading&&setShowUpload(false)}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 slide-up m-4" onClick={e=>e.stopPropagation()}>
            <h3 className="font-black text-slate-800 mb-1">Upload Jadual ASC</h3>
            <p className="text-xs text-slate-400 mb-4">Eksport fail XML dari perisian ASC Timetables kemudian upload di sini. Data jadual lama akan digantikan.</p>
            <div className="border-2 border-dashed border-purple-200 rounded-xl p-8 text-center bg-purple-50/30 cursor-pointer hover:border-purple-400 hover:bg-purple-50 transition"
              onClick={()=>fileRef.current?.click()}>
              <Icon name="Upload" size={28} className="text-purple-400 mx-auto mb-2"/>
              <p className="text-sm font-black text-purple-600">Klik untuk pilih fail XML</p>
              <p className="text-xs text-slate-400 mt-1">Format: .xml (ASC Timetables export)</p>
            </div>
            <input ref={fileRef} type="file" accept=".xml" className="hidden" onChange={handleUpload} disabled={uploading}/>
            {uploading && (
              <div className="mt-4 flex items-center justify-center gap-2 text-purple-600">
                <Icon name="Loader2" size={16} className="animate-spin"/>
                <span className="text-sm font-bold">Sedang memproses XML...</span>
              </div>
            )}
            {!uploading && (
              <button onClick={()=>setShowUpload(false)} className="mt-4 w-full py-2.5 bg-slate-100 text-slate-600 rounded-xl font-bold text-sm hover:bg-slate-200 transition">Batal</button>
            )}
          </div>
        </div>
      )}
    </div>
  );
};

const JadualGrid = ({ slots, subView, slotsByDayPeriod, allPeriods, teachers, classes }) => {
  // Build period info (startTime/endTime) from slots
  const periodInfo = useMemo(() => {
    const map = {};
    slots.forEach(s => {
      if (!map[s.period]) map[s.period] = { startTime: s.startTime, endTime: s.endTime };
    });
    return map;
  }, [slots]);

  const SUBJ_COLORS = {
    'BM':'bg-purple-600','BI':'bg-blue-600','MT':'bg-emerald-600','SN':'bg-cyan-600',
    'PI':'bg-amber-600','SEJ':'bg-orange-600','PJ':'bg-rose-500','PSV':'bg-pink-600',
    'RBT':'bg-indigo-600','TMK':'bg-violet-600','MZ':'bg-fuchsia-600','KH':'bg-teal-600',
    'PK':'bg-green-600','TAQ':'bg-yellow-600','A3M':'bg-red-600','BIK':'bg-sky-600',
    'KMF':'bg-lime-600','PD':'bg-slate-600','SS':'bg-stone-600',
  };
  const fallbacks = ['bg-purple-500','bg-blue-500','bg-emerald-500','bg-amber-500','bg-rose-500','bg-indigo-500','bg-teal-500','bg-orange-500'];
  const colorMap = useRef({}); let fi = 0;
  const getColor = (short) => {
    if (SUBJ_COLORS[short]) return SUBJ_COLORS[short];
    if (!colorMap.current[short]) colorMap.current[short] = fallbacks[fi++ % fallbacks.length];
    return colorMap.current[short];
  };

  // ── Layout: Waktu (baris) × Hari (lajur) — standard sekolah ──
  // Per Guru: lajur = Hari, sel = Subjek + Kelas
  // Per Kelas: lajur = Hari, sel = Subjek + Guru
  // Induk: lajur = Kelas, baris = Hari+Period, sel = Subjek+Guru

  // ── Layout standard sekolah: Hari (baris) × Waktu/Period (lajur) ──
  if (subView === 'guru' || subView === 'kelas') {
    const activeDays = DAYS.filter(d => slots.some(s => s.day === d));
    return (
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-x-auto">
        <table className="border-collapse text-xs" style={{minWidth: allPeriods.length * 100 + 90 + 'px'}}>
          <thead>
            <tr className="bg-slate-800 text-white">
              {/* Hari header — lajur pertama */}
              <th className="sticky left-0 z-10 bg-slate-800 px-2 py-3 text-left font-black border-r border-slate-600 min-w-[52px] w-[52px]">
                Hari
              </th>
              {/* Period headers — satu lajur per waktu */}
              {allPeriods.map(per => {
                const info = periodInfo[per] || {};
                return (
                  <th key={per} className="px-2 py-2 font-black border-r border-slate-600 text-center min-w-[90px] last:border-r-0">
                    <div className="text-[11px]">{info.startTime || `W${per}`}</div>
                    <div className="text-[9px] font-normal opacity-70">{info.endTime}</div>
                  </th>
                );
              })}
            </tr>
          </thead>
          <tbody>
            {activeDays.map((day, di) => (
              <tr key={day} className={`border-b border-slate-100 ${di % 2 === 0 ? 'bg-white' : 'bg-slate-50/50'}`}>
                {/* Hari cell */}
                <td className="sticky left-0 z-10 px-2 py-3 border-r border-slate-200 font-black text-slate-700 text-xs bg-purple-50 min-w-[52px] w-[52px]">
                  {day}
                </td>
                {/* Period cells */}
                {allPeriods.map(per => {
                  const cell = slots.filter(s => s.day === day && s.period === per);
                  return (
                    <td key={per} className="px-1.5 py-1.5 border-r border-slate-100 last:border-r-0 text-center align-middle min-w-[70px]">
                      {cell.length === 0 ? (
                        <div className="h-8 flex items-center justify-center text-slate-200 text-[10px]">—</div>
                      ) : cell.map((s, i) => (
                        <div key={i} className={`${getColor(s.subjectShort)} text-white rounded-xl px-1.5 py-1.5 mb-0.5`}>
                          <div className="font-black text-[11px] leading-tight">{s.subjectShort}</div>
                          <div className="text-[9px] opacity-90 leading-tight mt-0.5 truncate">
                            {subView === 'guru' ? s.className : s.teacherName.split(' ')[0]}
                          </div>
                        </div>
                      ))}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    );
  }

  // ── Induk: Kelas (baris) × Hari→Waktu (lajur grouped) ──
  const allClasses = [...new Set(slots.map(s => s.className))].sort();
  return (
    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-x-auto">
      <table className="border-collapse text-xs" style={{minWidth: DAYS.length * allPeriods.length * 80 + 130 + 'px'}}>
        <thead>
          {/* Row 1: Hari headers (spanning period columns) */}
          <tr className="bg-slate-800 text-white">
            <th className="sticky left-0 z-10 bg-slate-800 px-2 py-2 text-left font-black border-r border-slate-600 min-w-[80px] w-[80px]" rowSpan={2}>
              Kelas
            </th>
            {DAYS.map(day => {
              const dayPeriods = allPeriods.filter(per => slots.some(s => s.day === day && s.period === per));
              if (!dayPeriods.length) return null;
              return (
                <th key={day} colSpan={dayPeriods.length}
                  className="px-2 py-2 font-black border-r border-slate-600 text-center border-b border-slate-600">
                  {day}
                </th>
              );
            })}
          </tr>
          {/* Row 2: Period sub-headers under each day */}
          <tr className="bg-slate-700 text-white">
            {DAYS.map(day => {
              const dayPeriods = allPeriods.filter(per => slots.some(s => s.day === day && s.period === per));
              if (!dayPeriods.length) return null;
              return dayPeriods.map(per => {
                const info = periodInfo[per] || {};
                return (
                  <th key={`${day}-${per}`} className="px-1.5 py-1.5 font-bold border-r border-slate-600 text-center min-w-[75px] last:border-r-0">
                    <div className="text-[10px] leading-tight">{info.startTime || `W${per}`}</div>
                    <div className="text-[8px] font-normal opacity-60 leading-tight">{info.endTime}</div>
                  </th>
                );
              });
            })}
          </tr>
        </thead>
        <tbody>
          {allClasses.map((cls, ci) => (
            <tr key={cls} className={`border-b border-slate-100 ${ci % 2 === 0 ? 'bg-white' : 'bg-slate-50/50'}`}>
              {/* Kelas cell */}
              <td className="sticky left-0 z-10 px-2 py-2 border-r border-slate-200 font-black text-slate-700 text-[10px] bg-purple-50 min-w-[80px] w-[80px] leading-tight">
                {cls}
              </td>
              {/* Cells: one per day-period combo */}
              {DAYS.map(day => {
                const dayPeriods = allPeriods.filter(per => slots.some(s => s.day === day && s.period === per));
                if (!dayPeriods.length) return null;
                return dayPeriods.map(per => {
                  const cell = slots.filter(s => s.day === day && s.period === per && s.className === cls);
                  return (
                    <td key={`${day}-${per}`} className="px-1 py-1 border-r border-slate-100 last:border-r-0 text-center align-middle min-w-[65px]">
                      {cell.length === 0 ? (
                        <div className="text-slate-200 text-[10px]">—</div>
                      ) : cell.map((s, i) => (
                        <div key={i} className={`${getColor(s.subjectShort)} text-white rounded-lg px-1 py-1 mb-0.5`}>
                          <div className="font-black text-[10px] leading-tight">{s.subjectShort}</div>
                          <div className="text-[8px] opacity-80 leading-tight truncate">{s.teacherName.split(' ')[0]}</div>
                        </div>
                      ))}
                    </td>
                  );
                });
              })}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
};
